# Include inside the existing HTTPS server block. Preserve its certificate and site config.
# The application also enforces persistent daily global/per-client scan limits.
location = /api/bean-scan {
    client_max_body_size 10m;
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $host;
    proxy_set_header X-Coffee-Client-IP $remote_addr;
    proxy_set_header Origin $http_origin;
    proxy_read_timeout 45s;
    proxy_send_timeout 15s;
}
