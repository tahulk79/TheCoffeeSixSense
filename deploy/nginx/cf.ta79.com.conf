server {
    listen 80;
    server_name cf.ta79.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://cf.ta79.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name cf.ta79.com;
    ssl_certificate /etc/letsencrypt/live/cf.ta79.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cf.ta79.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:C6S:10m;
    ssl_session_tickets off;
    root /srv/coffee-six-sense/current;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location ~ /\. { deny all; }
    location /assets/ { try_files $uri =404; }
    location / {
        add_header Cache-Control "no-cache";
        # Repeat inherited headers because add_header overrides parent headers.
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
        try_files $uri $uri/ =404;
    }
}
