name: Approved production release
on:
  workflow_dispatch:
    inputs:
      approve_production:
        description: 'I approve modifying cf.ta79.com production with this main commit'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: coffee-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main' && inputs.approve_production == true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Stamp release
        run: echo "$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" > dist/health.txt
      - uses: actions/upload-artifact@v4
        with:
          name: production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://cf.ta79.com
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      RELEASE: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: production-dist
          path: dist
      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
      - name: Stage and activate release
        shell: bash
        run: |
          set -euo pipefail
          ssh_opts=(-i "$HOME/.ssh/deploy_key" -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes)
          remote="coffee-deploy@$DEPLOY_HOST"
          ssh "${ssh_opts[@]}" "$remote" "mkdir /srv/coffee-six-sense/incoming/$RELEASE"
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -r dist/. "$remote:/srv/coffee-six-sense/incoming/$RELEASE/"
          ssh "${ssh_opts[@]}" "$remote" "bash -s -- activate $RELEASE" < deploy/release.sh
      - name: Verify public HTTPS release
        shell: bash
        run: |
          set -euo pipefail
          actual=$(curl --fail --silent --show-error --retry 3 --max-time 20 "https://cf.ta79.com/health.txt?release=$RELEASE")
          test "$actual" = "$RELEASE"
          curl --fail --silent --show-error --max-time 20 https://cf.ta79.com/ > /dev/null
      - name: Remove SSH identity
        if: always()
        run: rm -f ~/.ssh/deploy_key ~/.ssh/known_hosts
