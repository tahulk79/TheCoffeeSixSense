name: Inspect VPS for bean AI service
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    environment: production
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Read-only SSH prerequisite check
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST" && test -n "$DEPLOY_PORT" && test -n "$DEPLOY_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/coffee_inspect_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/coffee_inspect_hosts
          chmod 600 ~/.ssh/coffee_inspect_key ~/.ssh/coffee_inspect_hosts
          trap 'rm -f ~/.ssh/coffee_inspect_key ~/.ssh/coffee_inspect_hosts' EXIT
          ssh -i ~/.ssh/coffee_inspect_key -p "$DEPLOY_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$HOME/.ssh/coffee_inspect_hosts" -o ConnectTimeout=15 "coffee-deploy@$DEPLOY_HOST" 'id -un; uname -s; if command -v node >/dev/null 2>&1; then node --version; else echo "Node runtime not found"; fi; if test -f /etc/coffee-bean-ai.env; then echo "Scanner environment file exists"; else echo "Scanner environment file missing"; fi; if command -v systemctl >/dev/null 2>&1; then systemctl is-active coffee-bean-ai || true; fi'
