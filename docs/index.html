function serverFillPercent(ml){
 const volume=Math.max(0,Math.min(600,Number(ml)||0));
 const marks=[[0,0],[100,8],[200,17],[300,28],[400,40],[500,53],[600,62]];
 const upper=marks.findIndex(([v])=>v>=volume);
 if(upper<=0)return 0;
 const [a,ha]=marks[upper-1],[b,hb]=marks[upper];
 return ha+(hb-ha)*(volume-a)/(b-a);
}

// Versioned illustrative game rules. Not extraction, TDS, or measured taste.
const firstPourKey='c6s.first-pour.v03';
const firstPourVersion='first-pour-0.3.1';
const firstPourAxes=['aroma','acidity','sweetness','bitterness','body','aftertaste'];
const firstPourBeans=[
 {id:'ethiopia',name:'Ethiopia · Washed',target:{dose:20,ratio:15,grind:18,temp:94,time:180}},
 {id:'colombia',name:'Colombia · Honey',target:{dose:20,ratio:15,grind:20,temp:93,time:180}},
 {id:'brazil',name:'Brazil · Natural',target:{dose:20,ratio:15,grind:22,temp:92,time:180}}
];
const firstPourLimits={dose:[12,30],ratio:[12,20],grind:[1,40],temp:[80,100],time:[90,360]};
function validFirstRecipe(recipe){return Boolean(firstPourBeans.some(b=>b.id===recipe?.bean)&&Object.entries(firstPourLimits).every(([k,[min,max]])=>Number.isFinite(recipe[k])&&recipe[k]>=min&&recipe[k]<=max));}
function firstPourPlan(recipe){if(!validFirstRecipe(recipe))throw Error('Invalid first-pour recipe');const total=Math.round(recipe.dose*recipe.ratio);return [Math.round(total*.2),Math.round(total*.7),total];}
function firstPourScore(recipe){
 if(!validFirstRecipe(recipe))throw Error('Invalid first-pour recipe');
 const target=firstPourBeans.find(b=>b.id===recipe.bean).target;
 const weights={grind:3,temp:4,ratio:6,time:.15};
 const deviations=Object.entries(weights).map(([field,weight])=>({field,delta:recipe[field]-target[field],penalty:Math.abs(recipe[field]-target[field])*weight}));
 return {modelVersion:firstPourVersion,score:Math.max(0,Math.round(100-deviations.reduce((s,d)=>s+d.penalty,0))),largest:deviations.reduce((a,b)=>a.penalty>=b.penalty?a:b).field,matched:deviations.every(d=>d.penalty===0)};
}
function startFirstPour(recipe){return {recipe:{...recipe},plan:firstPourPlan(recipe),stage:0,water:0,seconds:0,pouringSeconds:0,ready:false,done:false};}
function tickFirstPour(state,pouring,dt){
 if(!Number.isFinite(dt)||dt<0||dt>.1)throw Error('Invalid first-pour timestep');
 if(state.done||state.ready||!pouring)return state;
 const target=state.plan[state.stage],rate=state.plan[2]/12;
 const added=Math.min(target-state.water,rate*dt);
 const water=Math.min(target,state.water+added),complete=target-water<.000001;
 return {...state,water:complete?target:water,seconds:state.seconds+dt,pouringSeconds:state.pouringSeconds+added/rate,ready:complete,done:complete&&state.stage===2};
}
function advanceFirstPour(state){if(!state.ready||state.done)throw Error('Finish the current stage first');return {...state,stage:state.stage+1,ready:false};}
function validFirstFeedback(feedback){return Boolean(feedback&&['reflection','self-reported-real-tasting'].includes(feedback.context)&&typeof feedback.notes==='string'&&feedback.notes.length<=1000&&typeof feedback.nextChange==='string'&&feedback.nextChange.length<=1000&&(feedback.enjoyment===null||Number.isInteger(feedback.enjoyment)&&feedback.enjoyment>=1&&feedback.enjoyment<=5)&&feedback.axes&&firstPourAxes.every(k=>feedback.axes[k]===null||Number.isInteger(feedback.axes[k])&&feedback.axes[k]>=1&&feedback.axes[k]<=5));}
function validFirstMemory(entry){
 if(!entry||typeof entry.id!=='string'||!entry.id||typeof entry.date!=='string'||!Number.isFinite(Date.parse(entry.date))||entry.kind!=='first-pour-game-memory'||!validFirstRecipe(entry.recipe)||!validFirstFeedback(entry.feedback))return false;
 const expected=firstPourScore(entry.recipe),total=firstPourPlan(entry.recipe)[2];
 return entry.result?.modelVersion===firstPourVersion&&entry.result.score===expected.score&&entry.pour?.water===total&&entry.pour.stages===3&&Number.isFinite(entry.pour.playSeconds)&&entry.pour.playSeconds>=0;
}
function loadFirstMemories(raw){
 if(raw===null)return {records:[],writable:true};
 try{const parsed=JSON.parse(raw);if(parsed.version!==1||!Array.isArray(parsed.records)||!parsed.records.every(validFirstMemory)||new Set(parsed.records.map(r=>r.id)).size!==parsed.records.length)throw Error('Invalid memory');return {records:parsed.records,writable:true};}catch{return {records:[],writable:false,raw};}
}
function putFirstMemory(records,entry){if(!validFirstMemory(entry))throw Error('Invalid first-pour memory');return [...records.filter(r=>r.id!==entry.id),entry];}
function compareFirstMemories(a,b){return ['bean',...Object.keys(firstPourLimits)].filter(k=>a.recipe[k]!==b.recipe[k]);}

// Presentation-only drawdown, independent of the recipe score and saved measurements.
function firstPourDrawdown(collected,poured,total,dt){
 if(![collected,poured,total,dt].every(Number.isFinite)||total<=0||collected<0||poured<collected||poured>total||dt<0||dt>.1)throw Error('Invalid visual drawdown');
 return Math.min(poured,collected+total/18*dt);
}

function mountFirstPour(initialLanguage='vi'){
 const root=document.createElement('section');root.id='first-pour';root.className='first-pour-wrap';root.hidden=true;document.querySelector('#cafe').after(root);
 let collected=0;
 let lang=initialLanguage,recipe={bean:'ethiopia',...firstPourBeans[0].target},state=null,screen='setup',held=false,toggled=false,frame=0,last=null,draft=null,saved=false,notice='',deleteId=null,compareA=null,compareB=null;
 let store;try{store=loadFirstMemories(localStorage.getItem(firstPourKey));}catch{store={records:[],writable:false};}
 let records=store.records;
 const tx=(vi,en)=>lang==='vi'?vi:en;
 const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const label=key=>({dose:tx('Cà phê (g)','Coffee (g)'),ratio:tx('Tỷ lệ nước / cà phê','Water / coffee ratio'),grind:tx('Cỡ xay · thang trò chơi','Grind · game scale'),temp:tx('Nước (°C)','Water (°C)'),time:tx('Thời gian công thức (giây)','Recipe time (seconds)'),bean:tx('Hạt','Bean'),aroma:tx('Hương thơm','Aroma'),acidity:tx('Độ chua','Acidity'),sweetness:tx('Độ ngọt','Sweetness'),bitterness:tx('Độ đắng','Bitterness'),body:tx('Thể chất','Body'),aftertaste:tx('Hậu vị','Aftertaste')}[key]);
 const stages=()=>[tx('Ủ nở · bloom','Bloom'),tx('Rót chính','Main pour'),tx('Rót cuối','Final pour')];
 const clock=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(Math.floor(n%60)).padStart(2,'0')}`;
 const beanName=id=>firstPourBeans.find(b=>b.id===id)?.name||id;
 const emptyFeedback=()=>({context:'reflection',notes:'',nextChange:'',enjoyment:null,axes:Object.fromEntries(firstPourAxes.map(k=>[k,null]))});
 function download(value,name,raw=false){const url=URL.createObjectURL(new Blob([raw?value:JSON.stringify(value,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function stop(){held=false;toggled=false;}
 function capture(){const form=root.querySelector('#fp-recipe');if(form){recipe={bean:form.elements.bean.value,...Object.fromEntries(Object.keys(firstPourLimits).map(k=>[k,Number(form.elements[k].value)]))};}const feedback=root.querySelector('#fp-feedback');if(feedback&&draft){draft.feedback={context:feedback.elements.context.value,notes:feedback.elements.notes.value,nextChange:feedback.elements.nextChange.value,enjoyment:feedback.elements.enjoyment.value?Number(feedback.elements.enjoyment.value):null,axes:Object.fromEntries(firstPourAxes.map(k=>[k,feedback.elements[k].value?Number(feedback.elements[k].value):null]))};}}
 function persist(next){if(!store.writable){notice=tx('Dữ liệu cũ chưa đọc được. Hãy tải bản gốc để phục hồi; không ghi đè.','Existing data could not be read. Download the original for recovery; it will not be overwritten.');return false;}try{localStorage.setItem(firstPourKey,JSON.stringify({version:1,records:next}));records=next;notice=tx('Đã lưu trên trình duyệt này.','Saved in this browser.');return true;}catch{notice=tx('Chưa lưu được. Hãy thử lại hoặc tải bản nháp; tiến độ cũ vẫn giữ nguyên.','Could not save. Retry or download the draft; previous records are preserved.');return false;}}
 function configure(){return `<form id="fp-recipe"><label>${label('bean')}<select name="bean">${firstPourBeans.map(b=>`<option value="${b.id}" ${b.id===recipe.bean?'selected':''}>${b.name}</option>`).join('')}</select></label><p class="help">${tx('Ba lô hạt minh họa, không đại diện mọi cà phê cùng xuất xứ hoặc sơ chế.','Three illustrative lots, not representative of all coffee with the same origin or process.')}</p><div class="fields">${Object.entries(firstPourLimits).map(([key,[min,max]])=>`<label>${label(key)}<input name="${key}" type="number" inputmode="decimal" required min="${min}" max="${max}" step="${['dose','ratio'].includes(key)?'.1':'1'}" value="${recipe[key]}"></label>`).join('')}</div><p id="fp-target">${tx('Nước mục tiêu','Target water')}: ${validFirstRecipe(recipe)?firstPourPlan(recipe)[2]:'—'} ml · 1:${recipe.ratio}</p><p class="help">${tx('Thời gian ở trên là đầu vào công thức trong mô hình; thời gian bạn chơi được ghi riêng và không phải thời gian pha ngoài đời.','Recipe time above is a model input; your play time is recorded separately and is not real brewing time.')}</p><div class="actions"><button type="submit" id="fp-start">${tx('Bắt đầu ba nhịp rót','Start three-stage pour')}</button><button type="button" id="fp-preset" class="secondary">${tx('Dùng mốc minh họa của hạt','Use the bean’s game preset')}</button></div></form>`;}
 function stageTip(){return [tx('Làm ướt đều bột cà phê. Thả nút bất cứ lúc nào để quan sát.','Wet the grounds evenly. Release at any time to observe.'),tx('Rót nhẹ và đều. Game sẽ tự dừng khi đủ nước cho nhịp này.','Pour gently and evenly. The game stops at this stage’s target.'),tx('Hoàn thành lượng nước còn lại, rồi chờ giọt cà phê cuối.','Finish the remaining water, then watch the last coffee drops.')][state.stage];}
 function stageStatus(){return state.done?tx('Đủ nước · đang chờ giọt cuối…','Water complete · waiting for the last drops…'):state.ready?tx('Đã đủ nhịp này · bấm “Sang nhịp” khi sẵn sàng.','Stage complete · continue when you are ready.'):tx('Giữ nút để rót, hoặc bật rót tự động.','Hold to pour, or switch on automatic pouring.');}
 function nextLabel(){return state.done?tx('Đang chờ giọt cuối','Waiting for final drops'):state.stage===2?tx('Nhịp cuối','Final stage'):tx('Sang nhịp ','Continue to stage ')+(state.stage+2);}
 function pour(){const plan=state.plan;return `<div class="fp-workspace" id="fp-workspace" tabindex="-1" aria-label="${tx('Bàn rót ba nhịp','Three-stage pouring station')}"><ol class="fp-stages">${stages().map((name,i)=>`<li ${i===state.stage?'aria-current="step"':''}>${i+1}. ${name}<small>${plan[i]-(plan[i-1]||0)} ml</small></li>`).join('')}</ol><div class="fp-stage-info"><h3 id="fp-stage-title">${stages()[state.stage]}</h3><p id="fp-stage-tip">${stageTip()}</p></div><div class="fp-visual"><div class="fp-clock"><span>${tx('Thao tác','Active time')}: <b id="fp-clock">${clock(state.seconds)}</b></span><span>${tx('Đã rót','Poured')}: <b id="fp-water">${Math.round(state.water)}</b> / ${plan[2]} ml</span></div><div class="fp-station" aria-hidden="true"><div class="fp-shelf"></div><div class="brew-apparatus">${brewEquipment('first')}</div><div class="fp-table"></div></div><progress id="fp-progress" max="${plan[2]}" value="${state.water}" aria-label="${tx('Tổng lượng nước đã rót','Total water poured')}"></progress></div><div class="fp-controls"><p id="fp-stage-status" role="status" tabindex="-1">${stageStatus()}</p><button type="button" class="hold-pour" id="fp-hold" ${state.ready?'disabled':''}>${tx('Nhấn giữ để rót','Hold to pour')}</button><div class="fp-control-row"><button type="button" class="secondary" id="fp-toggle" aria-pressed="false" ${state.ready?'disabled':''}>${tx('Rót tự động','Auto pour')}</button><button type="button" id="fp-next" ${!state.ready||state.done?'disabled':''}>${nextLabel()}</button></div></div></div><details class="fp-howto"><summary>${tx('Cách chơi & giới hạn mô phỏng','Controls & simulation limits')}</summary><p class="help">${tx('Giữ Space/Enter trên nút rót, hoặc dùng “Rót tự động” để không cần nhấn giữ. Mỗi nhịp tự dừng ở mốc nước. Trong pha thật, bloom giúp khí thoát ra; thời gian cần tùy cà phê. Nhịp rót và đoạn chờ trong game được rút ngắn, không mô phỏng chiết xuất hay thời gian pha thật.','Hold Space/Enter on the pour button, or use Auto pour for hold-free control. Each stage stops at its water target. In real brewing, blooming lets gas escape; timing depends on the coffee. Game pouring and waiting are shortened and do not simulate extraction or real brewing time.')}</p></details><button id="fp-reset" type="button" class="secondary">${tx('Pha lại từ đầu','Restart this cup')}</button>`;}

 function selectRating(name,value,title){return `<label>${title}<select name="${name}"><option value="">${tx('Chưa đánh giá','Not rated')}</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${value===n?'selected':''}>${n}</option>`).join('')}</select></label>`;}
 function outcome(){const score=draft.result,feedback=draft.feedback;return `<h3 tabindex="-1" id="fp-result-title">${tx('Ba nhịp rót đã hoàn thành','Three stages complete')} ☕</h3><p>${draft.pour.water} ml · ${tx('Thời gian thao tác','Active play time')} ${clock(draft.pour.playSeconds)}</p><div class="fp-score"><strong>${score.score}/100</strong><span>${tx('Mức khớp mốc công thức trong game','Match to the game recipe preset')}</span></div><p>${score.matched?tx('Bạn khớp mốc minh họa của lô này. Thử đổi một biến rồi so sánh hai ký ức.','You matched this lot’s game preset. Try changing one variable and compare the memories.'):tx('Biến lệch nhiều nhất theo trọng số game: ','Largest weighted difference in the game: ')+label(score.largest)+'. '+tx('Thử đổi riêng biến này, giữ các biến còn lại.','Try changing only this variable and keeping the others fixed.')}</p><p class="help">${tx('Điểm chỉ so công thức với mốc được thiết kế cho trò chơi; nhịp chạm không đổi điểm. Không phải TDS, hiệu suất chiết xuất hay điểm hương vị thật.','The score only compares the recipe to a designed game preset; tap rhythm does not change it. It is not TDS, extraction yield, or real taste quality.')} ${escape(score.modelVersion)}</p><form id="fp-feedback"><h4>${tx('Coffee Memory · cảm nhận của bạn','Coffee Memory · your experience')}</h4><label>${tx('Ngữ cảnh của ghi chú','Context for your notes')}<select name="context"><option value="reflection" ${feedback.context==='reflection'?'selected':''}>${tx('Suy ngẫm / tưởng tượng khi chơi','Reflection / imagination while playing')}</option><option value="self-reported-real-tasting" ${feedback.context==='self-reported-real-tasting'?'selected':''}>${tx('Tôi tự báo đã nếm một ly thật riêng','I report tasting a separate real cup')}</option></select></label><p class="help">${tx('Tất cả thang cảm quan dưới đây do bạn nhập, không do mô hình dự đoán. Tự báo nếm thật không xác minh công thức hay phép đo. Dùng “Ghi lượt pha thật” cho hồ sơ thực nghiệm.','Every sensory rating below is your own input, not a model prediction. A self-reported real tasting does not verify a recipe or measurement. Use “Record a real brew” for experimental records.')}</p><details><summary>${tx('Sáu thuộc tính cảm quan · tùy chọn','Six sensory attributes · optional')}</summary><p class="help">${tx('Cường độ 1–5: 1 rất thấp, 5 rất cao; cao hơn không có nghĩa ngon hơn.','Intensity 1–5: 1 very low, 5 very high; higher does not mean better.')}</p><div class="fields">${firstPourAxes.map(k=>selectRating(k,feedback.axes[k],label(k))).join('')}</div></details>${selectRating('enjoyment',feedback.enjoyment,tx('Mức yêu thích cá nhân · 1–5 (tùy chọn)','Personal enjoyment · 1–5 (optional)'))}<label>${tx('Ghi chú / khoảnh khắc của bạn','Your notes / moment')}<textarea name="notes" rows="3" maxlength="1000">${escape(feedback.notes)}</textarea></label><label>${tx('Lần sau tôi muốn đổi điều gì?','What would I change next time?')}<textarea name="nextChange" rows="2" maxlength="1000">${escape(feedback.nextChange)}</textarea></label><div class="actions"><button type="submit" id="fp-save">${saved?tx('Cập nhật ký ức này','Update this memory'):tx('Lưu Coffee Memory','Save Coffee Memory')}</button><button type="button" class="secondary" id="fp-draft-export">${tx('Tải bản nháp JSON','Download draft JSON')}</button><button type="button" class="secondary" id="fp-retry">${tx('Chỉnh một biến & thử lại','Change one variable & retry')}</button></div></form>`;}
 function memory(){return `<details class="fp-memory" ${records.length?'open':''}><summary>Coffee Memory · ${records.length} ${tx('lần pha ba nhịp','three-stage brews')}</summary><p class="help">${tx('Lưu riêng trong trình duyệt này, không có tài khoản hay đồng bộ. Xóa dữ liệu trình duyệt, đổi thiết bị hoặc dùng chế độ riêng tư có thể làm mất ký ức. Xuất JSON để giữ bản sao. Nhật ký cũ và lượt pha thật vẫn ở mục riêng.','Stored only in this browser, without accounts or sync. Clearing browser data, changing devices, or private browsing may lose memories. Export JSON for backup. Older journals and real brews remain in their own sections.')}</p><button type="button" id="fp-export" class="secondary">${tx('Xuất Coffee Memory JSON','Export Coffee Memory JSON')}</button>${!store.writable?`<p class="warning">${tx('Dữ liệu chưa đọc được; ghi/xóa bị khóa để bảo vệ bản gốc.','Data could not be read; saving/deleting is locked to protect the original.')}</p>${store.raw!==undefined?`<button type="button" id="fp-recovery">${tx('Tải dữ liệu gốc','Download original data')}</button>`:''}`:''}${records.length>1?`<section class="fp-compare"><h4>${tx('So sánh hai ký ức','Compare two memories')}</h4><div class="fields">${['a','b'].map((key,i)=>`<label>${tx('Lần pha','Brew')} ${key.toUpperCase()}<select id="fp-compare-${key}">${records.map((r,index)=>`<option value="${escape(r.id)}" ${r.id===(i?compareB:compareA)?'selected':''}>#${index+1} · ${beanName(r.recipe.bean)}</option>`).join('')}</select></label>`).join('')}</div><div id="fp-comparison"></div></section>`:''}<div class="fp-history">${records.length?records.slice().reverse().map(r=>`<article><strong>${beanName(r.recipe.bean)} · ${r.result.score}/100 ${tx('(game)','(game)')}</strong><small>${escape(new Date(r.date).toLocaleString(lang==='vi'?'vi-VN':'en-GB'))}</small><p>${Object.keys(firstPourLimits).map(k=>`${label(k)}: ${r.recipe[k]}`).join(' · ')}</p><p>${tx('Ghi chú','Notes')}: ${escape(r.feedback.notes||'—')}</p><p>${tx('Lần sau','Next time')}: ${escape(r.feedback.nextChange||'—')}</p><p class="help">${r.feedback.context==='reflection'?tx('Suy ngẫm trong game','Game reflection'):tx('Tự báo nếm một ly thật riêng · chưa xác minh','Self-reported separate real tasting · unverified')} · ${tx('Yêu thích','Enjoyment')}: ${r.feedback.enjoyment??'—'}/5</p><p class="help">${firstPourAxes.map(k=>`${label(k)}: ${r.feedback.axes[k]??'—'}`).join(' · ')}</p>${deleteId===r.id?`<p>${tx('Xóa ký ức này khỏi trình duyệt?','Delete this memory from the browser?')}</p><button type="button" data-confirm-delete="${escape(r.id)}">${tx('Xác nhận xóa','Confirm delete')}</button><button type="button" id="fp-cancel-delete" class="secondary">${tx('Giữ lại','Keep it')}</button>`:`<button type="button" class="secondary" data-delete="${escape(r.id)}" ${store.writable?'':'disabled'}>${tx('Xóa ký ức này','Delete this memory')}</button>`}</article>`).join(''):`<p>${tx('Chưa có ký ức. Hoàn thành ba nhịp rồi lưu ly đầu tiên.','No memories yet. Complete three stages and save your first cup.')}</p>`}</div></details>`;}
 function compare(){const target=root.querySelector('#fp-comparison');if(!target)return;compareA=root.querySelector('#fp-compare-a').value;compareB=root.querySelector('#fp-compare-b').value;const a=records.find(r=>r.id===compareA),b=records.find(r=>r.id===compareB);if(!a||!b||a.id===b.id){target.textContent=tx('Chọn hai ký ức khác nhau.','Choose two different memories.');return;}const changed=compareFirstMemories(a,b);target.innerHTML=`<p>${tx('Biến đã đổi','Changed variables')}: ${changed.length?changed.map(label).join(', '):tx('không có','none')}. ${changed.length>1?tx('Nhiều biến cùng đổi: không thể quy khác biệt cho một biến riêng.','Multiple variables changed: the difference cannot be attributed to one variable.'):tx('So sánh này để quan sát, không chứng minh quan hệ nhân quả ngoài đời.','This comparison supports observation, not proof of real-world causation.')}</p><div class="fp-table-scroll"><table><caption>${tx('Công thức và cảm nhận · A / B','Recipe and experience · A / B')}</caption><thead><tr><th>${tx('Thuộc tính','Attribute')}</th><th>A</th><th>B</th></tr></thead><tbody>${['bean',...Object.keys(firstPourLimits),'score',...firstPourAxes,'enjoyment','notes','nextChange','context'].map(k=>`<tr><th scope="row">${label(k)||({score:tx('Điểm game','Game score'),enjoyment:tx('Yêu thích · 1–5','Enjoyment · 1–5'),notes:tx('Ghi chú','Notes'),nextChange:tx('Lần sau','Next time'),context:tx('Ngữ cảnh','Context')}[k])}</th>${[a,b].map(r=>{let value=k==='bean'?beanName(r.recipe.bean):k==='score'?r.result.score:firstPourAxes.includes(k)?r.feedback.axes[k]:k==='context'?(r.feedback.context==='reflection'?tx('Suy ngẫm game','Game reflection'):tx('Tự báo nếm thật · chưa xác minh','Self-reported real tasting · unverified')):r.recipe[k]??r.feedback[k];return `<td>${escape(value??'—')}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>`;}

 root.querySelector('#fp-preset').onclick=()=>{capture();recipe={bean:recipe.bean,...firstPourBeans.find(b=>b.id===recipe.bean).target};root.querySelector('#fp-recipe').remove();render();};
 form.onsubmit=e=>{e.preventDefault();capture();if(!form.reportValidity()||!validFirstRecipe(recipe))return;state=startFirstPour(recipe);collected=0;screen='pour';draft=null;saved=false;notice='';stop();render();root.querySelector('#fp-workspace').scrollIntoView({behavior:'instant',block:'start'});root.querySelector('#fp-hold').focus({preventScroll:true});last=null;frame=requestAnimationFrame(tick);};

 function updatePourStage(){

 function tick(now){if(screen!=='pour'||root.hidden)return;const dt=cafeFrameDelta(now,last);last=now;if(!document.hidden){const before=state;state=tickFirstPour(state,held||toggled,dt);collected=firstPourDrawdown(collected,state.water,state.plan[2],dt);if(state.done&&state.water-collected<.001){stop();screen='result';const feedback=emptyFeedback();draft={id:crypto.randomUUID(),date:new Date().toISOString(),kind:'first-pour-game-memory',recipe:{...recipe},result:firstPourScore(recipe),pour:{water:state.water,stages:3,playSeconds:Number(state.seconds.toFixed(3))},feedback};render();focus('#fp-result-title');return;}if(state.ready&&!before.ready){const wasPourButton=['fp-hold','fp-toggle'].includes(document.activeElement?.id);stop();updatePourStage();if(wasPourButton)root.querySelector(state.done?'#fp-stage-status':'#fp-next').focus({preventScroll:true});}else paintPour();}frame=requestAnimationFrame(tick);}

function createCafeMusic(){
 let context=null,master=null,timer=null,wanted=false,busy=false,error=false,step=0,next=0,volume=25,root=null,lang='vi';
 try{const stored=localStorage.getItem('c6s.music.volume');if(stored!==null&&Number.isFinite(Number(stored)))volume=Math.max(0,Math.min(100,Number(stored)));}catch{}
 const text=(vi,en)=>lang==='vi'?vi:en;
 const chords=[[48,55,59,62,64],[45,52,55,59,62],[50,57,60,64,65],[43,50,53,57,62]];
 const melody=[76,null,74,71,null,67,71,null,72,null,71,67,null,64,67,null,69,null,72,76,null,74,72,null,71,null,69,67,null,62,67,null];
 function note(midi,when,duration,gain){
  const frequency=440*2**((midi-69)/12),envelope=context.createGain();
  envelope.gain.setValueAtTime(0,when);envelope.gain.linearRampToValueAtTime(gain,when+.018);envelope.gain.exponentialRampToValueAtTime(.0001,when+duration);envelope.connect(master);
  for(const [multiple,level] of [[1,1],[2,.18],[3,.035]]){const oscillator=context.createOscillator(),partial=context.createGain();oscillator.type='sine';oscillator.frequency.value=frequency*multiple;partial.gain.value=level;oscillator.connect(partial);partial.connect(envelope);oscillator.start(when);oscillator.stop(when+duration+.02);oscillator.onended=()=>{oscillator.disconnect();partial.disconnect();};}
  setTimeout(()=>envelope.disconnect(),(when-context.currentTime+duration+.1)*1000);
 }
 function schedule(){if(!context||context.state!=='running'||!wanted)return;while(next<context.currentTime+.35){const chord=chords[Math.floor(step/8)%4];if(step%8===0){chord.slice(1).forEach((n,i)=>note(n,next+i*.025,3.1,.035));note(chord[0]-12,next,2.8,.065);}if(step%2===0)note(chord[1+(step/2)%4],next,1.2,.025);const tune=melody[step%32];if(tune!==null)note(tune,next+.03,1.1,.045);step=(step+1)%32;next+=60/72/2;}}
 function paint(){if(!root)return;const button=root.querySelector('#cafe-music'),status=root.querySelector('#music-status');if(!button)return;button.disabled=busy;button.setAttribute('aria-pressed',String(wanted));button.textContent=wanted?text('Tắt nhạc','Turn music off'):text('Bật nhạc','Turn music on');button.dataset.state=context?.state||'idle';status.textContent=error?text('Không phát được âm thanh. Thử bật lại.','Audio unavailable. Try again.'):wanted?text('Đang bật · tự tạm dừng khi ẩn trang','On · pauses when the page is hidden'):text('Piano êm · hòa âm nguyên bản · 72 BPM','Soft keys · original harmony · 72 BPM');}
 async function sync(){if(!context)return;try{if(wanted&&!document.hidden){await context.resume();if(!timer){next=context.currentTime+.08;schedule();timer=setInterval(schedule,150);}}else{clearInterval(timer);timer=null;await context.suspend();}}catch{error=true;wanted=false;clearInterval(timer);timer=null;}paint();}
 async function toggle(){if(busy)return;busy=true;error=false;wanted=!wanted;try{if(wanted&&!context){const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)throw Error('Unavailable');context=new Audio();master=context.createGain();master.gain.value=volume/100*.65;const compressor=context.createDynamicsCompressor();master.connect(compressor);compressor.connect(context.destination);}await sync();}catch{error=true;wanted=false;}finally{busy=false;paint();}}
 document.addEventListener('visibilitychange',()=>{void sync();});
 return {markup(language){lang=language;return `<section class="cafe-sound" aria-label="${text('Nhạc nền quán cà phê','Café background music')}"><div><span class="sound-title">${text('Một góc bình yên','A quiet corner')}</span><small id="music-status" role="status"></small></div><button id="cafe-music" class="secondary" type="button" aria-pressed="false"></button><label class="music-volume">${text('Âm lượng','Volume')}<input id="cafe-volume" type="range" min="0" max="100" value="${volume}"/></label></section>`;},bind(element){root=element;root.querySelector('#cafe-music').onclick=toggle;root.querySelector('#cafe-volume').oninput=e=>{volume=Number(e.target.value);if(master)master.gain.setTargetAtTime(volume/100*.65,context.currentTime,.05);try{localStorage.setItem('c6s.music.volume',String(volume));}catch{}};paint();}};
}

const counterLessons = [

const cafeModelVersion = 'counter-assumptions-v3';
// A fictional learning model, not a calibrated extraction or sensory predictor.
const cafeSpeed = 6;
const cafeBeans = [
 {id:'brazil',name:['Lô A · Brazil · rang vừa đậm','Lot A · Brazil · medium-dark roast'],notes:['Chocolate & hạt','Chocolate & nuts'],base:[1,2,3],extractability:1.25},
 {id:'colombia',name:['Lô B · Colombia · rang vừa','Lot B · Colombia · medium roast'],notes:['Caramel & trái cây','Caramel & fruit'],base:[3,2,3],extractability:1},
 {id:'ethiopia',name:['Lô C · Ethiopia · rang sáng','Lot C · Ethiopia · light roast'],notes:['Hoa & cam chanh','Floral & citrus'],base:[4,1,3],extractability:.9}
];
const cafeGuests = [
 {name:'An',request:['“Một ly dịu, ít chua, đậm vừa thôi nhé.”','“Something mellow, low in acidity, with a medium strength.”'],target:[1,2,3]},
 {name:'Linh',request:['“Tôi thích vị trái cây sáng, nhẹ và ít đắng.”','“I like bright fruit, a light cup and little bitterness.”'],target:[4,1,2]},
 {name:'Minh',request:['“Cho tôi ly đậm, hơi đắng, ít chua để bắt đầu ngày mới.”','“A strong, slightly bitter, low-acidity cup to start my day.”'],target:[1,3,4]}
];
function cafeStart(bean='brazil',heat=92){
 if(!cafeBeans.some(b=>b.id===bean)||![88,92,96].includes(heat))throw Error('Invalid cafe recipe');
 return {bean,heat,time:0,pourTime:0,started:false,wasPouring:false,poured:0,water:0,absorbed:0,drained:0,overflow:0,contact:0,holds:0,extracted:0,solubles:0,cupSolubles:0,lostSolubles:0,events:[],done:false};
}
function cafeTick(state,holding,seconds){
 if(!Number.isFinite(seconds)||seconds<0)throw Error('Invalid timestep');
 if(state.done||(!state.started&&!holding))return {...state};
 const s={...state,events:[...state.events]},dt=Math.min(.1,seconds);
 let added=holding?Math.min(24*dt,180-s.poured):0;
 if(holding&&180-s.poured-added<1)added=180-s.poured;
 const pouring=added>0;
 if(!s.started&&pouring){s.started=true;s.events.push({type:'start',time:0,volume:0});}
 if(pouring!==s.wasPouring){s.events.push({type:pouring?'pour':'pause',time:s.time,volume:s.poured});if(pouring)s.holds++;}
 s.wasPouring=pouring;s.time+=dt*cafeSpeed;s.pourTime+=Math.min(dt,added/24)*cafeSpeed;s.poured+=added;s.water+=added;
 // Fixed 12 g dose, 24 ml water retention. Time advances only after first water.
 const retained=Math.min(s.water,24-s.absorbed);s.absorbed+=retained;s.water-=retained;
 if(s.water>.5){
  s.contact+=dt*cafeSpeed;
  const rate=.009*cafeBeans.find(b=>b.id===s.bean).extractability*Math.exp((s.heat-92)*.035)*Math.min(1,s.water/12);
  const dissolved=(12*.28-s.extracted)*(1-Math.exp(-rate*dt*cafeSpeed));
  s.extracted+=dissolved;s.solubles+=dissolved;
 }
 const spill=Math.max(0,s.water-64);
 const lost=s.water>0?s.solubles*spill/s.water:0;
 s.overflow+=spill;s.water-=spill;s.solubles-=lost;s.lostSolubles+=lost;
 const out=Math.min(s.water,(5+s.water*.12)*dt);
 const cup=s.water>0?s.solubles*out/s.water:0;
 s.water-=out;s.drained+=out;s.solubles-=cup;s.cupSolubles+=cup;

 return {version:3,kind:'game_simulation',modelVersion:cafeModelVersion,evidence:{flavor:'fictional_lot_profile',physics:'uncalibrated_game_assumption',sourceReview:'reviewed_documents_not_model_validation',sourceRegisterVersion:'supplied-source-review-v2',confidence:null},bean:state.bean,heat:state.heat,flavor,guest,fit,distance,zone,time:state.time,pourTime:state.pourTime,waitTime:state.time-state.pourTime,overflow:Math.round(state.overflow),beverage:Math.round(state.drained),holds:state.holds,contact:state.contact,events:state.events};

const weights = { dose: 3, water: 0.16, temp: 4, grind: 3 };

  if (Number(parameters[field]) === bean.target[field]) return 'You matched this game recipe. Try another bean, or change one setting and compare the results.';
  const names = { dose: 'dose', water: 'water volume', temp: 'temperature', grind: 'grind setting' };

function progression(sessions, counterRounds = []) {

  const xp = sessions.length * 10 + discoveries * 5 + counterProgress(counterRounds).xp;
  const practices=[...sessions,...counterRounds];
  const allDiscoveries=discoveries+counterProgress(counterRounds).completed.length+counterRounds.filter(r=>r.note?.trim()).length;
  const level = Math.floor(xp / 50) + 1;
  const badges = [

    { name: 'Curious taster', hint: 'Record three discoveries', earned: allDiscoveries >= 3 },
    { name: 'Bean explorer', hint: 'Save brews with all three starter beans', earned: ['ethiopia', 'colombia', 'brazil'].every(id => practices.some(s => s.bean === id)) },
    { name: 'Practice makes progress', hint: 'Save five brews', earned: practices.length >= 5 }

  return { xp, level, remaining: 50 - xp % 50, progress: xp % 50, badges };
}

const fields = ['dose', 'water', 'temp', 'grind'];
const starterBeans = ['ethiopia', 'colombia', 'brazil'];

// Only saved sessions count. Missions are derived so old journals keep their progress.
function missionProgress(sessions) {
  const visited = starterBeans.filter(bean => sessions.some(s => s.bean === bean));
  const discoveries = sessions.filter(s => typeof s.discovery === 'string' && s.discovery.trim()).length;
  const controlled = sessions.some((current, index) => {
    const previous = sessions[index - 1];
    if (!previous || current.bean !== previous.bean || !(typeof current.discovery === 'string' && current.discovery.trim())) return false;
    if (!fields.every(field => Number.isFinite(current.parameters?.[field]) && Number.isFinite(previous.parameters?.[field]))) return false;
    if(Boolean(current.pourRun)!==Boolean(previous.pourRun))return false;
    if(current.pourRun&&current.pourRun.scenario!==previous.pourRun.scenario)return false;
    if(current.pourRun&&(!validPourRun(current.pourRun,true)||!validPourRun(previous.pourRun,true)))return false;
    const before=previous.pourRun?pourSummary(previous.pourRun).decisions:[];
    const after=current.pourRun?pourSummary(current.pourRun).decisions:[];
    // A response to a newly changed cue is a consequence, not another independent variable.
    const actionChanges=after.filter((decision,i)=>decision.cue===before[i].cue&&decision.action!==before[i].action).length;
    return fields.filter(field => current.parameters[field] !== previous.parameters[field]).length + Number((current.technique || 'pulse') !== (previous.technique || 'pulse')) + actionChanges === 1;
  });
  const steadyBean = starterBeans.find(bean => sessions.filter(s => s.bean === bean && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 90).length >= 3);
  const bestRun = Math.max(0, ...starterBeans.map(bean => sessions.filter(s => s.bean === bean && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 90).length));
  const missions = [
    { id: 'explore', title: 'Meet the beans', description: 'Save one brew with each of the three starter beans.', count: visited.length, total: 3, bean: starterBeans.find(bean => !visited.includes(bean)) },
    { id: 'discover', title: 'Notice something new', description: 'Save three brews with a discovery: what did you notice or want to try next?', count: Math.min(discoveries, 3), total: 3 },
    { id: 'experiment', title: 'Change one thing', description: 'Save two consecutive brews of the same bean with exactly one recipe setting changed. Add a discovery to the second brew.', count: Number(controlled), total: 1 },
    { id: 'steady', title: 'Find your rhythm', description: 'Save three brews of the same bean with a simulated balance of 90 or more. This is a game recipe goal, not a taste assessment.', count: Math.min(bestRun, 3), total: 3, bean: steadyBean }
  ];
  let unlocked = true;
  return missions.map(mission => {
    const complete = mission.count >= mission.total;
    const result = { ...mission, complete, locked: !unlocked };
    unlocked = unlocked && complete;
    return result;
  });
}

const recipeFields = ['dose', 'water', 'temp', 'grind'];
const limits = { dose: [5, 50], water: [50, 800], temp: [75, 100], grind: [1, 40] };
const coffeeBeans = [
  { id: 'ethiopia', name: 'Ethiopia · Washed', target: { dose: 20, water: 300, temp: 94, grind: 18 }, notes: 'floral' },
  { id: 'colombia', name: 'Colombia · Honey', target: { dose: 20, water: 300, temp: 93, grind: 20 }, notes: 'caramel' },
  { id: 'brazil', name: 'Brazil · Natural', target: { dose: 20, water: 300, temp: 92, grind: 22 }, notes: 'chocolate' }

function validRecipe(parameters) {

}
function brewScore(bean, parameters, technique = 'pulse') {
  if (!bean || !validRecipe(parameters) || !['pulse', 'steady', 'fast'].includes(technique)) throw new Error('Invalid recipe');

  return Math.max(0, Math.round(100 - recipeFields.reduce((sum, k) => sum + Math.abs(parameters[k] - bean.target[k]) * weights[k], 0) - ({pulse:0,steady:4,fast:12}[technique])));
}

  const field = recipeFields.slice().sort((a,b) => Math.abs(parameters[b]-bean.target[b])*weights[b]-Math.abs(parameters[a]-bean.target[a])*weights[a])[0];
  if (parameters[field] !== bean.target[field]) return { field, direction: parameters[field] > bean.target[field] ? 'lower' : 'raise' };

    if (!Array.isArray(sessions) || !sessions.every(s => s && validOptional(s) && (coffeeBeans.some(b => b.id === s.bean) || (typeof s.bean === 'string' && /^custom-[a-zA-Z0-9-]+$/.test(s.bean) && typeof s.beanProfile?.name === 'string' && s.beanProfile.name.trim().length > 0 && s.beanProfile.name.length <= 160)) && validRecipe(s.parameters) && typeof s.date === 'string' && Number.isFinite(Date.parse(s.date)) && ((s.bean.startsWith('custom-') && s.simulatedScore === null) || (!s.bean.startsWith('custom-') && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 0 && s.simulatedScore <= 100)))) throw new Error('Invalid journal');

function evaluatePourChoice(run,index,action) {
 const before={...run,actions:run.actions.slice(0,index)};const cue=pourSituation(before);
 const good=action===cue.recommended;
 return {stage:pourStageNames[index],cue:cue.cue,action,good,penalty:good?0:cue.penalty,effect:good?cue.success:cue.miss};
}
function pourSituation(run) {
 if(!validPourRun(run)||run.actions.length>=3)throw new Error('No active pour stage');
 const index=run.actions.length;let cue,recommended,success,miss,penalty;
 if(index===0){
  const dry=run.technique==='fast'||run.scenario===2||(run.technique==='pulse'&&run.scenario===0);
  cue=dry?'dryBloom':'evenBloom';recommended=dry?'swirl':'settle';success=dry?'wetGrounds':'keptBed';miss=dry?'leftDry':'extraAgitation';penalty=6;
 }else if(index===1){
  const first=evaluatePourChoice(run,0,run.actions[0]);
  cue=first.effect==='leftDry'?'unevenFlow':run.technique==='fast'||run.scenario===0?'highWater':'lowWater';
  recommended=cue==='unevenFlow'?'redistribute':cue==='highWater'?'pause':'feed';
  success=cue==='unevenFlow'?'recoveredFlow':cue==='highWater'?'drainedWater':'maintainedWater';
  miss=cue==='unevenFlow'?'keptUneven':cue==='highWater'?'crowdedWater':'lostWater';penalty=8;
 }else{
  const middle=evaluatePourChoice(run,1,run.actions[1]);
  const tilted=!middle.good||run.scenario===2;
  cue=tilted?'tiltedBed':'levelBed';recommended=tilted?'recenter':'finishEven';success=tilted?'centeredFinish':'calmFinish';miss=tilted?'leftTilted':'disturbedFinish';penalty=6;
 }
 return {stage:pourStageNames[index],cue,recommended,success,miss,penalty,choices:pourChoices[index]};
}
function choosePourAction(run,action) {
 const situation=pourSituation(run);if(!situation.choices.includes(action))throw new Error('Invalid choice for this stage');
 const feedback=evaluatePourChoice(run,run.actions.length,action);
 return {run:{...run,actions:[...run.actions,action]},feedback};
}
function pourSummary(run) {
 if(!validPourRun(run))throw new Error('Invalid pour run');
 const decisions=run.actions.map((action,index)=>evaluatePourChoice(run,index,action));
 return {decisions,penalty:decisions.reduce((sum,d)=>sum+d.penalty,0),good:decisions.filter(d=>d.good).length};
}
function gameplayScore(bean,parameters,run) {
 if(!validPourRun(run,true))throw new Error('Complete three decisions first');
 if(!bean||!validRecipe(parameters))throw new Error('Invalid recipe');
 if(bean.custom)return null;
 return Math.max(0,brewScore(bean,parameters,'pulse')-pourSummary(run).penalty);
}
function nextPourGoal(bean,parameters,run) {
 if(!validPourRun(run,true))throw new Error('Complete three decisions first');
 const summary=pourSummary(run);const mistake=summary.decisions.find(d=>!d.good);
 if(mistake){const before={...run,actions:run.actions.slice(0,pourStageNames.indexOf(mistake.stage))};return {type:'action',stage:mistake.stage,action:pourSituation(before).recommended};}
 if(!bean.custom){
  const hint=experimentHint(bean,parameters,'pulse');
  if(hint.field!=='matched'){
   const steps={dose:1,water:10,temp:1,grind:1};const direction=hint.direction==='raise'?1:-1;
   const target=bean.target[hint.field];const next=direction>0?Math.min(target,parameters[hint.field]+steps[hint.field]):Math.max(target,parameters[hint.field]-steps[hint.field]);
   return {type:'parameter',field:hint.field,value:Math.max(limits[hint.field][0],Math.min(limits[hint.field][1],next))};
  }
 }
 return {type:'technique',value:run.technique==='fast'?'steady':run.technique==='steady'?'fast':run.scenario===0?'steady':'fast'};
}

    const feedback=lastPourFeedback?`<div class="decision-feedback ${lastPourFeedback.good?'decision-good':'decision-learn'}" role="status"><strong>${t('previousDecision')} · ${t(lastPourFeedback.stage)}</strong><p>${t(lastPourFeedback.effect+'Effect')}</p></div>`:'';
    const goalHere=retryGoal?.type==='action'&&retryGoal.stage===situation.stage;
    return `<div class="pour-scene"><h3 id="pour-title" tabindex="-1">${pourStep+1} / 3 · ${t(names[pourStep])}</h3>${feedback}<div class="dripper" data-cue="${situation.cue}" aria-hidden="true"><div class="grounds"></div><div class="waterline"></div></div><div class="observation"><span class="eyebrow">${t('observe')}</span><p id="pour-cue"><strong>${t(situation.cue+'Cue')}</strong></p><p>${t(situation.cue+'Detail')}</p></div>${isFirstDecisionRound()?`<p class="coach">${t(situation.cue+'Coach')}</p>`:''}${goalHere?`<p class="coach">${t(situation.recommended===retryGoal.action?'goalThisStep':'goalSituationChanged')}</p>`:''}<h4>${t('choosePour')}</h4><div class="pour-choices" role="group" aria-describedby="pour-cue">${situation.choices.map(action=>`<button class="pour-choice" data-action="${action}" type="button"><strong>${t(action+'Action')}</strong><span>${t(action+'Help')}</span></button>`).join('')}</div><div class="pour-volume"><div class="cup" aria-hidden="true"><div style="height:${poured/recipe.parameters.water*100}%"></div></div><div><progress max="${recipe.parameters.water}" value="${poured}" aria-label="${t('poured')}"></progress><p>${t('poured')}: ${poured} / ${recipe.parameters.water} ml</p><p class="help">${t('nextVolume')}: ${plan[pourStep]} ml (+${plan[pourStep]-poured} ml)</p></div></div><p class="help">${t('virtualTime')}</p><button id="cancel" class="secondary" type="button">${t('cancel')}</button></div>`;
  }
  const hint=beanFor(draft.bean).custom?{field:'custom'}:experimentHint(beanFor(draft.bean),draft.parameters,draft.technique);
  const hintText=hint.field==='custom'?t('customHint'):hint.field==='matched'?t('matched'):hint.field==='technique'?t('techniqueHint'):`${t(hint.direction)} ${t(hint.field).toLowerCase()} ${t('hintEnd')}`;
  const goal=draft.pourRun?nextPourGoal(beanFor(draft.bean),draft.parameters,draft.pourRun):null;
  const goalText=goal?pourGoalText(goal,draft):hintText;
  const decisionSummary=draft.pourRun?pourSummary(draft.pourRun):null;
  const result=`<div class="balance" id="brew-outcome" tabindex="-1" role="group"><span>${t('balance')}</span><strong>${draft.simulatedScore===null?`<small>${t('noCustomScore')}</small>`:`${draft.simulatedScore}<small> / 100</small>`}</strong></div>${decisionSummary?`<p class="${decisionSummary.decisions.at(-1).good?'decision-good':'decision-learn'}">${t(decisionSummary.decisions.at(-1).effect+'Effect')}</p><p class="score-ledger">${draft.simulatedScore===null?t('customDecisionOnly'):`${t('recipeBase')}: ${brewScore(beanFor(draft.bean),draft.parameters,'pulse')} · ${t('decisionImpact')}: −${decisionSummary.penalty}`} · ${decisionSummary.good}/3 ${t('observedWell')}</p>${renderPourReport(draft.pourRun)}`:''}<p class="help">${t('disclaimer')}</p><aside class="experiment"><h3>${t('feedback')}</h3><p>${goalText}</p></aside>`;
  if (stage === 'saved') return `<div class="success" role="status"><h3 id="saved-title" tabindex="-1">${t('saveSuccess')}</h3><p>+${draft.discovery.trim()?15:10} XP</p></div>${result}<div class="actions"><button type="button" id="try-next">${t('tryNextGoal')}</button><button type="button" id="again" class="secondary">${t('retry')}</button><button type="button" id="new" class="secondary">${t('newBrew')}</button></div>`;
  return `${result}<form id="taste"><h3 id="taste-title" tabindex="-1">${t('tasteTitle')}</h3><label>${t('mode')}<select name="ratingMode"><option value="hypothesis" ${draft.ratingMode==='hypothesis'?'selected':''}>${t('hypothesis')}</option><option value="real" ${draft.ratingMode==='real'?'selected':''}>${t('real')}</option></select></label><p class="help">${t('modeHelp')}</p><p class="help">${t('quickReflect')}</p><details id="sensory-details" ${showSensory?'open':''}><summary>${t('sensoryDetails')}</summary><p>${t('ratingsHelp')}</p><div class="fields">${ratingFields()}</div>${ratingSelect('mood',draft.mood)}<p class="help">${t('moodHelp')}</p></details><label>${t('notes')}<textarea name="notes" maxlength="1000" rows="3" placeholder="${t('notesPlaceholder')}">${esc(draft.notes)}</textarea></label><label>${t('discovery')}<textarea name="discovery" maxlength="1000" rows="2" placeholder="${t('discoveryPlaceholder')}">${esc(draft.discovery)}</textarea></label><p id="save-error" role="alert" tabindex="-1">${saveError?t('saveError'):''}</p><div class="actions"><button type="submit" ${journal.writable?'':'disabled'}>${t('save')}</button><button type="button" id="draft-export" class="secondary">${t('draftExport')}</button><button type="button" id="cancel" class="secondary">${t('cancel')}</button></div></form>`;
}
function renderHistory() {
  return `<section class="panel" id="memory"><div class="section-head"><h2>${t('memory')}</h2><button id="export" class="secondary" type="button">${t('export')}</button></div>${sessions.length>1?`<details class="compare"><summary>${t('compare')}</summary><div class="fields"><label>${t('sessionA')}<select id="compare-a">${sessions.map((s,i)=>`<option value="${i}" ${i===sessions.length-2?'selected':''}>#${i+1} · ${esc(beanFor(s.bean).name)}</option>`).join('')}</select></label><label>${t('sessionB')}<select id="compare-b">${sessions.map((s,i)=>`<option value="${i}" ${i===sessions.length-1?'selected':''}>#${i+1} · ${esc(beanFor(s.bean).name)}</option>`).join('')}</select></label></div><div id="comparison"></div><p class="help">${t('compareHelp')}</p></details>`:''}<div id="history">${sessions.length?sessions.slice().reverse().map((s,i)=>`<article class="session"><strong>${esc(s.beanProfile?.name||beanFor(s.bean).name)} · ${scoreLabel(s)}</strong><small>${esc(new Date(s.date).toLocaleString(language==='vi'?'vi-VN':'en-GB'))} · ${modeLabel(s)}</small><p>${t('personal')}: ${tasteMean(s)}/5</p>${s.pourRun?renderPourReport(s.pourRun):''}<p>${esc(s.discovery||t('noDiscovery'))}</p><p>${esc(s.notes||t('noNotes'))}</p><small>${recipeFields.map(k=>`${t(k)}: ${s.parameters[k]}`).join(' · ')} · ${s.technique?t(s.technique):t('noTechnique')}</small>${s.mood?`<p>${t('mood')}: ${esc(s.mood)}/5</p>`:''}<button class="secondary retry" data-session="${sessions.length-1-i}" type="button">${t('retry')}</button></article>`).join(''):`<p>${t('empty')}</p>`}</div></section>`;
}
function render() {
  document.documentElement.lang=language;
  let counterRounds=[];try{counterRounds=loadCounter(localStorage.getItem(counterKey),localStorage.getItem(oldCounterKey)).store.rounds;}catch{}
  const journey=progression(sessions,counterRounds), missions=missionProgress(sessions), active=missions.find(m=>!m.complete&&!m.locked);
  app.innerHTML=`<main><header><div class="section-head"><span class="eyebrow">THE COFFEE SIX SENSE · PHASE 1</span><label class="language">${t('language')}<select id="language"><option value="vi" ${language==='vi'?'selected':''}>Tiếng Việt</option><option value="en" ${language==='en'?'selected':''}>English</option></select></label></div><h1>${t('title')}</h1><p>${t('intro')}</p><details class="guide"><summary>${t('guide')}</summary><p>${t('guideText')}</p></details></header>${!journal.writable?`<div class="warning" role="alert"><p>${t('storageError')}</p>${journal.raw!==undefined?`<button id="recovery" type="button">${t('recovery')}</button>`:''}</div>`:''}<section class="panel" id="desk" aria-labelledby="desk-title"><h2 id="desk-title" tabindex="-1">${t('desk')}</h2><ol class="steps">${['configure','pouring','tasting','saved'].map(k=>`<li ${stage===k?'aria-current="step"':''}>${t(k)}</li>`).join('')}</ol><p id="recipe-message" role="status">${esc(retryGoal&&retrySource&&(stage==='configure'||stage==='pouring')?pourGoalText(retryGoal,retrySource):message)}</p><div id="result">${renderDesk()}</div></section><div id="bean-library"></div><section class="panel journey" aria-labelledby="journey-title"><h2 id="journey-title">${t('journey')}</h2><p><strong>${t('level')} ${journey.level}</strong> · ${journey.xp} XP · ${journey.remaining} ${t('nextLevel')}</p><progress max="50" value="${journey.progress}" aria-label="${t('nextLevel')}"></progress><p>${t('xpText')}</p><details><summary>${t('journey')} · ${journey.badges.filter(b=>b.earned).length}/4</summary><ul class="badges">${journey.badges.map(b=>`<li class="${b.earned?'earned':''}"><strong>${b.earned?'✓':'○'} ${t(b.name)}</strong><small>${t(b.hint)}</small></li>`).join('')}</ul></details></section><section class="panel missions"><div class="section-head"><h2>${t('quests')}</h2><span>${missions.filter(m=>m.complete&&!m.locked).length} / 4 ${t('complete')}</span></div><p>${t('questHelp')}</p><ol class="quest-list">${missions.map(m=>`<li class="quest ${m.locked?'locked':m.complete?'complete':'active'}"><div><strong>${t(m.locked?'locked':m.complete?'complete':'current')} · ${t(m.id+'Title')}</strong><p>${t(m.id+'Description')}</p><span>${m.count} / ${m.total}</span></div>${!m.complete&&!m.locked?`<button id="start-quest" type="button">${t(m.id==='experiment'&&sessions.length?'lastRecipe':'startQuest')}</button>`:''}</li>`).join('')}</ol>${!active?`<p id="quest-message">${t('allQuests')}</p>`:''}</section>${renderHistory()}<footer>${t('disclaimer')}</footer></main>`;
  bind(active);
  window.dispatchEvent(new Event('c6s-journal-changed'));
  renderBeanLibrary({language,onChange:()=>{capture();render();},onBrew:id=>changeRecipe({bean:id,parameters:{...coffeeBeans[0].target},technique:'pulse'},t('customHint'))});
}
function changeRecipe(session, prompt='') {
  if ((stage==='pouring'||stage==='tasting')&&!confirm(t('cancelConfirm'))) return;
  recipe=session?{bean:session.bean,parameters:{...session.parameters},technique:session.technique||'pulse',...(session.pourRun?{scenario:session.pourRun.scenario}:{})}:recipe;
  retryGoal=null;retrySource=null;pourRun=null;lastPourFeedback=null;
  stage='configure';draft=null;pourStep=0;showRecipeControls=true;message=prompt;saveError=false;render();focusOn('#desk-title');
}
function bind(activeMission) {
  document.querySelector('#language').onchange=e=>{capture();language=e.target.value;try{localStorage.setItem('c6s.language',language);}catch{}render();document.querySelector('#language').focus();};
  document.querySelector('#brew')?.addEventListener('input',()=>{capture();document.querySelector('#ratio').textContent=`${t('ratio')}: 1 : ${validRecipe(recipe.parameters)?(recipe.parameters.water/recipe.parameters.dose).toFixed(1):'—'}`;});
  document.querySelector('#brew')?.addEventListener('submit',e=>{e.preventDefault();beginPour();});
  document.querySelector('#quick-play')?.addEventListener('click',()=>beginPour(true));
  document.querySelector('#recipe-controls')?.addEventListener('toggle',e=>{showRecipeControls=e.currentTarget.open;});
  document.querySelector('#sensory-details')?.addEventListener('toggle',e=>{showSensory=e.currentTarget.open;});
  document.querySelector('#brew [name=bean]')?.addEventListener('change',()=>{capture();render();document.querySelector('#brew [name=bean]').focus();});
  document.querySelector('#reference')?.addEventListener('click',()=>{capture();recipe.parameters={...(beanFor(recipe.bean).target||coffeeBeans[0].target)};recipe.technique='pulse';render();focusOn('#desk-title');});
  document.querySelectorAll('.pour-choice').forEach(button=>button.addEventListener('click',event=>{
    if(busy||stage!=='pouring'||event.detail>1||!pourSituation(pourRun).choices.includes(button.dataset.action))return;busy=true;
    const decision=choosePourAction(pourRun,button.dataset.action);pourRun=decision.run;lastPourFeedback=decision.feedback;pourStep=pourRun.actions.length;
    if(pourStep===3){stage='tasting';draft={id:globalThis.crypto?.randomUUID?.()||`brew-${Date.now()}-${Math.random().toString(36).slice(2)}`,date:new Date().toISOString(),bean:recipe.bean,parameters:{...recipe.parameters},technique:recipe.technique,pourRun,...(beanFor(recipe.bean).custom?{beanProfile:{...beanFor(recipe.bean).profile,name:beanFor(recipe.bean).name}}:{}),simulatedScore:gameplayScore(beanFor(recipe.bean),recipe.parameters,pourRun),ratingMode:'hypothesis',taste:{},mood:null,notes:'',discovery:''};}
    render();focusOn(stage==='tasting'?'#brew-outcome':'#pour-title');busy=false;
  }));
  document.querySelector('#cancel')?.addEventListener('click',()=>changeRecipe(null));
  document.querySelector('#taste')?.addEventListener('submit',e=>{
    e.preventDefault();capture();if(!journal.writable||busy)return;busy=true;
    const next=[...sessions,draft];
    try{localStorage.setItem(key,JSON.stringify(next));sessions=next;stage='saved';saveError=false;message='';}
    catch{saveError=true;}
    busy=false;render();focusOn(saveError?'#save-error':'#saved-title');
  });
  document.querySelector('#draft-export')?.addEventListener('click',()=>{capture();download([draft],'coffee-memory-draft.json');});
  document.querySelector('#try-next')?.addEventListener('click',()=>{
    const previous=draft,goal=nextPourGoal(beanFor(previous.bean),previous.parameters,previous.pourRun);
    changeRecipe(previous,pourGoalText(goal,previous));retryGoal=goal;retrySource=previous;
    if(goal.type==='parameter')recipe.parameters[goal.field]=goal.value;
    if(goal.type==='technique')recipe.technique=goal.value;
    render();focusOn('#desk-title');
  });
  document.querySelector('#again')?.addEventListener('click',()=>changeRecipe(draft));
  document.querySelector('#new')?.addEventListener('click',()=>changeRecipe({bean:'ethiopia',parameters:{...coffeeBeans[0].target},technique:'pulse'}));
  document.querySelectorAll('.retry').forEach(button=>button.onclick=()=>changeRecipe(sessions[Number(button.dataset.session)]));
  document.querySelector('#start-quest')?.addEventListener('click',()=>{
    if((stage==='pouring'||stage==='tasting')&&!confirm(t('cancelConfirm')))return;
    capture();stage='configure';draft=null;saveError=false;retryGoal=null;retrySource=null;pourRun=null;lastPourFeedback=null;showRecipeControls=true;
    if(activeMission.id==='experiment'&&sessions.length){const last=sessions.at(-1);recipe={bean:last.bean,parameters:{...last.parameters},technique:last.technique||'pulse',...(last.pourRun?{scenario:last.pourRun.scenario}:{})};}
    if(activeMission.id==='explore'&&activeMission.bean){recipe.bean=activeMission.bean;delete recipe.scenario;recipe.parameters={...(beanFor(recipe.bean).target||coffeeBeans[0].target)};}
    message=t(activeMission.id+'Prompt');render();focusOn('#desk-title');
  });
  document.querySelector('#export').onclick=()=>download(sessions,'coffee-memory.json');
  document.querySelector('#recovery')?.addEventListener('click',()=>download(journal.raw,'coffee-memory-recovery.json',true));
  const ca=document.querySelector('#compare-a'),cb=document.querySelector('#compare-b');
  if(ca&&cb){
    const update=()=>{
      const a=sessions[Number(ca.value)],b=sessions[Number(cb.value)];
      const rows=[...recipeFields.map(k=>[t(k),a.parameters[k],b.parameters[k]]),[t('technique'),a.technique?t(a.technique):t('noTechnique'),b.technique?t(b.technique):t('noTechnique')],[t('balance'),scoreLabel(a),scoreLabel(b)],[t('mode'),modeLabel(a),modeLabel(b)],[t('personal'),tasteMean(a),tasteMean(b)],[t('scoreModel'),t(a.pourRun?'decisionModel':'legacyModel'),t(b.pourRun?'decisionModel':'legacyModel')]];
      document.querySelector('#comparison').innerHTML=ca.value===cb.value?`<p>${t('sameSession')}</p>`:`<div class="table-wrap"><table><thead><tr><th>${t('measure')}</th><th>${t('sessionA')}</th><th>${t('sessionB')}</th></tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,i)=>`<${i?'td':'th'}>${esc(cell)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    };ca.onchange=update;cb.onchange=update;update();
  }
}
render();

initializeBeanLibrary().then(()=>{capture();render();});

window.addEventListener('c6s-counter-changed',()=>{capture();render();});
mountCafe({getJournalSessions:()=>sessions});

</script></body></html>
