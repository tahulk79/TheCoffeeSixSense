// Visual capacity only: the server represents ~600 ml, independently of recipe size.
function serverFillPercent(ml){
 const volume=Math.max(0,Math.min(600,Number(ml)||0));
 const marks=[[0,0],[100,8],[200,17],[300,28],[400,40],[500,53],[600,62]];
 const upper=marks.findIndex(([v])=>v>=volume);
 if(upper<=0)return 0;
 const [a,ha]=marks[upper-1],[b,hb]=marks[upper];
 return ha+(hb-ha)*(volume-a)/(b-a);
}

// Versioned illustrative game rules. Not extraction, TDS, or measured taste.
const firstPourKey='c6s.first-pour.v03';
const firstPourVersion='first-pour-0.3.1';
const firstPourAxes=['aroma','acidity','sweetness','bitterness','body','aftertaste'];
const firstPourBeans=[
 {id:'ethiopia',name:'Ethiopia · Washed',target:{dose:20,ratio:15,grind:18,temp:94,time:180}},
 {id:'colombia',name:'Colombia · Honey',target:{dose:20,ratio:15,grind:20,temp:93,time:180}},
 {id:'brazil',name:'Brazil · Natural',target:{dose:20,ratio:15,grind:22,temp:92,time:180}},
 {id:'vietnam-washed',name:'Vietnam Arabica · Washed'},
 {id:'guatemala-washed',name:'Guatemala · Washed'},
 {id:'costa-rica-honey',name:'Costa Rica · Honey'},
 {id:'ethiopia-natural',name:'Ethiopia · Natural'}
];
function firstPourPreset(bean='ethiopia'){const entry=firstPourBeans.find(b=>b.id===bean);if(!entry)throw Error('Unknown bean');return {bean,...(entry.target||{dose:20,ratio:15,grind:20,temp:93,time:180})};}
const firstPourLimits={dose:[12,30],ratio:[12,20],grind:[1,40],temp:[80,100],time:[90,360]};
function validFirstRecipe(recipe){return Boolean(firstPourBeans.some(b=>b.id===recipe?.bean)&&Object.entries(firstPourLimits).every(([k,[min,max]])=>Number.isFinite(recipe[k])&&recipe[k]>=min&&recipe[k]<=max));}
function firstPourPlan(recipe){if(!validFirstRecipe(recipe))throw Error('Invalid first-pour recipe');const total=Math.round(recipe.dose*recipe.ratio);return [Math.round(total*.2),Math.round(total*.7),total];}
function firstPourScore(recipe){
 if(!validFirstRecipe(recipe))throw Error('Invalid first-pour recipe');
 const target=firstPourBeans.find(b=>b.id===recipe.bean).target;
 if(!target)return {modelVersion:firstPourVersion,score:null,largest:null,matched:false};
 const weights={grind:3,temp:4,ratio:6,time:.15};
 const deviations=Object.entries(weights).map(([field,weight])=>({field,delta:recipe[field]-target[field],penalty:Math.abs(recipe[field]-target[field])*weight}));
 return {modelVersion:firstPourVersion,score:Math.max(0,Math.round(100-deviations.reduce((s,d)=>s+d.penalty,0))),largest:deviations.reduce((a,b)=>a.penalty>=b.penalty?a:b).field,matched:deviations.every(d=>d.penalty===0)};
}
function startFirstPour(recipe){return {recipe:{...recipe},plan:firstPourPlan(recipe),stage:0,water:0,seconds:0,pouringSeconds:0,ready:false,done:false};}
function tickFirstPour(state,pouring,dt){
 if(!Number.isFinite(dt)||dt<0||dt>.1)throw Error('Invalid first-pour timestep');
 if(state.done||state.ready||!pouring)return state;
 const target=state.plan[state.stage],rate=state.plan[2]/12;
 const added=Math.min(target-state.water,rate*dt);
 const water=Math.min(target,state.water+added),complete=target-water<.000001;
 return {...state,water:complete?target:water,seconds:state.seconds+dt,pouringSeconds:state.pouringSeconds+added/rate,ready:complete,done:complete&&state.stage===2};
}
function advanceFirstPour(state){if(!state.ready||state.done)throw Error('Finish the current stage first');return {...state,stage:state.stage+1,ready:false};}
function validFirstFeedback(feedback){return Boolean(feedback&&['reflection','self-reported-real-tasting'].includes(feedback.context)&&typeof feedback.notes==='string'&&feedback.notes.length<=1000&&typeof feedback.nextChange==='string'&&feedback.nextChange.length<=1000&&(feedback.enjoyment===null||Number.isInteger(feedback.enjoyment)&&feedback.enjoyment>=1&&feedback.enjoyment<=5)&&feedback.axes&&firstPourAxes.every(k=>feedback.axes[k]===null||Number.isInteger(feedback.axes[k])&&feedback.axes[k]>=1&&feedback.axes[k]<=5));}
function validFirstMemory(entry){
 if(entry?.practice!==undefined&&(!entry.practice||entry.practice.version!==1||!Number.isInteger(entry.practice.pauses)||entry.practice.pauses<0||entry.practice.pauses>9999))return false;
 if(entry?.shift!==undefined&&(!entry.shift||typeof entry.shift.id!=='string'||!entry.shift.id||entry.shift.id.length>160||!['a','b'].includes(entry.shift.role)))return false;
 if(entry?.baselineId!==undefined&&(typeof entry.baselineId!=='string'||!entry.baselineId||entry.baselineId===entry.id))return false;
 if(!entry||typeof entry.id!=='string'||!entry.id||typeof entry.date!=='string'||!Number.isFinite(Date.parse(entry.date))||entry.kind!=='first-pour-game-memory'||!validFirstRecipe(entry.recipe)||!validFirstFeedback(entry.feedback))return false;
 const expected=firstPourScore(entry.recipe),total=firstPourPlan(entry.recipe)[2];
 return entry.result?.modelVersion===firstPourVersion&&entry.result.score===expected.score&&entry.pour?.water===total&&entry.pour.stages===3&&Number.isFinite(entry.pour.playSeconds)&&entry.pour.playSeconds>=0;
}
function loadFirstMemories(raw){
 if(raw===null)return {records:[],writable:true};
 try{const parsed=JSON.parse(raw);if(parsed.version!==1||!Array.isArray(parsed.records)||!parsed.records.every(validFirstMemory)||new Set(parsed.records.map(r=>r.id)).size!==parsed.records.length)throw Error('Invalid memory');return {records:parsed.records,writable:true};}catch{return {records:[],writable:false,raw};}
}
function putFirstMemory(records,entry){if(!validFirstMemory(entry))throw Error('Invalid first-pour memory');return [...records.filter(r=>r.id!==entry.id),entry];}
function compareFirstMemories(a,b){return ['bean',...Object.keys(firstPourLimits)].filter(k=>a.recipe[k]!==b.recipe[k]);}

// Presentation-only drawdown, independent of the recipe score and saved measurements.
function firstPourDrawdown(collected,poured,total,dt){
 if(![collected,poured,total,dt].every(Number.isFinite)||total<=0||collected<0||poured<collected||poured>total||dt<0||dt>.1)throw Error('Invalid visual drawdown');
 return Math.min(poured,collected+total/18*dt);
}

 {id:'bean-vietnam-washed',kind:'bean',title:['Arabica Việt Nam · Washed','Vietnam Arabica · Washed'],story:['Hôm nay quán mở một túi Arabica Việt Nam. Bắt đầu từ một cái tên quen, rồi xem mình còn chưa biết điều gì về nó nhé.','Today we open a bag of Vietnamese Arabica. Start with a familiar place, then discover what you have not noticed yet.'],fact:['Xuất xứ, loài cà phê và cách sơ chế là ba thông tin khác nhau. Chỉ tên gọi này chưa đủ để kết luận vị của một lô hạt.','Origin, coffee species and processing are different pieces of information. This name alone cannot establish how a particular lot tastes.'],prompt:['Thử một lô minh họa mới; ghi một điều bạn muốn tìm hiểu thêm.','Try a new illustrative lot and note one thing you want to learn.'],bean:'vietnam-washed',focus:'grind'},
 {id:'tool-v60',kind:'tool',tool:'v60',title:['Phễu hình nón V60','The V60 cone dripper'],story:['Có khách hỏi sao quán không dùng một cái phễu bất kỳ. Hôm nay tôi để chiếc V60 lên quầy, mình cùng nhìn kỹ nó một chút.','A guest asked why we do not use just any funnel. Today the V60 is on the counter; let us take a closer look.'],fact:['V60 có thân nón, gân bên trong và lỗ thoát lớn. Dụng cụ, giấy lọc và cách rót đều tham gia vào quá trình pha; hình vẽ trong game là minh họa.','A V60 has a conical body, internal ribs and a large outlet. Brewer, paper and pouring all participate in brewing; the game drawing is illustrative.'],prompt:['Vào bàn rót và quan sát đoạn nước đi qua phễu xuống bình.','Visit the station and watch water pass through the dripper into the server.'],focus:null},
 {id:'recipe-small-180',kind:'recipe',title:['Một ly nhỏ · 12 g / 180 ml','A small brew · 12 g / 180 ml'],story:['Không phải lúc nào mình cũng cần một bình lớn. Hôm nay quán giới thiệu một mẻ nhỏ, vừa đủ để thử một ý tưởng mới.','You do not always need a large batch. Today the café offers a small brew, just enough to try a new idea.'],fact:['12 g cà phê với 180 ml nước là tỷ lệ danh nghĩa 1:15. Nước rót vào không đồng nghĩa lượng đồ uống thu được ngoài đời.','12 g coffee with 180 ml water is a nominal 1:15 ratio. Input water is not the same as the beverage collected in real brewing.'],prompt:['Đưa 12 g / 180 ml vào bàn pha; xem lượng nước mục tiêu trước khi rót.','Load 12 g / 180 ml and read the target water before pouring.'],dose:12,ratio:15,focus:'dose'},
 {id:'bean-guatemala-washed',kind:'bean',title:['Guatemala · Washed','Guatemala · Washed'],story:['Trên kệ hôm nay có một cái tên từ Guatemala. Tôi thích bắt đầu câu chuyện bằng dòng sơ chế trên túi, trước khi đọc những lời mô tả hương vị.','A name from Guatemala is on the shelf today. I like starting with the processing line on the bag before its tasting descriptions.'],fact:['Washed thường loại bỏ thịt quả và lớp nhầy trước khi làm khô hạt. Quy trình cụ thể có thể khác nhau giữa các nơi sơ chế.','Washed processing generally removes fruit pulp and mucilage before the seed is dried. The details vary between processing sites.'],prompt:['Thử lô minh họa Guatemala và ghi câu hỏi về cách sơ chế.','Try an illustrative Guatemala lot and note a question about processing.'],bean:'guatemala-washed',focus:'temp'},
 {id:'tool-gooseneck',kind:'tool',tool:'kettle',title:['Ấm cổ ngỗng','The gooseneck kettle'],story:['Chiếc vòi dài này không chỉ để làm dáng. Hôm nay mình thử nhấc ấm thật nhẹ, rồi xem cảm giác chủ động ngừng dòng nước.','This long spout is more than decoration. Today, lift the kettle gently and try choosing when to stop the water.'],fact:['Vòi dài, hẹp hỗ trợ hướng và kiểm soát dòng rót. Trong game, nút giữ/thả là thao tác minh họa; đây không phải phép đo lưu lượng của một chiếc ấm thật.','A long narrow spout helps direct and control a pour. The hold/release control is illustrative, not a flow measurement from a real kettle.'],prompt:['Rót một đoạn rồi tự thả nút; nhìn cà phê tiếp tục nhỏ xuống.','Pour briefly, then release yourself and watch the coffee keep dripping.'],focus:null},
 {id:'recipe-240',kind:'recipe',title:['Thử tỷ lệ 1:16 · 15 g / 240 ml','Try 1:16 · 15 g / 240 ml'],story:['Cùng một túi hạt, hôm nay quán thử thêm một chút nước trên mỗi gram cà phê. Mình lưu lại để hôm khác còn biết đã thay điều gì.','With the same coffee, today we try a little more water per gram. Save the recipe so you can remember what changed.'],fact:['Tỷ lệ mô tả lượng cà phê và nước đầu vào; không tự nó xác định độ ngon hoặc TDS. Công thức ở đây là điểm khởi hành minh họa, không phải công thức đã kiểm chứng cho mọi hạt.','Ratio describes coffee and input water; it does not by itself determine liking or TDS. This is an illustrative starting recipe, not a validated recipe for every coffee.'],prompt:['Nạp 15 g / 240 ml rồi lưu công thức để đối chiếu.','Load 15 g / 240 ml and save it for comparison.'],dose:15,ratio:16,focus:'ratio'},
 {id:'bean-costa-rica-honey',kind:'bean',title:['Costa Rica · Honey','Costa Rica · Honey'],story:['Hôm nay có chữ “Honey” trên túi mới. Không, tôi không giấu lọ mật ong sau quầy đâu — cái tên này đang kể về cách sơ chế.','The new bag says “Honey”. No, there is no secret honey jar behind the counter; the name is about processing.'],fact:['Honey processing thường giữ lại một phần lớp nhầy khi làm khô hạt đã tách vỏ quả. Tên gọi không có nghĩa là thêm mật ong; mức giữ lại và quy trình rất đa dạng.','Honey processing generally retains some mucilage while drying depulped seeds. The name does not mean honey was added; retention and practices vary.'],prompt:['Thử một lô Honey minh họa; đừng dùng tên sơ chế để đoán chắc vị ngọt.','Try an illustrative honey-process lot; the process name does not guarantee sweetness.'],bean:'costa-rica-honey',focus:'grind'},
 {id:'tool-scale',kind:'tool',tool:'scale',title:['Chiếc cân trên quầy','The counter scale'],story:['Món đồ hôm nay ít lãng mạn hơn chiếc ấm, nhưng giúp tôi nhớ hôm qua mình đã làm gì: một chiếc cân.','Today’s object is less romantic than the kettle, but it helps me remember what I did yesterday: a scale.'],fact:['Cân đo khối lượng bằng gram; thang ml trong game đang minh họa thể tích nước. Không xem số ml của game là một số đo gram từ cân thật.','A scale measures mass in grams; the game’s ml display illustrates water volume. Do not treat game ml as a real gram measurement.'],prompt:['Nhìn lượng cà phê, tỷ lệ và nước mục tiêu trong công thức trước khi pha.','Read dose, ratio and target water in the recipe before brewing.'],focus:'dose'},
 {id:'recipe-300',kind:'recipe',title:['Mẻ lớn hơn · 20 g / 300 ml','A larger batch · 20 g / 300 ml'],story:['Hôm nay có thêm một người ngồi cùng bàn. Quán tăng lượng pha, giữ tỷ lệ quen thuộc và ghi lại công thức.','Someone else joins the table today. We increase the batch, keep a familiar ratio and write the recipe down.'],fact:['20 g / 300 ml và 12 g / 180 ml cùng có tỷ lệ danh nghĩa 1:15. Ngoài đời, tăng mẻ không bảo đảm thời gian rút hoặc hương vị sẽ giữ nguyên.','20 g / 300 ml and 12 g / 180 ml share a nominal 1:15 ratio. Scaling a real batch does not guarantee unchanged drawdown or flavor.'],prompt:['Thử mẻ 300 ml; xem nó vẫn chỉ chiếm một phần server 600 ml.','Try a 300 ml batch; it still occupies only part of the 600 ml server.'],dose:20,ratio:15,focus:'dose'},
 {id:'bean-ethiopia-natural',kind:'bean',title:['Ethiopia · Natural','Ethiopia · Natural'],story:['Lần này vẫn là Ethiopia, nhưng dòng sơ chế đã khác túi Washed quen thuộc. Một thay đổi nhỏ trên nhãn cũng đủ để mở một câu chuyện mới.','It is Ethiopia again, but the processing line differs from the familiar washed bag. A small label change can open a new story.'],fact:['Natural thường làm khô nguyên quả trước khi tách lớp vỏ ngoài. Cùng xuất xứ không đồng nghĩa hai lô hạt có cùng giống, sơ chế, rang hoặc hương vị.','Natural processing generally dries whole cherries before removing the outer layers. A shared origin does not make two lots identical in variety, processing, roast or flavor.'],prompt:['Chọn lô Natural minh họa và nhìn lại những thông tin cần có khi so sánh hạt.','Choose an illustrative natural-process lot and consider what information a bean comparison needs.'],bean:'ethiopia-natural',focus:'grind'},
 {id:'tool-grinder',kind:'tool',tool:'grinder',title:['Một nấc trên máy xay','One step on a grinder'],story:['Có khách hỏi “xay số 20” là đủ chưa. Tôi đẩy chiếc máy xay ra quầy: trước tiên, mình cần biết đó là số 20 của máy nào.','A guest asked whether “grind 20” was enough information. I put the grinder on the counter: first, we need to know which grinder.'],fact:['Số nấc không phải đơn vị kích thước hạt dùng chung giữa mọi máy. Thang 1–40 trong game là thang trò chơi, không phải cỡ hạt được đo bằng micromet.','Click numbers are not universal particle-size units across grinders. The game’s 1–40 scale is a game scale, not a micrometre measurement.'],prompt:['Mở ô cỡ xay; khi ghi pha thật, nhớ ghi cả tên máy và thiết lập.','Open the grind setting; when logging a real brew, include grinder identity and setting.'],focus:'grind'},
 {id:'recipe-255',kind:'recipe',title:['Thêm một lựa chọn · 15 g / 255 ml','Another option · 15 g / 255 ml'],story:['Hôm nay tôi ghi thêm 1:17 vào sổ quán. Không phải đáp án cuối cùng — chỉ là một lựa chọn để mình có điều mà đối chiếu.','Today I add 1:17 to the café notebook. It is not the final answer, just another option worth comparing.'],fact:['15 g / 255 ml là tỷ lệ danh nghĩa 1:17. Nếu so với 15 g / 240 ml, lượng nước thay đổi; đừng tự kết luận cảm nhận nào đó chỉ từ tỷ lệ.','15 g / 255 ml is a nominal 1:17 ratio. Against 15 g / 240 ml, water input changes; ratio alone does not establish a sensory result.'],prompt:['Nạp 1:17, lưu ly và ghi điều bạn muốn đối chiếu với 1:16.','Load 1:17, save the cup and note what to compare against 1:16.'],dose:15,ratio:17,focus:'ratio'}
];
function dailyDiscovery(date=new Date()){
 if(!(date instanceof Date)||!Number.isFinite(date.getTime()))throw Error('Invalid local date');
 const day=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()),epoch=Date.UTC(2026,9,24),index=((Math.round((day-epoch)/86400000)%dailyDiscoveries.length)+dailyDiscoveries.length)%dailyDiscoveries.length;
 return {key:`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`,index,entry:dailyDiscoveries[index],next:dailyDiscoveries[(index+1)%dailyDiscoveries.length]};
}
function loadDailyCollection(raw){
 if(raw===null)return {saved:[],writable:true};
 try{const data=JSON.parse(raw);if(data.version!==1||!Array.isArray(data.saved)||!data.saved.every(id=>typeof id==='string'&&/^[a-z0-9-]{1,80}$/.test(id))||new Set(data.saved).size!==data.saved.length)throw Error('Invalid collection');return {saved:data.saved,writable:true};}catch{return {saved:[],writable:false,raw};}
}
function toggleDailySaved(saved,id){if(!dailyDiscoveries.some(x=>x.id===id))throw Error('Unknown discovery');return saved.includes(id)?saved.filter(x=>x!==id):[...saved,id];}

function createDailyDiscovery(){
 let language='vi',root=null,selected=null,notice='',collection;
 try{collection=loadDailyCollection(localStorage.getItem(dailyCollectionKey));}catch{collection={saved:[],writable:false};}
 let today=dailyDiscovery(),timer;
 const tx=(vi,en)=>language==='vi'?vi:en,at=values=>values[language==='vi'?0:1];
 const kindLabel=kind=>({bean:tx('Hạt mới trên kệ','A bean on the shelf'),tool:tx('Đồ nghề trên quầy','A tool on the counter'),recipe:tx('Công thức trong sổ','A recipe from the notebook')}[kind]);
 function art(item){const paths=item.kind==='bean'?'<path d="M27 18h58l7 73H20z"/><path d="M28 25h56M26 80h60"/><ellipse cx="56" cy="53" rx="12" ry="18" transform="rotate(30 56 53)"/><path d="M62 38q-17 15-12 31"/>':item.kind==='recipe'?'<path d="M27 15h58v78H27zM35 30h27M35 43h40M35 56h40M35 69h23"/><path d="m69 78 5 5 11-12"/>':item.tool==='v60'?'<path d="M22 25h66L61 80H49zM30 33l23 40M45 33l10 40M75 33 60 73M44 84h24"/><ellipse cx="55" cy="25" rx="33" ry="7"/>':item.tool==='kettle'?'<path d="M61 32h20l10 53H51zM62 28h18M69 22h5M86 39q19-4 15 23l-9 7M55 68Q35 88 29 56T9 42"/>':item.tool==='scale'?'<path d="M18 46h75v41H18zM24 37h63v9H24zM29 61h39v15H29z"/><path d="M76 67h5M84 67h5"/>':'<path d="M36 29h40v60H36zM32 29h48M39 89h34M55 29V14h33"/><ellipse cx="91" cy="14" rx="8" ry="5"/><path d="M45 44h22M45 53h22"/>';
  return `<svg viewBox="0 0 112 108" aria-hidden="true" focusable="false"><rect x="1" y="1" width="110" height="106" rx="18" fill="#263a2b" stroke="#8c9b6c"/><g fill="none" stroke="#e1bd85" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">${paths}</g></svg>`;
 }
 function markup(){const item=dailyDiscoveries.find(x=>x.id===selected)||today.entry,isToday=item.id===today.entry.id;
  return `<section class="daily-card" aria-labelledby="daily-title"><div class="daily-heading"><span class="eyebrow">${isToday?tx('HÔM NAY QUÁN CÓ GÌ?','WHAT’S AT THE CAFÉ TODAY?'):tx('TỪ SỔ QUÁN','FROM THE CAFÉ NOTEBOOK')}${isToday?` · ${today.key}`:''}</span>${!isToday?`<button type="button" id="daily-today" class="secondary">${tx('Về hôm nay','Back to today')}</button>`:''}</div><div class="daily-story"><div class="daily-art">${art(item)}</div><div><small>${kindLabel(item.kind)}</small><h2 id="daily-title" tabindex="-1">${at(item.title)}</h2><p class="daily-voice">${tx('Lời chủ quán · chuyện trong game','The owner’s voice · a game story')}</p><blockquote>${at(item.story)}</blockquote></div></div><details class="daily-fact"><summary>${tx('Một điều thú vị','One thing to discover')}</summary><p>${at(item.fact)}</p></details><p class="daily-prompt">${at(item.prompt)}</p><div class="actions"><button type="button" id="daily-play">${item.kind==='bean'?tx('Thử hạt minh họa này','Try this illustrative bean'):item.kind==='recipe'?tx('Đưa công thức vào bàn pha','Load this recipe'):tx('Khám phá tại bàn pha','Explore at the station')}</button><button type="button" id="daily-save" class="secondary" aria-pressed="${collection.saved.includes(item.id)}" ${collection.writable?'':'disabled'}>${collection.saved.includes(item.id)?tx('✓ Đã lưu gợi ý','✓ Discovery saved'):tx('Lưu gợi ý','Save discovery')}</button></div><p id="daily-status" role="status">${notice}</p><p class="daily-teaser">${tx('Lần giới thiệu ngày mai','Tomorrow’s introduction')}: ${kindLabel(today.next.kind)}.</p><details class="daily-library"><summary>${tx('Sổ quán','Café notebook')} · ${collection.saved.filter(id=>dailyDiscoveries.some(x=>x.id===id)).length}/${dailyDiscoveries.length} ${tx('đã lưu','saved')}</summary><p class="help">${tx('Mở lại bao nhiêu lần trong ngày vẫn cùng một gợi ý. Có 12 mục luân phiên trong bản này; sau đó chu kỳ lặp lại. Xem mọi mục bất cứ lúc nào, không cần đăng nhập hay điểm danh. Sổ chỉ lưu trên trình duyệt này; xóa dữ liệu trình duyệt có thể làm mất sổ.','The same local day keeps the same suggestion. This edition has 12 rotating entries, then the cycle repeats. Browse all entries anytime; no account or daily check-in required. The notebook is local to this browser and may be lost if browser data is cleared.')}</p><div class="daily-list">${dailyDiscoveries.map(entry=>`<button type="button" class="secondary" data-daily-id="${entry.id}" aria-pressed="${entry.id===item.id}">${collection.saved.includes(entry.id)?'✓ ':''}${kindLabel(entry.kind)} · ${at(entry.title)}</button>`).join('')}</div>${collection.saved.length&&collection.writable?`<button type="button" id="daily-export" class="secondary">${tx('Xuất sổ JSON','Export notebook JSON')}</button>`:''}</details>${!collection.writable?`<p class="help">${tx('Sổ lưu chưa đọc được; không ghi đè. Bạn vẫn xem và thử các gợi ý.','Saved notebook could not be read and will not be overwritten. You can still browse and try discoveries.')}</p>${collection.raw!==undefined?`<button type="button" id="daily-recovery" class="secondary">${tx('Tải sổ gốc','Download original notebook')}</button>`:''}`:''}</section>`;
 }
 function draw(){const host=root?.querySelector('#daily-discovery');if(!host)return;host.innerHTML=markup();bindControls(host);}
 function bindControls(host){
  host.querySelector('#daily-today')?.addEventListener('click',()=>{selected=null;notice='';draw();});
  host.querySelectorAll('[data-daily-id]').forEach(button=>button.onclick=()=>{selected=button.dataset.dailyId;notice='';draw();root.querySelector('#daily-title')?.focus({preventScroll:true});root.querySelector('#daily-title')?.scrollIntoView({behavior:'smooth',block:'nearest'});});
  host.querySelector('#daily-play').onclick=()=>{const item=dailyDiscoveries.find(x=>x.id===selected)||today.entry;const recipe=firstPourPreset(item.bean||'ethiopia');if(item.kind==='recipe'){recipe.dose=item.dose;recipe.ratio=item.ratio;}window.dispatchEvent(new CustomEvent('c6s-daily-practice',{detail:{id:item.id,title:at(item.title),kind:item.kind,recipe,focus:item.focus}}));};
  host.querySelector('#daily-save').onclick=()=>{const item=dailyDiscoveries.find(x=>x.id===selected)||today.entry;const saved=toggleDailySaved(collection.saved,item.id);try{localStorage.setItem(dailyCollectionKey,JSON.stringify({version:1,saved}));collection={...collection,saved};notice=tx('Đã cập nhật sổ trên trình duyệt này.','Notebook updated in this browser.');}catch{notice=tx('Chưa lưu được sổ. Bạn vẫn có thể chơi; thử lưu lại khi có dung lượng.','Notebook could not be saved. You can still play; retry when storage is available.');}draw();};
  host.querySelector('#daily-export')?.addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,saved:collection.saved},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='c6s-daily-notebook.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
  host.querySelector('#daily-recovery')?.addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([collection.raw],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='c6s-daily-notebook-recovery.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
 }
 function checkDate(){const next=dailyDiscovery();if(next.key!==today.key){today=next;selected=null;notice='';draw();}}
 function schedule(){clearTimeout(timer);const now=new Date(),next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1,0,0,0,50);timer=setTimeout(()=>{checkDate();schedule();},Math.max(100,next-now));}
 document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkDate();schedule();}});window.addEventListener('focus',checkDate);schedule();
 return {markup(lang){language=lang;checkDate();return `<div id="daily-discovery">${markup()}</div>`;},bind(element){root=element;bindControls(root.querySelector('#daily-discovery'));}};
}

 {"title":["Chiếc ghế cạnh cửa","The window seat"],"guest":"Linh","scene":["Bạn ghé uống một ly, gặp Linh Nguyễn, cô gái từ Hội An đang vẽ góc cửa sổ. “Ở nhà, chờ phin nhỏ giọt là lúc mẹ con tôi kể chuyện.” Chủ quán chỉ túi Vietnam Arabica Washed: “Hôm nay thử cách pha khác nhé? Ghế kia cứ coi là chỗ quen của bạn.”","You stop for a cup and meet Linh Nguyễn from Hội An, sketching the window. “At home, Mum and I share stories while the phin drips.” The owner points to Vietnam Arabica Washed: “Try a different brew today? Consider that chair your usual spot.”"],"line":["“Tôi muốn vẽ quán trước khi chuyển đi. Nhưng chưa biết bắt đầu từ đâu.”","“I want to draw this café before I move away. I don’t know where to start.”"],"options":[["Từ chiếc ghế bạn hay ngồi?","From your usual chair?"],["Từ người sẽ nhớ quán này?","From someone who will miss it?"]],"replies":[["Linh vẽ chiếc ghế trước. “Vậy lần tới bạn ngồi làm mẫu nhé.”","Linh sketches the chair. “You can sit for the next drawing.”"],["Linh nhìn chủ quán rồi cười. “Chắc bức này sẽ có nhiều người.”","Linh looks at the owner and smiles. “This might be a crowded drawing.”"]],"fact":["Washed là cách sơ chế, không phải lời hứa về vị. Xuất xứ và cách rang cũng chưa đủ để đoán chính xác một ly.","Washed describes processing, not a promise of flavor. Origin and roast alone cannot predict an exact cup."],"discovery":"bean-vietnam-washed","modes":["talk","photo"],"memento":["Nét chì đầu tiên","The first pencil line"],"end":["Trước khi về, bạn nhận một nét vẽ chiếc ghế. “Mai hay hôm nào rảnh, ghé nhé.”","You leave with a tiny sketch of the chair. “Tomorrow, or whenever you have time.”"],"guestIds":["linh"]},
 {"title":["Một chiếc phễu, hai người lóng ngóng","One dripper, two beginners"],"guest":"Luca","scene":["Luca Rossi, điều dưỡng người Ý từ Bologna, ghé sau ca trực đêm, dựng chiếc xe đạp cũ ngoài cửa. “Tôi quen uống espresso nhanh bên quầy. Hôm nay muốn ngồi lại lâu hơn.” Chủ quán đặt V60 lên bàn. Cây bút Linh bỏ quên vẫn ở ghế cửa sổ.","Luca Rossi, an Italian nurse from Bologna, parks his old bike after a night shift. “I’m used to a quick espresso at the counter. Today I’d like to stay longer.” The owner sets a V60 on the table. Linh’s forgotten pencil is still by the window."],"line":["“Tôi có ấm moka ở nhà, nhưng chưa pha lọc bao giờ. Có cần mua thật nhiều đồ để thử không?”","“I have a moka pot at home, but I’ve never made filter coffee. Do I need lots of gear to try?”"],"options":[["Bắt đầu bằng đồ đang có đã.","Start with what you already have."],["Mượn đồ quán thử trước nhé.","Try the café’s gear first."]],"replies":[["“Vậy tôi thử một công thức nhỏ trước.” Luca cất danh sách mua sắm.","“Then I’ll try a small recipe.” Luca puts his shopping list away."],["Chủ quán đẩy bộ pha sang: “Cứ thử, rồi xem mình có thích không.”","The owner slides the kit over. “Try it and see whether you enjoy it.”"]],"fact":["V60 có thân nón, gân trong và lỗ thoát lớn. Dòng chảy còn phụ thuộc giấy lọc, lớp bột và cách rót; hình dáng không tự bảo đảm ly ngon.","A V60 has a cone, internal ribs and a large opening. Flow also depends on paper, the coffee bed and pouring; shape alone does not guarantee a good cup."],"discovery":"tool-v60","modes":["talk","brew"],"memento":["Tờ giấy lọc có nét vẽ","A doodled filter paper"],"end":["Luca vẽ một mặt cười lên tờ giấy lọc chưa dùng, ghim cạnh nét chì của Linh.","Luca doodles a smile on an unused filter paper and pins it beside Linh’s sketch."],"guestIds":["luca"]},
 {"title":["Mưa và một góc ảnh","Rain in the frame"],"guest":"Linh","scene":["Linh quay lại với chiếc máy ảnh cũ. Mưa phủ mờ cửa kính. Chủ quán mở công thức 12 g cà phê, 180 ml nước: “Một mẻ nhỏ cho buổi chiều chậm.”","Linh returns with an old camera. Rain blurs the window. The owner opens a 12 g coffee, 180 ml water recipe. “A small brew for a slow afternoon.”"],"line":["“Tôi thích màu ảnh máy phim cũ, nhưng không cần ảnh hoàn hảo. Chỉ muốn nhớ đúng cảm giác hôm nay.”","“I like the look of old film photos, but I don’t need a perfect picture. I want to remember how today feels.”"],"options":[["Để cả những giọt mưa trong ảnh nhé.","Keep the raindrops in the frame."],["Chụp cả chiếc ghế còn trống đi.","Include the empty chair."]],"replies":[["“Ừ, tiếng mưa thì không chụp được, nhưng chắc tôi sẽ nhớ.”","“I can’t photograph the sound, but I think I’ll remember it.”"],["“Để người xem tự nghĩ ai vừa đứng dậy.” Linh chỉnh lại máy.","“Let people imagine who just left.” Linh adjusts the camera."]],"fact":["12 g và 180 ml nước cho tỷ lệ đầu vào 1:15. Nước pha vào không bằng lượng đồ uống thu được vì bột giữ lại nước. Đây là công thức khởi hành minh họa.","12 g and 180 ml input water give a 1:15 ratio. Input water differs from beverage yield because grounds retain water. This is an illustrative starting recipe."],"discovery":"recipe-small-180","modes":["photo","brew"],"memento":["Bức ảnh chiều mưa","The rainy-afternoon photo"],"end":["Bức ảnh được ghim lên bảng quán. Một góc nhỏ đã thành ký ức chung.","The photo goes onto the café board. A small corner has become a shared memory."],"guestIds":["linh"]},
 {"title":["Ly cà phê sau một quyết định","A cup after a decision"],"guest":"Camila","scene":["Camila Santos, biên dịch viên từ Belo Horizonte, Brazil, vừa nghỉ công việc cũ. Cô đặt cuốn sổ ép lá lên bàn: “Bà tôi hay mời một cafezinho rồi kéo ghế ngồi cùng. Hôm nay tôi nhớ cảm giác đó.” Trên kệ là Guatemala Washed. Chủ quán mời cô chọn một chỗ ngồi trước đã.","Camila Santos, a translator from Belo Horizonte, Brazil, has just left her job. She sets down a notebook of pressed leaves. “My grandmother would offer a cafezinho and pull up a chair. I miss that feeling today.” Guatemala Washed is on the shelf. The owner invites her to find a seat first."],"line":["“Mọi người cứ hỏi bước tiếp theo. Tôi chỉ muốn được ngồi yên một chút.”","“Everyone asks what comes next. I just want to sit for a while.”"],"options":[["Vậy mình cứ ngồi đây đã.","Then let’s just sit here."],["Bạn muốn nghe chuyện bức ảnh trên bảng không?","Want to hear about the photo on the board?"]],"replies":[["Camila thở ra. Hai người nghe tiếng nước trong ấm, không cần lấp đầy khoảng lặng.","Camila exhales. You listen to the kettle without filling the silence."],["Bạn kể về Linh và buổi mưa. Camila nhìn ảnh: “Một việc nhỏ vậy mà đáng nhớ nhỉ.”","You tell Camila about Linh and the rain. “Such a small thing to remember,” Camila says."]],"fact":["Tên quốc gia không phải công thức hương vị. Giống, vùng trồng, sơ chế, rang và pha đều góp phần; lô minh họa này chưa có mốc chấm điểm.","A country name is not a flavor recipe. Variety, growing conditions, processing, roasting and brewing all matter; this illustrative lot has no scoring benchmark."],"discovery":"bean-guatemala-washed","modes":["talk","photo"],"memento":["Một chỗ trống được giữ lại","A space left open"],"end":["Camila kẹp một chiếc lá ép lên mảnh giấy trắng: “Cho chuyện chưa biết viết thế nào.” Chủ quán giữ nguyên khoảng trống ấy.","Camila clips a pressed leaf to a blank note: “For a story I can’t write yet.” The owner leaves that space open."],"guestIds":["camila"]},
 {"title":["Luca trở lại, lần này không vội","Luca returns without rushing"],"guest":"Luca","scene":["Luca được nghỉ, đạp xe tới cùng cuốn sổ mới. Anh vừa sửa xong chiếc chuông xe cũ. “Hôm nay không có ca trực để chạy theo.” Chủ quán giới thiệu chiếc cân: “Lần trước đoán bằng mắt. Giờ thử ghi lại nhé?”","On a day off, Luca cycles over with a new notebook and a freshly repaired bike bell. “No shift to rush to today.” The owner introduces a scale. “Last time we guessed. Shall we write things down?”"],"line":["“Quen ấm moka rồi mà pha lọc ở nhà hai lần vẫn khác nhau. Có phải tôi không có năng khiếu?”","“I know my moka pot, yet my first two filter brews tasted different. Am I just bad at this?”"],"options":[["Mình ghi lượng nước và cà phê trước nhé.","Let’s record coffee and water amounts first."],["Lần tới chỉ thay một thứ để dễ so sánh.","Change just one thing next time to compare."]],"replies":[["Luca viết dòng đầu tiên. “Ít nhất lần sau có cái để nhớ.”","Luca writes the first line. “At least I’ll have something to refer to.”"],["“Vậy không đổi cả cỡ xay lẫn nước một lúc nữa.” Luca khoanh một dòng trong sổ.","“So I won’t change grind and water together.” Luca circles a line in the notebook."]],"fact":["Cân giúp ghi khối lượng. Game dùng ml cho nước; ở nhà nên ghi đơn vị và lượng đồ uống riêng, tránh coi mọi con số là tương đương tuyệt đối.","A scale records mass. The game uses ml for water; at home record units and beverage yield separately rather than treating all numbers as exactly interchangeable."],"discovery":"tool-scale","modes":["talk","brew"],"memento":["Dòng đầu trong sổ Luca","Luca’s first notebook line"],"end":["Luca xé một bản chép công thức, xin ghim lên bảng. “Chưa phải công thức ngon nhất. Chỉ là lần đầu tôi nhớ mình đã làm gì.”","Luca pins a copied recipe. “Not my best cup. Just the first time I know what I did.”"],"guestIds":["luca"]},
 {"title":["Tấm bưu thiếp chưa gửi","The unsent postcard"],"guest":"Linh","scene":["Linh sắp chuyển đi, mang đến bản in ảnh chiều mưa. Chủ quán thử công thức 15 g với 240 ml nước. “Thêm một trang sổ, không phải đáp án cuối cùng.”","Linh is moving soon and brings a print of the rainy photo. The owner tries 15 g with 240 ml water. “Another notebook page, not a final answer.”"],"line":["“Chuyển đi rồi, sợ mọi thứ ở đây cứ tiếp tục còn mình thì quên mất.”","“I’m afraid life here will carry on and I’ll forget how it felt.”"],"options":[["Bạn có thể gửi quán một bưu thiếp.","You could send the café a postcard."],["Để lại một góc ảnh cho lần quay về.","Leave a picture here for your return."]],"replies":[["Linh xin địa chỉ quán. “Camila mê bưu thiếp viết tay mà. Tôi sẽ kể chuyện ly cà phê ở chỗ mới.”","Linh asks for the address. “Camila loves handwritten postcards. I’ll write about a cup in the new place.”"],["“Đừng tháo ảnh nhé.” Chủ quán chỉ một góc bảng còn trống.","“Keep the photo up.” The owner points to a free corner of the board."]],"fact":["15 g và 240 ml là tỷ lệ đầu vào 1:16. Đổi tỷ lệ có thể đổi độ đậm và quá trình chiết xuất; cảm nhận thật còn tùy nhiều điều kiện, không chỉ một con số.","15 g and 240 ml give a 1:16 input ratio. Ratio can affect strength and extraction; real perception depends on several conditions, not one number."],"discovery":"recipe-240","modes":["photo","brew"],"memento":["Góc bảng dành cho bưu thiếp","A corner for a postcard"],"end":["Linh viết địa chỉ quán lên tấm thiệp. Lần này khoảng trống trên bảng có một lời hẹn.","Linh writes the café’s address on a card. This empty space now holds a promise."],"guestIds":["linh"]},
 {"title":["Chiếc ghế đã thành chỗ quen","Your usual seat"],"guest":"Camila · Luca","scene":["Bạn ghé quán, Luca đã ngồi bên cửa, xe đạp dựng gọn bên ngoài. Camila mang một chậu húng quế nhỏ: “Bà tôi hay để cây cạnh chỗ pha cà phê. Cho góc quán một chút xanh nhé.” Chủ quán mở túi Costa Rica Honey, đưa bưu thiếp Linh gửi: cô đã tìm được một quán nhỏ ở nơi mới.","You arrive to find Luca by the window, his bike parked outside. Camila brings a little basil plant. “My grandmother kept plants beside her coffee corner. A little green for this café?” The owner opens Costa Rica Honey and shows Linh’s postcard: she has found a little café in her new town."],"line":["Chủ quán hỏi: “Bảy lần ghé rồi. Bạn muốn giữ lại điều gì ở góc này?”","The owner asks: “Seven visits. What would you like to keep in this corner?”"],"options":[["Những người mình đã gặp.","The people I’ve met."],["Cảm giác được thử mà không cần giỏi ngay.","Being allowed to try without being good yet."]],"replies":[["Luca kéo thêm ghế cho Camila. Tấm bưu thiếp nằm giữa bàn, như Linh cũng đang ngồi đó.","Luca pulls out a chair for Camila. Linh’s postcard sits between you, as if she were here too."],["Chủ quán đẩy cuốn sổ sang bạn. “Vậy cứ để trang sau còn chỗ viết.”","The owner slides the notebook over. “Then let’s leave room on the next page.”"]],"fact":["Honey là tên một nhóm cách sơ chế có giữ lại một phần chất nhầy khi phơi, không có nghĩa thêm mật ong. Cách thực hiện giữa các nơi có thể khác nhau.","Honey describes processing that retains some mucilage during drying, not added honey. Practices vary between producers."],"discovery":"bean-costa-rica-honey","modes":["talk","photo"],"memento":["Chậu cây bên cửa","The plant by the window"],"end":["Chậu cây được đặt cạnh chiếc ghế ngày đầu. Bạn từng ghé để uống cà phê. Giờ có vài người nhớ chỗ bạn hay ngồi. Hết chương thử: Bảy lần ghé quán.","The plant goes beside the first day’s chair. You came for coffee. Now a few people know your usual seat. End of the pilot cha function loadSevenVisits(raw){
 if(raw===null)return {store:{version:1,visits:[]},writable:true};
 try{const s=JSON.parse(raw);if(s.version!==1||!Array.isArray(s.visits)||s.visits.length>7)throw Error();s.visits.forEach((v,i)=>{if(!v||!sevenVisits[i].modes.includes(v.mode)||typeof v.closed!=='boolean'||v.closed&&v.choice===null||v.photo!==null&&(!v.photo||!['window','lamp'].includes(v.photo.light)||!['cup','card','plant'].includes(v.photo.object))||(i<s.visits.length-1&&!v.closed)||![null,'listen','reply-0','reply-1','photo','brew-opened'].includes(v.choice)||v.choice?.startsWith('reply-')&&v.mode!=='talk'||v.choice==='photo'&&(v.mode!=='photo'||!v.photo||!['window','lamp'].includes(v.photo.light)||!['cup','card','plant'].includes(v.photo.object))||v.choice==='brew-opened'&&v.mode!=='brew')throw Error();});return {store:s,writable:true};}catch{return {store:{version:1,visits:[]},writable:false,raw};}
}
function nextSevenVisit(store,random=Math.random){if(store.visits.length===7||store.visits.at(-1)&&!store.visits.at(-1).closed)throw Error('Finish the current visit first');const modes=sevenVisits[store.visits.length].modes;const mode=modes[Math.min(modes.length-1,Math.max(0,Math.floor(random()*modes.length)))];return {...store,visits:[...store.visits,{mode,closed:false,choice:null,photo:null}]};}
function updateSevenVisit(store,patch){if(!store.visits.length||store.visits.at(-1).closed)throw Error('No open visit');const visits=store.visits.map((v,i)=>i===store.visits.length-1?{...v,...patch}:v);const next={version:1,visits};if(!loadSevenVisits(JSON.stringify(next)).writable)throw Error('Invalid visit');return next;}

 function activity(scene,v){if(v.closed)return '';

  if(v.mode==='talk')return `<section class="visit-activity"><h4>${name}</h4><p>${at(scene.line)}</p><div class="actions">${scene.options.map((o,i)=>`<button type="button" class="secondary" data-visit-reply="${i}" aria-pressed="${v.choice===`reply-${i}`}">${at(o)}</button>`).join('')}</div>${v.choice?.startsWith('reply-')?`<p class="visit-response" role="status">${at(scene.replies[Number(v.choice.slice(-1))])}</p>`:''}<p class="help">${tx('Không có đáp án đúng; lời đáp chọn một nhánh của câu chuyện.','There is no correct answer; your reply chooses a story branch.')}</p></section>`;
  if(v.mode==='photo')return `<section class="visit-activity"><h4>${name}</h4><p>${tx('Thử đổi ánh sáng và món đồ trên bàn, rồi giữ lại một khung hình cho bảng quán.','Change the light and the object on the table, then keep a frame for the café board.')}</p><div id="visit-photo-preview">${photoArt(photo)}</div><div class="visit-photo-controls"><label>${tx('Ánh sáng','Light')}<select id="visit-light"><option value="window" ${photo.light==='window'?'selected':''}>${tx('Cửa sổ chiều mưa','Rainy window')}</option><option value="lamp" ${photo.light==='lamp'?'selected':''}>${tx('Đèn bàn ấm','Warm lamp')}</option></select></label><label>${tx('Đồ vật','Object')}<select id="visit-object">${['cup','card','plant'].map((x,i)=>`<option value="${x}" ${photo.object===x?'selected':''}>${at([['Ly cà phê','Coffee cup'],['Bưu thiếp','Postcard'],['Chậu cây','Plant']][i])}</option>`).join('')}</select></label></div><button type="button" id="visit-shutter">${tx('Giữ khung hình này','Keep this frame')}</button>${v.choice==='photo'?`<p class="visit-response" role="status">${tx('Đã giữ khung hình cho bảng quán.','Frame kept for the café board.')}</p>`:''}</section>`;
  return `<section class="visit-activity"><h4>${name}</h4><p>${tx('Chủ quán mời bạn thử gợi ý tại bàn pha. Bạn có thể quay lại nghe chuyện bất cứ lúc nào.','The owner invites you to try this suggestion at the brew station. Return to the story whenever you like.')}</p><button type="button" id="visit-brew">${tx('Xem gợi ý tại bàn pha','Open the brew suggestion')}</button>${v.choice==='brew-opened'?`<p class="help">${tx('Bạn đã mở lời mời pha. Đây không phải xác nhận đã pha xong. Quay lại mục “7 ngày cà phê” để tiếp tục câu chuyện.','You opened the invitation. This does not certify a completed brew. Return to “Seven café days” to continue the story.')}</p>`:''}</section>`;
 }
 function markup(){const current=store.visits.length-1,index=archive??current,v=store.visits[index],scene=sevenVisits[index];const allDone=store.visits.length===7&&store.visits[6].closed;
 return `<section class="seven-card" aria-labelledby="visit-title"><span class="eyebrow">${tx('CHƯƠNG THỬ · 7 NGÀY CÀ PHÊ','PILOT CHAPTER · SEVEN CAFÉ DAYS')}</span><h2 id="visit-title" tabindex="-1">${scene?`${index+1}/7 · ${at(scene.title)}`:tx('Hẹn bạn ở chiếc ghế cạnh cửa','Meet you by the window')}</h2>${!scene?`<p class="help">${tx('Bảy buổi theo nhịp của bạn, không theo lịch bắt buộc. Có thể chơi tiếp ngay hoặc quay lại hôm khác. Chuyện và nhân vật hư cấu.','Seven visits at your pace, without a calendar requirement. Continue now or another day. Stories and characters are fictional.')}</p>`:""}${!scene?`<p>${tx('Bạn chỉ định ghé uống cà phê. Nhưng có một chiếc ghế, vài người khách và một câu chuyện đang chờ.','You only meant to stop for coffee. A chair, a few guests and a story are waiting.')}</p><button type="button" id="visit-start">${tx('Ghé quán lần đầu','Make your first visit')}</button>`:`${scene.guestIds.map(id=>{const person=sevenGuests.find(g=>g.id===id);return `<div class="visit-guest"><span aria-hidden="true">${person.name[0]}</span><div><strong>${person.name}</strong><small>${at(person.country)} · ${at(person.continent)}</small></div></div><details class="visit-person"><summary>${tx('Làm quen với','Meet')} ${person.name}</summary><p>${at(person.about)}</p></details>`;}).join('')}<p class="visit-scene">${at(scene.scene)}</p><details><summary>${tx('Chủ quán có gì mới?','What’s new with the owner?')}</summary><p>${at(scene.fact)}</p></details>${archive!==null||v.closed?`<p class="visit-quote">${at(scene.line)}</p>${v.choice?.startsWith('reply-')?`<p>${at(scene.options[Number(v.choice.slice(-1))])}</p><p class="visit-response">${at(scene.replies[Number(v.choice.slice(-1))])}</p>`:''}${v.choice==='photo'?photoArt(v.photo):''}<p class="visit-ending">${at(scene.end)}</p>`:activity(scene,v)}${!v.closed?`<div class="visit-exit actions"><button type="button" id="visit-close">${tx('Khép lại buổi ghé quán','Close this visit')}</button>${v.choice!=='listen'?`<button type="button" id="visit-listen" class="secondary">${tx('Hôm nay chỉ muốn nghe chuyện','Just listen today')}</button>`:''}</div>`:archive===null&&!allDone?`<button type="button" id="visit-next">${tx('Ghé quán buổi tiếp theo','Visit again')}</button>`:''}${archive!==null?`<button type="button" id="visit-current" class="secondary">${tx('Về buổi hiện tại','Back to current visit')}</button>`:''}`}
 ${allDone&&archive===null?`<p class="visit-finale">${tx('Bạn đã đi hết chương thử. Bảng quán giữ lại những lần ghé này; nội dung mới sau chương 1 chưa được thêm. Bạn vẫn có thể luyện pha hoặc xem lại kỷ niệm bên dưới.','You have reached the end of the pilot. The board keeps these visits; a chapter beyond this one is not available yet. You can still practice brewing or revisit your memories below.')}</p>`:''}<p id="visit-status" role="status">${notice}</p>${!loaded.writable?`<p class="warning">${tx('Chưa đọc được tiến độ; dữ liệu gốc được giữ nguyên. Không thể ghi tiến độ mới.','Progress could not be read; the original data remains untouched. New progress cannot be written.')}</p>`:''}${store.visits.some(x=>x.closed)?`<details class="visit-board"><summary>${tx('Bảng kỷ niệm của quán','The café memory board')} · ${store.visits.filter(x=>x.closed).length}/7</summary><div class="visit-mementos">${store.visits.map((x,i)=>x.closed?`<button type="button" class="secondary" data-visit-archive="${i}">${x.choice==='photo'?photoArt(x.photo):''}${i+1} · ${at(sevenVisits[i].memento)}</button>`:'').join('')}</div></details>`:''}${store.visits.length||loaded.raw!==undefined?`<button type="button" id="visit-export" class="secondary">${tx('Tải bản sao chương truyện','Download chapter backup')}</button>`:''}<details><summary>${tx('Về chương & lưu tiến độ','About the chapter & saving')}</summary><p class="help">${tx('Bảy buổi ghé theo nhịp của bạn, tiếp tục ngay hoặc hôm khác. Mọi hoạt động đều tùy chọn. Nhân vật và câu chuyện hư cấu. Tiến độ chỉ lưu trong trình duyệt này; xóa dữ liệu hoặc đổi thiết bị có thể làm mất tiến độ.','Seven visits at your pace; continue now or another day. All activities are optional. Characters and stories are fictional. Progress is local to this browser; clearing data or switching devices may lose progress.')}</p></details></section>`;
 }
 function draw(focus=false){const host=root?.querySelector('#seven-visits');if(!host)return;host.innerHTML=markup();bindControls(host);if(focus)host.querySelector('#visit-title').focus({preventScroll:true});}
 function persist(next){if(!loaded.writable){notice=tx('Chưa thể lưu tiến độ.','Progress cannot be saved.');draw();return false;}try{localStorage.setItem(sevenVisitsKey,JSON.stringify(next));store=next;notice='';return true;}catch{notice=tx('Chưa lưu được. Buổi hiện tại vẫn giữ nguyên; thử lại khi có dung lượng.','Could not save. Your current visit is unchanged; retry when storage is available.');draw();return false;}}
 function bindControls(host){if(!host)return;const on=(id,fn)=>host.querySelector(id)?.addEventListener('click',fn);
 on('#visit-start',()=>{if(persist(nextSevenVisit(store))){photo={light:'window',object:'cup'};draw(true);}});
 on('#visit-next',()=>{if(persist(nextSevenVisit(store))){photo={light:'window',object:'cup'};draw(true);}});
 on('#visit-current',()=>{archive=null;photo=store.visits.at(-1)?.photo||{light:'window',object:'cup'};draw(true);});
 host.querySelectorAll('[data-visit-archive]').forEach(button=>button.onclick=()=>{archive=Number(button.dataset.visitArchive);draw(true);});
 host.querySelectorAll('[data-visit-reply]').forEach(button=>button.onclick=()=>{if(persist(updateSevenVisit(store,{choice:`reply-${button.dataset.visitReply}`})))draw();});
 on('#visit-listen',()=>{if(persist(updateSevenVisit(store,{choice:'listen'})))draw();});
 on('#visit-close',()=>{if(persist(updateSevenVisit(store,{closed:true,choice:store.visits.at(-1).choice||'listen'})))draw(true);});
 for(const field of ['light','object'])host.querySelector(`#visit-${field}`)?.addEventListener('change',e=>{photo={...photo,[field]:e.target.value};host.querySelector('#visit-photo-preview').innerHTML=photoArt(photo);});
 on('#visit-shutter',()=>{if(persist(updateSevenVisit(store,{choice:'photo',photo:{...photo}})))draw();});
 on('#visit-brew',()=>{const scene=sevenVisits[store.visits.length-1],item=dailyDiscoveries.find(x=>x.id===scene.discovery),recipe=firstPourPreset(item.bean||'ethiopia');if(item.kind==='recipe'){recipe.dose=item.dose;recipe.ratio=item.ratio;}if(!persist(updateSevenVisit(store,{choice:'brew-opened'})))return;draw();window.dispatchEvent(new CustomEvent('c6s-daily-practice',{detail:{id:item.id,title:at(item.title),kind:item.kind,recipe,focus:item.focus}}));});
 on('#visit-export',()=>{const url=URL.createObjectURL(new Blob([loaded.raw!==undefined&&!loaded.writable?loaded.raw:JSON.stringify(store,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='c6s-seven-visits-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
 if(!loaded.writable)host.querySelectorAll('#visit-start,#visit-next,#visit-close,#visit-listen,[data-visit-reply],#visit-shutter,#visit-brew').forEach(b=>b.disabled=true);
 }
 return {markup(lang){language=lang;return `<div id="seven-visits">${markup()}</div>`;},bind(element){root=element;bindControls(root.querySelector('#seven-visits'));}};
}

const cafeDayKey='c6s.cafe-day.v1';
const cafeDayModes=['memory','labels','photo','brew'];
const cafeDayGuests=[
 {id:'linh',name:'Linh Nguyễn',origin:['Việt Nam · Châu Á','Vietnam · Asia'],story:['Linh mang cuốn ký họa từ Hội An. Cô kể, lúc mẹ chờ phin nhỏ từng giọt, hai người thường kể cho nhau nghe một chuyện trong ngày. Hôm nay cô muốn vẽ một người đang ngồi yên, thay vì một căn nhà.','Linh brings a sketchbook from Hội An. While her mother waited for the phin to drip, they would share one story from their day. Today she wants to draw someone sitting quietly, rather than a building.'],question:['“Bạn sẽ kể gì trong lúc chờ một ly cà phê?”','“What would you share while waiting for a coffee?”'],answers:[['Một chuyện vui rất nhỏ.','A tiny happy moment.'],['Có lẽ hôm nay chỉ muốn nghe.','Perhaps I just want to listen today.']],responses:[['Linh ghi một dòng dưới nét vẽ. “Những chuyện nhỏ mới dễ quên. Để tôi giữ hộ một chút.”','Linh adds a line under her sketch. “Small things are easy to forget. Let me keep that for you.”'],['Linh gật đầu, kể về con mèo hay chiếm ghế ở nhà mẹ. Một khoảng lặng cũng có chỗ ở quán.','Linh nods and tells you about the cat that steals her mother’s chair. There is room for quiet here too.']],end:['Linh để lại một nét vẽ chiếc ghế của bạn trên bảng quán.','Linh leaves a sketch of your chair on the café board.']},
 {id:'luca',name:'Luca Rossi',origin:['Ý · Châu Âu','Italy · Europe'],story:['Luca, điều dưỡng từ Bologna, dựng chiếc xe đạp cũ ngoài cửa. Anh quen uống espresso nhanh trước ca trực, nhưng hôm nay đã được nghỉ. Anh muốn biết một ly cà phê sẽ khác thế nào nếu mình chịu ngồi lại.','Luca, a nurse from Bologna, parks his old bicycle outside. He is used to a quick espresso before a shift, but today is his day off. He wonders how a coffee might feel if he stays for a while.'],question:['“Nếu không cần vội, bạn sẽ làm gì ở quán?”','“If there were no rush, what would you do here?”'],answers:[['Ngắm những người đi ngang cửa.','Watch people passing the window.'],['Thử một cách pha mình chưa biết.','Try a brewing method I don’t know.']],responses:[['Luca kéo ghế về phía cửa. “Tôi đã đi qua con phố này hàng chục lần mà chưa từng nhìn chiếc ban công kia.”','Luca turns toward the window. “I’ve passed this street so often and never noticed that balcony.”'],['“Tôi biết ấm moka nhà mình, nhưng chưa biết hết những cách khác.” Anh mở sổ, nhường bạn trang đầu.','“I know my moka pot, but there are so many other ways.” He opens his notebook and offers you the first page.']],end:['Luca vẽ chiếc xe đạp cùng một tách nhỏ lên giấy lót ly.','Luca draws his bike beside a little cup on a coaster.']},
 {id:'amina',name:'Amina Njeri',origin:['Kenya · Châu Phi','Kenya · Africa'],story:['Amina là người làm vườn từ Nairobi, thích ghi âm tiếng chim. Hồi nhỏ, cô biết cây cà phê trong vườn người dì trước khi biết vị cà phê trong cốc. Hôm nay cô đem một bức ảnh quả chín để hỏi chủ quán về hành trình từ quả tới hạt rang.','Amina is a gardener from Nairobi who records birdsong. As a child she knew the coffee trees in her aunt’s garden before she knew coffee in a cup. Today she brings a photo of ripe cherries to ask about their journey to roasted beans.'],question:['“Bạn từng nghĩ đến quả cà phê khi nhìn một tách uống chưa?”','“Have you ever thought about coffee cherries while looking at a cup?”'],answers:[['Tôi muốn biết hạt được lấy ra thế nào.','I’d like to know how the seed is removed.'],['Tôi muốn nhìn lại bức ảnh của bạn.','I’d like another look at your photo.']],responses:[['Amina đặt ảnh cạnh túi hạt. Chủ quán chỉ dòng sơ chế: một cái tên trên nhãn bỗng có thêm ý nghĩa.','Amina places the photo beside a bag. The owner points to the processing label; a word on the bag gains meaning.'],['Cô chỉ hai quả khác màu trên cùng cành. “Chỉ một tấm ảnh cũng còn rất nhiều điều để hỏi.”','She points to two different-colored cherries on one branch. “Even one photo leaves so much to ask.”']],end:['Amina để lại tấm thẻ vẽ một cành cà phê, hẹn lần sau mang tiếng chim.','Amina leaves a card showing a coffee branch and promises birdsong another time.']},
 {id:'camila',name:'Camila Santos',origin:['Brazil · Nam Mỹ','Brazil · South America'],story:['Camila từ Belo Horizonte mang theo cuốn sổ ép lá. Cô nhớ bà thường mời một cafezinho, pha bằng lọc vải coador trong nhà, rồi kéo ghế ngồi nói chuyện. Vừa đổi việc, cô tìm đến quán để có một chỗ ngồi được chào đón như thế.','Camila from Belo Horizonte brings a notebook of pressed leaves. Her grandmother would offer a cafezinho, made with their household cloth coador, and pull up a chair to talk. Between jobs, she is looking for that same welcome.'],question:['“Một quán quen cần điều gì để bạn muốn quay lại?”','“What makes a café somewhere you want to return to?”'],answers:[['Có người nhớ chỗ tôi hay ngồi.','Someone remembers my usual seat.'],['Có điều mới để tò mò mỗi lần ghé.','Something new to discover each visit.']],responses:[['Camila đặt chiếc lá ép lên bàn. “Vậy mình đánh dấu chỗ này bằng một chậu cây nhé?”','Camila places a pressed leaf on the table. “Shall we mark this corner with a plant?”'],['Cô cười, mở trang bưu thiếp trắng. “Tôi cũng thích cảm giác chưa biết hôm nay sẽ nghe chuyện gì.”','She opens a blank postcard. “I also like not knowing what story I’ll hear today.”']],end:['Camila gửi lại chiếc lá ép, góc quán có thêm một chút xanh.','Camila leaves a pressed leaf; the café gains a little green.']},
 {id:'aiko',name:'Aiko Tanaka',origin:['Nhật Bản · Châu Á','Japan · Asia'],story:['Aiko là thợ gốm từ Kyoto. Cô mang chiếc cốc đầu tiên mình nung thành công, vành hơi lệch, bảo chủ quán thử cầm trước khi rót. Một lần ghé kissaten cùng bố khiến cô bắt đầu để ý cả chiếc cốc, chứ không chỉ món uống.','Aiko is a potter from Kyoto. She brings the first cup she successfully fired, its rim a little uneven, and asks the owner to hold it before pouring. A visit to a kissaten with her father first made her notice the cup as well as the drink.'],question:['“Bạn sẽ giữ chiếc cốc hơi lệch này chứ?”','“Would you keep this slightly uneven cup?”'],answers:[['Có, vì nó có một câu chuyện.','Yes, because it has a story.'],['Tôi muốn thử cảm giác cầm nó trước.','I’d like to hold it first.']],responses:[['Aiko xoay chiếc cốc, chỉ dấu tay trên đáy. “Tôi đã định mài mất dấu này.”','Aiko turns the cup and shows a fingerprint underneath. “I nearly polished that away.”'],['Cô đưa quai cốc về phía bạn. “Đúng rồi, có những điều chỉ khi thử mới biết mình thích gì.”','She turns the handle toward you. “Some things you only discover by trying.”']],end:['Aiko để bản phác chiếc cốc lên bảng, giữ nguyên nét vành cong.','Aiko pins a sketch of the cup, keeping its uneven rim.']},
 {id:'noah',name:'Noah Martin',origin:['Canada · Bắc Mỹ','Canada · North America'],story:['Noah từ Montréal làm thiết kế âm thanh, thường mang cà phê lọc trong bình khi đi bộ ghi âm. Hôm nay máy ghi âm hết pin. Anh ngồi xuống, lần đầu nhận ra tiếng thìa chạm cốc ở quán cũng đáng nghe.','Noah from Montréal designs sound and takes filter coffee in a flask on recording walks. Today his recorder has run out of battery. Sitting down, he notices the café’s spoon against a cup is worth listening to.'],question:['“Nếu chỉ giữ một âm thanh ở đây, bạn chọn gì?”','“If you could keep one sound from here, what would you choose?”'],answers:[['Tiếng nước rót và giọt cà phê.','Pouring water and dripping coffee.'],['Tiếng người trò chuyện xa xa.','People talking softly nearby.']],responses:[['Noah nhắm mắt. “Có mở đầu, có nhịp, rồi nhỏ dần. Giống một đoạn nhạc rất ngắn.”','Noah closes his eyes. “A beginning, a rhythm, then it fades. A tiny piece of music.”'],['Anh cất máy vào túi. “Hôm nay nghe thôi, không cần ghi lại tất cả.”','He puts the recorder away. “Today I’ll just listen. I don’t need to record everything.”']],end:['Noah vẽ ba nét sóng âm lên giấy lót ly cho bảng quán.','Noah draws three sound waves on a coaster for the board.']},
 {id:'ella',name:'Ella Wilson',origin:['Úc · Châu Đại Dương','Australia · Oceania'],story:['Ella là thợ sửa sách từ Melbourne, thích đi bộ tìm quán nhỏ. Cuốn sổ địa chỉ của cô có vết cà phê từ một buổi sáng uống flat white cùng bạn cũ. Hôm nay cô muốn thêm vào đó một quán bằng câu chuyện, thay vì chỉ ghi tọa độ.','Ella repairs books in Melbourne and likes finding little cafés on foot. Her address book has a coffee stain from a flat white with an old friend. Today she wants to add a café through its story, rather than just its location.'],question:['“Bạn sẽ ghi một dòng gì về quán này?”','“What line would you write about this café?”'],answers:[['Một chỗ để chậm lại.','A place to slow down.'],['Một chỗ luôn có người để gặp.','A place with someone to meet.']],responses:[['Ella viết bên cạnh vết cà phê cũ. “Không phải vết nào cũng cần xóa khỏi trang sách.”','Ella writes beside the old stain. “Not every mark needs removing from a page.”'],['Cô dành hẳn một trang mới. “Vậy lần sau tôi sẽ còn chỗ để viết tiếp.”','She leaves a fresh page. “Then I’ll have room to add more next time.”']],end:['Ella để lại một thẻ đánh dấu sách: “Còn chuyện để kể.”','Ella leaves a bookmark: “More stories to tell.”']}
];
function cafeDaySchedule(date=new Date()){
 const d=dailyDiscovery(date),ordinal=Math.round((Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())-Date.UTC(2026,9,24))/86400000),index=((ordinal%7)+7)%7;return {...d,guest:cafeDayGuests[index],guestIndex:index,tomorrow:cafeDayGuests[(index+1)%7]};
}
function newCafeDay(previousMode=null,random=Math.random){const pool=cafeDayModes.filter(x=>x!==previousMode),n=Math.min(pool.length-1,Math.max(0,Math.floor(random()*pool.length)));return {mode:pool[n],reply:null,activity:'offered',closed:false,flipped:[],matched:[],labels:0,photo:{light:'window',object:'cup'}};}

const firstExperimentFields=['grind','temp','ratio','time'];
function firstRecipeChanges(before,after){

}
function firstExperimentPair(records,entry){
 if(!entry?.baselineId)return {status:'unlinked'};
 const baseline=records.find(r=>r.id===entry.baselineId);
 if(!baseline)return {status:'missing-baseline'};
 const changed=firstRecipeChanges(baseline.recipe,entry.recipe);
 return {status:changed.length===1&&firstExperimentFields.includes(changed[0])?'one-change':'multiple-or-unchanged',baseline,changed};
}
function firstRadarPoints(axes){

}
function firstMemoryMatches(entry,query){

 const text=fold([entry.recipe.bean,firstPourBeans.find(b=>b.id===entry.recipe.bean)?.name,entry.feedback.notes,entry.feedback.nextChange].join(' '));
 return fold(query).trim().split(/\s+/).every(word=>text.includes(word));
}
