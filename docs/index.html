<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>The Coffee Six Sense</title></head><body><div id="app"></div><style>:root{font-family:Inter,system-ui,sans-serif;color:#f4eadb;background:#17120e;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:920px;margin:auto;padding:32px 20px 70px}header{padding:36px 0}h1{font-size:clamp(2.3rem,7vw,4.8rem);letter-spacing:-.055em;margin:10px 0}h2{margin:0 0 22px}.eyebrow,small,footer{color:#b8a48c}header p{max-width:620px;line-height:1.6;color:#d6c6b2}.panel{background:#241b15;border:1px solid #4b392b;border-radius:22px;padding:28px;margin-bottom:22px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}label{display:block;font-size:.9rem;margin-bottom:18px;color:#e5d3bc}input,select,textarea{display:block;width:100%;margin-top:8px;border:1px solid #67503b;border-radius:10px;background:#17120e;color:#fff;padding:13px;font:inherit}button{background:#dca66b;color:#21150b;border:0;border-radius:11px;padding:13px 20px;font-weight:750;cursor:pointer}.secondary{background:transparent;border:1px solid #947150;color:#e9c49b}.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px}.section-head h2{margin:0}.result{border-top:1px solid #57402c;margin-top:25px;padding-top:15px}.session{border-top:1px solid #49372a;padding:18px 0}.session small{display:block;margin-top:6px;overflow-wrap:anywhere}.session p{margin:10px 0}footer{font-size:.8rem;line-height:1.6}@media(max-width:550px){.fields{grid-template-columns:1fr}.panel{padding:20px}.section-head{align-items:flex-start;flex-direction:column}}
/* Taste Lab and comparison */
.compare{margin-bottom:24px;padding:18px;background:#1b1510;border:1px solid #49372a;border-radius:14px}
.compare h3{margin-top:0}.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem;text-align:left}
th,td{padding:11px;border-bottom:1px solid #49372a;white-space:nowrap}
th{color:#d9bb99}td{color:#f4eadb}
textarea{resize:vertical;min-height:80px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #eab878;outline-offset:2px}
@media(max-width:550px){.compare{padding:12px}th,td{padding:8px}}

.journey progress{width:100%;height:14px;accent-color:#dca66b}.badges{list-style:none;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.badges li{padding:14px;border:1px solid #67503b;border-radius:12px;color:#b8a48c}.badges .earned{background:#362819;color:#f4d1a6}.badges small{display:block;margin-top:6px}.journey p{line-height:1.6}.experiment{border-left:3px solid #dca66b;padding:1px 16px;margin:20px 0}.retry{margin-top:14px}@media(max-width:550px){.badges{grid-template-columns:1fr}}

.quest-list{list-style:none;padding:0;display:grid;gap:12px}.quest{padding:18px;border:1px solid #67503b;border-radius:14px;display:flex;gap:18px;align-items:center;justify-content:space-between}.quest p{line-height:1.6;margin:8px 0}.quest.active{border-color:#dca66b;background:#362819}.quest.complete{border-color:#81996c}.quest.locked{color:#b8a48c}.quest button{flex-shrink:0}.missions>p{line-height:1.6}#quest-message{color:#e9c49b}@media(max-width:550px){.quest{align-items:stretch;flex-direction:column}.missions .section-head{gap:8px}}
</style><script type="module">
const weights = { dose: 3, water: 0.16, temp: 4, grind: 3 };
function nextExperiment(bean, parameters) {
  const field = Object.keys(weights).sort((a, b) => Math.abs(parameters[b] - bean.target[b]) * weights[b] - Math.abs(parameters[a] - bean.target[a]) * weights[a])[0];
  if (Number(parameters[field]) === bean.target[field]) return 'You matched this game recipe. Try another bean, or change one setting and compare the results.';
  const names = { dose: 'dose', water: 'water volume', temp: 'temperature', grind: 'grind setting' };
  return `Try ${parameters[field] > bean.target[field] ? 'lowering' : 'raising'} your ${names[field]} next. Keep the other settings unchanged to compare the effect. This hint follows the game model, not a measured extraction.`;
}
function progression(sessions) {
  const discoveries = sessions.filter(s => typeof s.discovery === 'string' && s.discovery.trim()).length;
  const xp = sessions.length * 10 + discoveries * 5;
  const level = Math.floor(xp / 50) + 1;
  const badges = [
    { name: 'First cup', hint: 'Save your first brew', earned: sessions.length >= 1 },
    { name: 'Curious taster', hint: 'Record three discoveries', earned: discoveries >= 3 },
    { name: 'Bean explorer', hint: 'Save brews with all three starter beans', earned: ['ethiopia', 'colombia', 'brazil'].every(id => sessions.some(s => s.bean === id)) },
    { name: 'Practice makes progress', hint: 'Save five brews', earned: sessions.length >= 5 }
  ];
  return { xp, level, remaining: 50 - xp % 50, progress: xp % 50, badges };
}

const fields = ['dose', 'water', 'temp', 'grind'];
const starterBeans = ['ethiopia', 'colombia', 'brazil'];

// Only saved sessions count. Missions are derived so old journals keep their progress.
function missionProgress(sessions) {
  const visited = starterBeans.filter(bean => sessions.some(s => s.bean === bean));
  const discoveries = sessions.filter(s => typeof s.discovery === 'string' && s.discovery.trim()).length;
  const controlled = sessions.some((current, index) => {
    const previous = sessions[index - 1];
    if (!previous || current.bean !== previous.bean || !current.discovery?.trim()) return false;
    if (!fields.every(field => Number.isFinite(current.parameters?.[field]) && Number.isFinite(previous.parameters?.[field]))) return false;
    return fields.filter(field => current.parameters[field] !== previous.parameters[field]).length === 1;
  });
  const steadyBean = starterBeans.find(bean => sessions.filter(s => s.bean === bean && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 90).length >= 3);
  const bestRun = Math.max(0, ...starterBeans.map(bean => sessions.filter(s => s.bean === bean && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 90).length));
  const missions = [
    { id: 'explore', title: 'Meet the beans', description: 'Save one brew with each of the three starter beans.', count: visited.length, total: 3, bean: starterBeans.find(bean => !visited.includes(bean)) },
    { id: 'discover', title: 'Notice something new', description: 'Save three brews with a discovery: what did you notice or want to try next?', count: Math.min(discoveries, 3), total: 3 },
    { id: 'experiment', title: 'Change one thing', description: 'Save two consecutive brews of the same bean with exactly one recipe setting changed. Add a discovery to the second brew.', count: Number(controlled), total: 1 },
    { id: 'steady', title: 'Find your rhythm', description: 'Save three brews of the same bean with a simulated balance of 90 or more. This is a game recipe goal, not a taste assessment.', count: Math.min(bestRun, 3), total: 3, bean: steadyBean }
  ];
  let unlocked = true;
  return missions.map(mission => {
    const complete = mission.count >= mission.total;
    const result = { ...mission, complete, locked: !unlocked };
    unlocked = unlocked && complete;
    return result;
  });
}


const beans = [
  { id: 'ethiopia', name: 'Ethiopia · Washed', target: { dose: 20, water: 300, temp: 94, grind: 18 }, notes: 'Floral · Citrus' },
  { id: 'colombia', name: 'Colombia · Honey', target: { dose: 20, water: 300, temp: 93, grind: 20 }, notes: 'Caramel · Red fruit' },
  { id: 'brazil', name: 'Brazil · Natural', target: { dose: 20, water: 300, temp: 92, grind: 22 }, notes: 'Chocolate · Nuts' }
];
const key = 'c6s.sessions.v1';
const dimensions = ['aroma','acidity','sweetness','bitterness','body','aftertaste'];
const ratingFields = () => dimensions.map(k => `<label>${k[0].toUpperCase()+k.slice(1)} (1–5)<select name="taste_${k}">${[1,2,3,4,5].map(n => `<option value="${n}" ${n===3?'selected':''}>${n}</option>`).join('')}</select></label>`).join('');
const avg = s => s.taste ? (dimensions.reduce((n,k)=>n+Number(s.taste[k]||0),0)/dimensions.length).toFixed(1) : '—';
const compare = (a,b) => {
  const fields = ['dose','water','temp','grind'];
  return fields.map(k=>`<tr><th>${k}</th><td>${esc(a.parameters?.[k]??'—')}</td><td>${esc(b.parameters?.[k]??'—')}</td></tr>`).join('') +
    `<tr><th>Simulated score</th><td>${esc(a.simulatedScore)}</td><td>${esc(b.simulatedScore)}</td></tr><tr><th>Subjective mean*</th><td>${avg(a)}</td><td>${avg(b)}</td></tr>`;
};
const read = () => { try { const x = JSON.parse(localStorage.getItem(key) || '[]'); return Array.isArray(x) ? x : []; } catch { return []; } };
let sessions = read();
const app = document.querySelector('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const label = b => beans.find(x => x.id === b)?.name || b;
const score = (bean, p) => Math.max(0, Math.round(100 - Object.keys(bean.target).reduce((sum, k) => sum + Math.abs(Number(p[k]) - bean.target[k]) * ({dose:3,water:0.16,temp:4,grind:3}[k]), 0)));
function render() {
  const journey = progression(sessions);
  const missions = missionProgress(sessions);
  const activeMission = missions.find(m => !m.complete && !m.locked);
  app.innerHTML = `<main><header><span class="eyebrow">THE COFFEE SIX SENSE · MVP 0.3</span><h1>Brew. Taste. Discover.</h1><p>Learn pour-over through experiments. Your sixth sense is the meaning you find in the cup.</p></header>
  <section class="panel journey" aria-labelledby="journey-title"><h2 id="journey-title">Your coffee journey</h2><p><strong>Level ${journey.level}</strong> · ${journey.xp} XP · ${journey.remaining} XP to the next level</p><progress max="50" value="${journey.progress}" aria-label="Progress to next level"></progress><p>Earn 10 XP for a saved brew and 5 more for a discovery. Progress rewards practice, not taste scores.</p><ul class="badges">${journey.badges.map(b => `<li class="${b.earned ? 'earned' : ''}"><strong>${b.earned ? '✓' : '○'} ${b.name}</strong><small>${b.hint}</small></li>`).join('')}</ul></section>
  <section class="panel missions" aria-labelledby="missions-title"><div class="section-head"><h2 id="missions-title">Brew quests</h2><span>${missions.filter(m => m.complete).length} / ${missions.length} complete</span></div><p>Follow the quests in order. Your saved Coffee Memory counts toward every goal.</p><ol class="quest-list">${missions.map(m => `<li class="quest ${m.complete ? 'complete' : m.locked ? 'locked' : 'active'}"><div><strong>${m.complete ? '✓ Complete' : m.locked ? 'Locked' : 'Your next quest'} · ${m.title}</strong><p>${m.description}</p><span>${m.count} / ${m.total}</span></div>${!m.complete && !m.locked ? `<button type="button" id="start-quest">${m.id === 'experiment' && sessions.length ? 'Use my last recipe' : 'Start this quest'}</button>` : ''}</li>`).join('')}</ol><p id="quest-message" role="status">${activeMission ? 'Choose your next quest below, then save your brew to make progress.' : 'All quests complete! Keep exploring your own recipes and discoveries.'}</p></section>
  <section class="panel"><h2>01 / Coffee Desk</h2><form id="brew"><label>Bean<select name="bean">${beans.map(b => `<option value="${b.id}">${b.name} — ${b.notes}</option>`).join('')}</select></label><div class="fields">
  <label>Dose (g)<input name="dose" type="number" min="5" max="50" value="20" required></label>
  <label>Water (ml)<input name="water" type="number" min="50" max="800" value="300" required></label>
  <label>Temperature (°C)<input name="temp" type="number" min="75" max="100" value="93" required></label>
  <label>Grind (relative setting)<input name="grind" type="number" min="1" max="40" value="20" required></label></div>
  <button type="submit">Simulate brew</button></form><div id="result" aria-live="polite"></div></section>
  <section class="panel"><div class="section-head"><h2>02 / Coffee Memory</h2><button id="export" class="secondary" type="button">Export JSON</button></div><div id="history">${sessions.length > 1 ? `<div class="compare"><h3>Compare two sessions</h3><div class="fields"><label>Session A<select id="compare-a">${sessions.map((s,i)=>`<option value="${i}">${esc(label(s.bean))} · ${esc(s.date.slice(0,10))} (#${i+1})</option>`).join('')}</select></label><label>Session B<select id="compare-b">${sessions.map((s,i)=>`<option value="${i}" ${i===sessions.length-1?'selected':''}>${esc(label(s.bean))} · ${esc(s.date.slice(0,10))} (#${i+1})</option>`).join('')}</select></label></div><div id="comparison"></div><p><small>*The mean is a simple display of personal ratings, not an objective quality score.</small></p></div>` : ''}${sessions.length ? sessions.slice().reverse().map((s, i) => `<article class="session"><strong>${esc(label(s.bean))} · ${s.simulatedScore}/100</strong><small>${esc(s.date)}</small><p>Personal taste: ${avg(s)}/5 · ${esc(s.discovery || 'No discovery recorded')}</p><p>${esc(s.notes || 'No tasting notes yet')}</p><small>${esc(JSON.stringify(s.parameters))}</small><button class="secondary retry" data-session="${sessions.length - 1 - i}" type="button">Brew again with these settings</button></article>`).join('') : '<p>No brews yet. Make your first cup above.</p>'}</div></section><footer>Simulation scores are educational game estimates, not measured extraction or objective taste quality.</footer></main>`;
  document.querySelector('#brew').addEventListener('submit', e => {
    e.preventDefault(); const form = new FormData(e.currentTarget); const bean = beans.find(b => b.id === form.get('bean'));
    const parameters = Object.fromEntries(['dose','water','temp','grind'].map(k => [k, Number(form.get(k))]));
    const simulatedScore = score(bean, parameters);
    const result = document.querySelector('#result');
    result.innerHTML = `<div class="result"><h3>Simulated balance: ${simulatedScore}/100</h3><p>This is a simplified game model, not a prediction of what you will actually taste.</p><aside class="experiment"><h3>Your next experiment</h3><p>${nextExperiment(bean, parameters)}</p></aside><h3>Personal tasting review</h3><p>Rate only what you actually tasted. For a virtual brew, leave these as a hypothetical exercise.</p><div class="fields">${ratingFields()}</div><label>Tasting notes<textarea id="notes" maxlength="1000" rows="3" placeholder="What did you notice?"></textarea></label><label>My discovery / next experiment<textarea id="discovery" maxlength="1000" rows="2" placeholder="What might improve the next cup?"></textarea></label><button id="save" type="button">Save to Coffee Memory</button></div>`;
    document.querySelector('#save').onclick = () => {
      const nextSessions = [...sessions, {id:(globalThis.crypto?.randomUUID?.() || `brew-${Date.now()}-${Math.random().toString(36).slice(2)}`),date:new Date().toISOString(),bean:bean.id,parameters,simulatedScore,notes:document.querySelector('#notes').value,discovery:document.querySelector('#discovery').value,taste:Object.fromEntries(dimensions.map(k=>[k,Number(document.querySelector(`[name=taste_${k}]`).value)]))}];
      try {localStorage.setItem(key,JSON.stringify(nextSessions));sessions = nextSessions;render();} catch {alert('Local storage is unavailable. Export your data after enabling storage.');}
    };
  });
  const restoreRecipe = session => {
    const form = document.querySelector('#brew');
    if (session) {
      form.elements.bean.value = session.bean;
      for (const field of ['dose', 'water', 'temp', 'grind']) form.elements[field].value = session.parameters?.[field] ?? form.elements[field].defaultValue;
    }
    document.querySelector('#result').textContent = 'Recipe ready. Change one setting, simulate, then record your discovery and save.';
    form.scrollIntoView({ behavior: 'smooth', block: 'start' });
    form.elements.bean.focus({ preventScroll: true });
  };
  document.querySelectorAll('.retry').forEach(button => button.addEventListener('click', () => restoreRecipe(sessions[Number(button.dataset.session)])));
  document.querySelector('#start-quest')?.addEventListener('click', () => {
    const last = sessions.at(-1);
    if (activeMission.id === 'experiment' && last) restoreRecipe(last);
    else {
      restoreRecipe(null);
      if (activeMission.bean) document.querySelector('#brew').elements.bean.value = activeMission.bean;
    }
    const message = activeMission.id === 'explore' ? 'Try this unvisited bean. Simulate and save to advance your quest.'
      : activeMission.id === 'discover' ? 'After simulating, write a discovery before saving.'
      : activeMission.id === 'experiment' ? 'Your last recipe is ready. Change exactly one setting and save a discovery about the result.'
      : 'Choose a bean and use the game hints to reach 90+ simulated balance. Save three brews of that bean.';
    document.querySelector('#result').textContent = message;
  });
  const ca=document.querySelector('#compare-a'), cb=document.querySelector('#compare-b');
  if(ca && cb){
    const update=()=>{document.querySelector('#comparison').innerHTML = ca.value===cb.value ? '<p>Choose two different sessions.</p>' : `<div class="table-wrap"><table><thead><tr><th>Measure</th><th>Session A</th><th>Session B</th></tr></thead><tbody>${compare(sessions[Number(ca.value)],sessions[Number(cb.value)])}</tbody></table></div>`;};
    ca.onchange=update;cb.onchange=update;update();
  }
  document.querySelector('#export').onclick = () => {
    const blob = new Blob([JSON.stringify(sessions,null,2)],{type:'application/json'});
    const url = URL.createObjectURL(blob); const a=document.createElement('a');a.href=url;a.download='coffee-memory.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
}
render();

</script></body></html>
