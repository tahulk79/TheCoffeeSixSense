function loadFirstShift(raw){
 if(raw===null)return {session:null,writable:true};
 try{const value=JSON.parse(raw);if(value.version!==1||typeof value.id!=='string'||!value.id||value.id.length>160||!validShiftFeedback(value.feedback)||value.answer!==null&&(!value.answer||typeof value.answer.bId!=='string'||!['grind','temp','ratio','time'].includes(value.answer.field)))throw Error('Invalid shift');return {session:value,writable:true};}catch{return {session:null,writable:false,raw};}
}
function firstShiftProgress(session,records){
 if(!session)return {phase:'welcome',completed:0,a:null,b:null};
 const a=records.find(r=>r.shift?.id===session.id&&r.shift.role==='a'&&r.pour.water===180&&r.practice?.pauses>=1);
 if(!a){const attempt=records.findLast(r=>r.shift?.id===session.id&&r.shift.role==='a');return {phase:'a',completed:0,a:null,b:null,reason:records.some(r=>r.shift?.id===session.id&&r.shift.role==='b')?'missing-a':attempt?(attempt.pour.water!==180?'need-volume':'need-pause'):null};}
 const b=records.find(r=>{if(r.shift?.id!==session.id||r.shift.role!=='b'||r.baselineId!==a.id)return false;const changed=firstRecipeChanges(a.recipe,r.recipe);return changed.length===1&&changed[0]==='grind'&&Math.abs(a.recipe.grind-r.recipe.grind)===1;});
 if(!b)return {phase:'b',completed:1,a,b:null};
 const correct=session.answer?.bId===b.id&&session.answer.field==='grind';
 return {phase:correct?'complete':'observe',completed:correct?3:2,a,b};
}
function answerFirstShift(session,records,field){
 const progress=firstShiftProgress(session,records);if(!['observe','complete'].includes(progress.phase)||!['grind','temp','ratio','time'].includes(field))throw Error('No saved pair to observe');
 return {...session,answer:{bId:progress.b.id,field}};
}

function firstShiftPanel({language,session,records,writable,raw,notice='',pending=false,feedback}){
 const tx=(vi,en)=>language==='vi'?vi:en,escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const progress=firstShiftProgress(session,records),phase=progress.phase;
 const pauseText=count=>language==='vi'?`${count} lần tự dừng`:`${count} deliberate pause${count===1?'':'s'}`;
 const portrait=`<svg viewBox="0 0 72 84" aria-hidden="true" focusable="false"><path fill="#526044" d="M0 0h72v84H0z"/><path fill="#2c231b" d="M15 35Q9 3 36 5q29 0 23 33l-5 15H20z"/><ellipse fill="#d8ab82" cx="36" cy="32" rx="17" ry="22"/><path fill="#392c20" d="M18 28q9-4 12-15 9 14 24 13L51 9 28 7 17 17z"/><path d="M27 34h3m12 0h3m-15 10q6 5 12 0" stroke="#573c29" stroke-width="2" fill="none" stroke-linecap="round"/><path fill="#c18f5f" d="M29 51h14v12H29z"/><path fill="#d9c9a5" d="M5 84q1-26 24-26l7 8 7-8q23 0 24 26z"/><path fill="#4b614b" d="M21 60h5v9h20v-9h5v24H21z"/></svg>`;
 const speech={welcome:tx('Mình là Mai. Quán vừa mở, mình muốn xem bạn pha hai ly thật chậm và có chủ đích.','I’m Mai. The café just opened. Let’s make two cups slowly and with a purpose.'),a:tx('Pha một mẻ với 180 ml nước nhé. Giữa một nhịp, thử tự thả nút rồi nhìn cà phê chảy tiếp.','Brew a batch with 180 ml of water. During a stage, release the button yourself and watch the coffee keep dripping.'),b:tx('Bạn đã biết dừng để quan sát. Giờ giữ công thức ấy, chỉ đổi cỡ xay đúng một nấc cho ly B.','You paused to observe. Now keep that recipe and change only the grind by one step for cup B.'),observe:tx('Đặt hai công thức cạnh nhau. Bạn nhận ra thông số nào vừa thay đổi?','Put the two recipes side by side. Which setting changed?'),complete:tx('Ca đầu tiên xong rồi! Bạn đã tự dừng, thử riêng một biến và đọc lại hai công thức.','Your first shift is complete! You paused, tried one change and read the two recipes back.')}[phase];
 let body='';
 if(phase==='welcome')body=`<p>${tx('Khoảng 3 phút · có sẵn công thức 12 g / 180 ml nước · không đua thời gian.','About 3 minutes · preset 12 g / 180 ml water · no race against time.')}</p><button type="button" id="shift-start" ${writable?'':'disabled'}>${tx('Chơi ca đầu tiên','Play your first shift')}</button>`;
 if(phase==='a')body=`<h4>${tx('1. Dừng & quan sát','1. Pause & observe')}</h4><p>${tx('Mục tiêu: lưu mẻ dùng 180 ml nước có ít nhất một lần tự dừng rót giữa nhịp. Tự dừng ở mốc nhịp không tính.','Goal: save a brew using 180 ml water with at least one deliberate mid-stage pause. Automatic stage stops do not count.')}</p>${progress.reason?`<p class="shift-hint" role="status">${progress.reason==='need-volume'?tx('Ly vừa lưu chưa đúng mục tiêu 180 ml. Thử lại với công thức của ca nhé.','The saved cup does not match the 180 ml goal. Retry with this shift’s recipe.'):progress.reason==='need-pause'?tx('Ly vừa lưu chưa có lần tự dừng giữa nhịp. Nhả nút khi đang rót, rồi rót tiếp để hoàn thành.','The saved cup has no deliberate mid-stage pause. Release while pouring, then continue to finish.'):tx('Ly A đã bị xóa. Pha lại một ly A để tiếp tục ca này; các ký ức khác vẫn giữ nguyên.','Cup A was deleted. Brew another A to continue this shift; other memories are preserved.')}</p>`:''}<button type="button" id="shift-brew-a">${tx('Pha ly A · 180 ml nước','Brew A · 180 ml water')}</button>`;
 if(phase==='b')body=`<h4>${tx('2. Đổi một nấc','2. Change one step')}</h4><p>${tx('Ly A đã lưu','Saved A')}: ${progress.a.pour.water} ml · ${pauseText(progress.a.practice.pauses)}. ${tx('Cỡ xay A','Grind A')}: ${progress.a.recipe.grind}.</p><button type="button" id="shift-brew-b">${tx('Pha ly B · một nấc xay mới','Brew B · one grind step')}</button>`;
 if(phase==='observe')body=`<h4>${tx('3. Đọc lại điều đã đổi','3. Read the change')}</h4><div class="shift-pair"><div><strong>A</strong><span>${tx('Cỡ xay','Grind')}: ${progress.a.recipe.grind}</span><span>${tx('Nước','Water')}: ${progress.a.pour.water} ml</span><span>${progress.a.recipe.temp} °C · 1:${progress.a.recipe.ratio}</span></div><div><strong>B</strong><span>${tx('Cỡ xay','Grind')}: ${progress.b.recipe.grind}</span><span>${tx('Nước','Water')}: ${progress.b.pour.water} ml</span><span>${progress.b.recipe.temp} °C · 1:${progress.b.recipe.ratio}</span></div></div><p>${tx('Thông số nào thay đổi giữa A và B?','Which setting changed between A and B?')}</p><div class="shift-answers">${['grind','temp','ratio','time'].map((field,i)=>`<button type="button" class="secondary" data-shift-answer="${field}">${[tx('Cỡ xay','Grind'),tx('Nhiệt độ','Temperature'),tx('Tỷ lệ','Ratio'),tx('Thời gian công thức','Recipe time')][i]}</button>`).join('')}</div>${session.answer?.bId===progress.b.id&&!pending?`<p class="shift-hint" role="status">${tx('Nhìn lại hai con số cỡ xay. Đây là đọc công thức game, không đoán hương vị thật.','Look at the two grind values. This is reading the game recipes, not guessing real flavor.')}</p>`:''}`;
 if(phase==='complete')body=`<div class="shift-keepsake"><span aria-hidden="true">✦</span><h4>${tx('Khoảnh khắc: Dừng để khám phá','Moment: Pause to discover')}</h4><p>180 ml ${tx('nước','water')} · ${tx('Cỡ xay','Grind')} A ${progress.a.recipe.grind} → B ${progress.b.recipe.grind} · ${pauseText(progress.a.practice.pauses)}</p><p>${tx('Thẻ kỷ niệm thao tác trong game, không phải chứng nhận kỹ năng hay chất lượng cà phê.','A keepsake of your game practice, not a brewing qualification or coffee quality certificate.')}</p></div><div class="actions"><button type="button" id="shift-view-pair">${tx('Xem lại hai ly','Revisit the two cups')}</button><button type="button" id="shift-real-brew" class="secondary">${tx('Thử ghi một lượt pha thật','Try logging a real brew')}</button><button type="button" id="shift-restart" class="secondary">${tx('Chơi ca mới · giữ ký ức','New shift · keep memories')}</button></div><details class="shift-feedback"><summary>${tx('Ca này có thú vị không? · tùy chọn','Was this shift enjoyable? · optional')}</summary><form id="shift-feedback"><p class="help">${tx('Chỉ lưu trên trình duyệt, không tự gửi đi. Cảm nhận này không phải dữ liệu đo retention.','Saved only in this browser, never sent automatically. This feedback is not a retention measurement.')}</p><label>${tx('Mức thú vị · 1 thấp, 5 cao','Enjoyment · 1 low, 5 high')}<select name="fun"><option value="">${tx('Chưa đánh giá','Not rated')}</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${feedback.fun===n?'selected':''}>${n}</option>`).join('')}</select></label><label>${tx('Bạn có muốn quay lại chơi?','Would you like to return?')}<select name="returnIntent"><option value="">${tx('Chưa trả lời','Not answered')}</option>${['yes','maybe','no'].map((v,i)=>`<option value="${v}" ${feedback.returnIntent===v?'selected':''}>${[tx('Có','Yes'),tx('Có thể','Maybe'),tx('Chưa muốn','Not yet')][i]}</option>`).join('')}</select></label><label>${tx('Điều vui / điều vướng nhất','Most enjoyable / most awkward moment')}<textarea name="note" rows="2" maxlength="1000">${escape(feedback.note)}</textarea></label><button type="submit">${tx('Lưu cảm nhận về ca','Save shift feedback')}</button></form></details>`;
 return `<section class="first-shift" aria-labelledby="shift-title"><div class="shift-story"><div class="shift-portrait">${portrait}</div><div><span class="eyebrow">${tx('MAI · KHÁCH QUEN','MAI · YOUR REGULAR')}</span><h3 id="shift-title" tabindex="-1">${tx('Ca đầu tiên','Your first shift')}</h3><p>${speech}</p></div></div>${phase!=='welcome'?`<ol class="shift-path" aria-label="${tx('Tiến độ ca','Shift progress')}">${[tx('Dừng','Pause'),tx('Thử','Try'),tx('Nhận ra','Notice')].map((name,i)=>`<li ${i<progress.completed?'data-complete="true"':''}>${i<progress.completed?'✓ ':''}${i+1}. ${name}</li>`).join('')}</ol>`:''}${body}<p id="shift-notice" role="status">${escape(notice)}</p>${!writable?`<p class="warning">${tx('Tiến độ ca chưa đọc được; không ghi đè. Bạn vẫn pha tự do được.','Shift progress cannot be read and will not be overwritten. Free brewing still works.')}</p>${raw!==undefined?`<button type="button" id="shift-recovery" class="secondary">${tx('Tải tiến độ gốc','Download original progress')}</button>`:''}`:''}${pending?`<button type="button" id="shift-save-retry">${tx('Thử lưu tiến độ ca lại','Retry shift save')}</button>`:''}${session||pending?`<button type="button" id="shift-export" class="shift-export secondary">${tx('Xuất ca & các lần thử JSON','Export shift & its attempts JSON')}</button>`:''}</section>`;
}

function mountFirstPour(initialLanguage='vi'){
 const root=document.createElement('section');root.id='first-pour';root.className='first-pour-wrap';root.hidden=true;document.querySelector('#cafe').after(root);
 let dailyPracticeTitle='';
 let collected=0,experiment=null,experimentField='grind',search='',manualPauses=0,flowStartWater=0,activeShiftRole=null;
 let shiftLoaded;try{shiftLoaded=loadFirstShift(localStorage.getItem(firstShiftKey));}catch{shiftLoaded={session:null,writable:false};}
 let shiftSession=shiftLoaded.session,shiftFeedback=structuredClone(shiftSession?.feedback||emptyShiftFeedback()),shiftNotice='',pendingShift=null;
 let lang=initialLanguage,recipe={bean:'ethiopia',...firstPourBeans[0].target},state=null,screen='setup',held=false,toggled=false,frame=0,last=null,draft=null,saved=false,notice='',deleteId=null,compareA=null,compareB=null;
 let store;try{store=loadFirstMemories(localStorage.getItem(firstPourKey));}catch{store={records:[],writable:false};}
 let records=store.records;
 const tx=(vi,en)=>lang==='vi'?vi:en;
 const escape=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const label=key=>({dose:tx('Cà phê (g)','Coffee (g)'),ratio:tx('Tỷ lệ nước / cà phê','Water / coffee ratio'),grind:tx('Cỡ xay · thang trò chơi','Grind · game scale'),temp:tx('Nước (°C)','Water (°C)'),time:tx('Thời gian công thức (giây)','Recipe time (seconds)'),bean:tx('Hạt','Bean'),aroma:tx('Hương thơm','Aroma'),acidity:tx('Độ chua','Acidity'),sweetness:tx('Độ ngọt','Sweetness'),bitterness:tx('Độ đắng','Bitterness'),body:tx('Thể chất','Body'),aftertaste:tx('Hậu vị','Aftertaste')}[key]);
 const stages=()=>[tx('Ủ nở · bloom','Bloom'),tx('Rót chính','Main pour'),tx('Rót cuối','Final pour')];
 const clock=n=>`${String(Math.floor(n/60)).padStart(2,'0')}:${String(Math.floor(n%60)).padStart(2,'0')}`;
 const scoreText=result=>result.score===null?tx('Chưa có mốc điểm','No game benchmark'):`${result.score}/100`;
 const beanName=id=>firstPourBeans.find(b=>b.id===id)?.name||id;
 const emptyFeedback=()=>({context:'reflection',notes:'',nextChange:'',enjoyment:null,axes:Object.fromEntries(firstPourAxes.map(k=>[k,null]))});
 function download(value,name,raw=false){const url=URL.createObjectURL(new Blob([raw?value:JSON.stringify(value,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download=name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function stop(){held=false;toggled=false;}
 function capture(){
  captureShiftFeedback();const form=root.querySelector('#fp-recipe');
  if(form)recipe={bean:form.elements.bean.value,...Object.fromEntries(Object.keys(firstPourLimits).map(k=>[k,Number(form.elements[k].value)]))};
  const feedback=root.querySelector('#fp-feedback');
  if(feedback&&draft)draft={...draft,feedback:{context:feedback.elements.context.value,notes:feedback.elements.notes.value,nextChange:feedback.elements.nextChange.value,enjoyment:feedback.elements.enjoyment.value?Number(feedback.elements.enjoyment.value):null,axes:Object.fromEntries(firstPourAxes.map(k=>[k,feedback.elements[k].value?Number(feedback.elements[k].value):null]))}};
 }

 function persist(next){if(!store.writable){notice=tx('Dữ liệu cũ chưa đọc được. Hãy tải bản gốc để phục hồi; không ghi đè.','Existing data could not be read. Download the original for recovery; it will not be overwritten.');return false;}try{localStorage.setItem(firstPourKey,JSON.stringify({version:1,records:next}));records=next;notice=tx('Đã lưu trên trình duyệt này.','Saved in this browser.');return true;}catch{notice=tx('Chưa lưu được. Hãy thử lại hoặc tải bản nháp; tiến độ cũ vẫn giữ nguyên.','Could not save. Retry or download the draft; previous records are preserved.');return false;}}
 function configure(){return `${dailyPracticeTitle?`<p class="daily-practice-note">${tx('Từ sổ quán','From the café notebook')}: <strong>${escape(dailyPracticeTitle)}</strong> · ${tx('Công thức minh họa, không dự đoán vị thật.','Illustrative recipe, not a real flavor prediction.')}</p>`:''}${experimentSetup()}<form id="fp-recipe" class="${experiment?'fp-guided-recipe':''}"><label ${experiment?'hidden':''}>${label('bean')}<select name="bean" ${experiment?'disabled':''}>${firstPourBeans.map(b=>`<option value="${b.id}" ${b.id===recipe.bean?'selected':''}>${b.name}</option>`).join('')}</select></label><p class="help" ${experiment?'hidden':''}>${tx('Các lô hạt minh họa, không đại diện mọi cà phê cùng xuất xứ hoặc sơ chế.','Illustrative lots, not representative of all coffee with the same origin or process.')}</p><div class="fields">${Object.entries(firstPourLimits).map(([key,[min,max]])=>`<label ${experiment&&key!==experimentField?'hidden':''}>${label(key)}<input name="${key}" type="number" inputmode="decimal" required ${experiment&&key!==experimentField?'disabled':''} min="${min}" max="${max}" step="${['dose','ratio'].includes(key)?'.1':'1'}" value="${recipe[key]}"></label>`).join('')}</div><p id="fp-target">${tx('Nước mục tiêu','Target water')}: ${validFirstRecipe(recipe)?firstPourPlan(recipe)[2]:'—'} ml · 1:${recipe.ratio}</p><p class="help">${tx('Thời gian ở trên là đầu vào công thức trong mô hình; thời gian bạn chơi được ghi riêng và không phải thời gian pha ngoài đời.','Recipe time above is a model input; your play time is recorded separately and is not real brewing time.')}</p><div class="actions"><button type="submit" id="fp-start">${experiment?tx('Pha ly B · một biến mới','Brew B · one change'):tx('Bắt đầu ba nhịp rót','Start three-stage pour')}</button><button type="button" id="fp-preset" class="secondary" ${experiment?'disabled hidden':''}>${tx('Dùng công thức khởi hành','Use a starting recipe')}</button></div></form>`;}
 function stageTip(){return [tx('Làm ướt đều bột cà phê. Thả nút bất cứ lúc nào để quan sát.','Wet the grounds evenly. Release at any time to observe.'),tx('Rót nhẹ và đều. Game sẽ tự dừng khi đủ nước cho nhịp này.','Pour gently and evenly. The game stops at this stage’s target.'),tx('Hoàn thành lượng nước còn lại, rồi chờ giọt cà phê cuối.','Finish the remaining water, then watch the last coffee drops.')][state.stage];}
 function stageStatus(){return state.done?tx('Đủ nước · đang chờ giọt cuối…','Water complete · waiting for the last drops…'):state.ready?tx('Đã đủ nhịp này · bấm “Sang nhịp” khi sẵn sàng.','Stage complete · continue when you are ready.'):tx('Giữ nút để rót, hoặc bật rót tự động.','Hold to pour, or switch on automatic pouring.');}
 function nextLabel(){return state.done?tx('Đang chờ giọt cuối','Waiting for final drops'):state.stage===2?tx('Nhịp cuối','Final stage'):tx('Sang nhịp ','Continue to stage ')+(state.stage+2);}
 function pour(){const plan=state.plan;return `<div class="fp-workspace" id="fp-workspace" tabindex="-1" aria-label="${tx('Bàn rót ba nhịp','Three-stage pouring station')}"><ol class="fp-stages">${stages().map((name,i)=>`<li ${i===state.stage?'aria-current="step"':''}>${i+1}. ${name}<small>${plan[i]-(plan[i-1]||0)} ml</small></li>`).join('')}</ol><div class="fp-stage-info"><h3 id="fp-stage-title">${stages()[state.stage]}</h3><p id="fp-stage-tip">${stageTip()}</p></div><div class="fp-visual"><div class="fp-clock"><span>${tx('Thao tác','Active')}: <b id="fp-clock">${clock(state.seconds)}</b></span><span>${tx('Đã rót','Poured')}: <b id="fp-water">${Math.round(state.water)}</b> / ${plan[2]} ml</span><span>${tx('Tự dừng','Pauses')}: <b id="fp-pauses">${manualPauses}</b></span></div><div class="fp-station" aria-hidden="true"><div class="fp-shelf"></div><div class="brew-apparatus">${brewEquipment('first')}</div><div class="fp-table"></div></div><progress id="fp-progress" max="${plan[2]}" value="${state.water}" aria-label="${tx('Tổng lượng nước đã rót','Total water poured')}"></progress></div><div class="fp-controls"><p id="fp-stage-status" role="status" tabindex="-1">${stageStatus()}</p><button type="button" class="hold-pour" id="fp-hold" ${state.ready?'disabled':''}>${tx('Nhấn giữ để rót','Hold to pour')}</button><div class="fp-control-row"><button type="button" class="secondary" id="fp-toggle" aria-pressed="false" ${state.ready?'disabled':''}>${tx('Rót tự động','Auto pour')}</button><button type="button" id="fp-next" ${!state.ready||state.done?'disabled':''}>${nextLabel()}</button></div></div></div><details class="fp-howto"><summary>${tx('Cách chơi & giới hạn mô phỏng','Controls & simulation limits')}</summary><p class="help">${tx('Giữ Space/Enter trên nút rót, hoặc dùng “Rót tự động” để không cần nhấn giữ. Mỗi nhịp tự dừng ở mốc nước. Trong pha thật, bloom giúp khí thoát ra; thời gian cần tùy cà phê. Nhịp rót và đoạn chờ trong game được rút ngắn, không mô phỏng chiết xuất hay thời gian pha thật.','Hold Space/Enter on the pour button, or use Auto pour for hold-free control. Each stage stops at its water target. In real brewing, blooming lets gas escape; timing depends on the coffee. Game pouring and waiting are shortened and do not simulate extraction or real brewing time.')}</p></details><button id="fp-reset" type="button" class="secondary">${tx('Pha lại từ đầu','Restart this cup')}</button>`;}

 function selectRating(name,value,title){return `<label>${title}<select name="${name}"><option value="">${tx('Chưa đánh giá','Not rated')}</option>${[1,2,3,4,5].map(n=>`<option value="${n}" ${value===n?'selected':''}>${n}</option>`).join('')}</select></label>`;}
 function outcome(){const score=draft.result,feedback=draft.feedback;return `<h3 tabindex="-1" id="fp-result-title">${tx('Ba nhịp rót đã hoàn thành','Three stages complete')} ☕</h3><p class="practice-receipt">${tx('Lần tự dừng giữa nhịp','Deliberate mid-stage pauses')}: <strong>${draft.practice?.pauses??'—'}</strong>. ${tx('Tách riêng với điểm công thức và hương vị.','Separate from recipe score and flavor.')}</p>${experimentOutcome()}<p>${draft.pour.water} ml · ${tx('Thời gian thao tác','Active play time')} ${clock(draft.pour.playSeconds)}</p><div class="fp-score"><strong>${score.score===null?'—':`${score.score}/100`}</strong><span>${score.score===null?tx('Lô khám phá · chưa có mốc điểm','Discovery lot · no game benchmark'):tx('Mức khớp mốc công thức trong game','Match to the game recipe preset')}</span></div><p>${score.score===null?tx('Lô này chưa có mốc chấm điểm. Hãy lưu công thức và cảm nhận của bạn; game không suy ra hương vị từ tên hạt.','This lot has no game benchmark. Save your recipe and impressions; the bean name does not predict flavor.'):score.matched?tx('Bạn khớp mốc minh họa của lô này. Thử đổi một biến rồi so sánh hai ký ức.','You matched this lot’s game preset. Try changing one variable and compare the memories.'):tx('Biến lệch nhiều nhất theo trọng số game: ','Largest weighted difference in the game: ')+label(score.largest)+'. '+tx('Thử đổi riêng biến này, giữ các biến còn lại.','Try changing only this variable and keeping the others fixed.')}</p><p class="help">${tx('Điểm chỉ so công thức với mốc được thiết kế cho trò chơi; nhịp chạm không đổi điểm. Không phải TDS, hiệu suất chiết xuất hay điểm hương vị thật.','The score only compares the recipe to a designed game preset; tap rhythm does not change it. It is not TDS, extraction yield, or real taste quality.')} ${escape(score.modelVersion)}</p><form id="fp-feedback"><h4>${tx('Coffee Memory · cảm nhận của bạn','Coffee Memory · your experience')}</h4><label>${tx('Ngữ cảnh của ghi chú','Context for your notes')}<select name="context"><option value="reflection" ${feedback.context==='reflection'?'selected':''}>${tx('Suy ngẫm / tưởng tượng khi chơi','Reflection / imagination while playing')}</option><option value="self-reported-real-tasting" ${feedback.context==='self-reported-real-tasting'?'selected':''}>${tx('Tôi tự báo đã nếm một ly thật riêng','I report tasting a separate real cup')}</option></select></label><p class="help">${tx('Tất cả thang cảm quan dưới đây do bạn nhập, không do mô hình dự đoán. Tự báo nếm thật không xác minh công thức hay phép đo. Dùng “Ghi lượt pha thật” cho hồ sơ thực nghiệm.','Every sensory rating below is your own input, not a model prediction. A self-reported real tasting does not verify a recipe or measurement. Use “Record a real brew” for experimental records.')}</p><details><summary>${tx('Sáu thuộc tính cảm quan · tùy chọn','Six sensory attributes · optional')}</summary><p class="help">${tx('Cường độ 1–5: 1 rất thấp, 5 rất cao; cao hơn không có nghĩa ngon hơn.','Intensity 1–5: 1 very low, 5 very high; higher does not mean better.')}</p><div class="fields">${firstPourAxes.map(k=>selectRating(k,feedback.axes[k],label(k))).join('')}</div></details><details class="fp-sensory-map"><summary>${tx('Xem bản đồ cảm nhận','View sensory map')}</summary><div id="fp-radar">${firstSensoryRadar(lang,[{label:tx('Ly này','This cup'),feedback}])}</div></details>${selectRating('enjoyment',feedback.enjoyment,tx('Mức yêu thích cá nhân · 1–5 (tùy chọn)','Personal enjoyment · 1–5 (optional)'))}<label>${tx('Ghi chú / khoảnh khắc của bạn','Your notes / moment')}<textarea name="notes" rows="3" maxlength="1000">${escape(feedback.notes)}</textarea></label><label>${tx('Lần sau tôi muốn đổi điều gì?','What would I change next time?')}<textarea name="nextChange" rows="2" maxlength="1000">${escape(feedback.nextChange)}</textarea></label><div class="actions"><button type="submit" id="fp-save">${saved?tx('Cập nhật ký ức này','Update this memory'):tx('Lưu Coffee Memory','Save Coffee Memory')}</button><button type="button" class="secondary" id="fp-draft-export">${tx('Tải bản nháp JSON','Download draft JSON')}</button><button type="button" class="secondary" id="fp-retry">${tx('Chỉnh một biến & thử lại','Change one variable & retry')}</button></div></form>`;}
 function memory(){return `<details class="fp-memory" ${records.length?'open':''}><summary>Coffee Memory · ${records.length} ${tx('lần pha ba nhịp','three-stage brews')}</summary><p class="help">${tx('Lưu riêng trong trình duyệt này, không có tài khoản hay đồng bộ. Xóa dữ liệu trình duyệt, đổi thiết bị hoặc dùng chế độ riêng tư có thể làm mất ký ức. Xuất JSON để giữ bản sao. Nhật ký cũ và lượt pha thật vẫn ở mục riêng.','Stored only in this browser, without accounts or sync. Clearing browser data, changing devices, or private browsing may lose memories. Export JSON for backup. Older journals and real brews remain in their own sections.')}</p><button type="button" id="fp-export" class="secondary">${tx('Xuất Coffee Memory JSON','Export Coffee Memory JSON')}</button>${!store.writable?`<p class="warning">${tx('Dữ liệu chưa đọc được; ghi/xóa bị khóa để bảo vệ bản gốc.','Data could not be read; saving/deleting is locked to protect the original.')}</p>${store.raw!==undefined?`<button type="button" id="fp-recovery">${tx('Tải dữ liệu gốc','Download original data')}</button>`:''}`:''}${records.length>1?`<details class="fp-compare"><summary>${tx('So sánh hai ký ức & bản đồ cảm nhận','Compare two memories & sensory maps')}</summary><div class="fields">${['a','b'].map((key,i)=>`<label>${tx('Lần pha','Brew')} ${key.toUpperCase()}<select id="fp-compare-${key}">${records.map((r,index)=>`<option value="${escape(r.id)}" ${r.id===(i?compareB:compareA)?'selected':''}>#${index+1} · ${beanName(r.recipe.bean)}</option>`).join('')}</select></label>`).join('')}</div><div id="fp-comparison"></div></details>`:''}<label class="fp-search">${tx('Tìm ký ức theo hạt hoặc ghi chú','Find memories by bean or notes')}<input id="fp-search" type="search" value="${escape(search)}" placeholder="${tx('Ví dụ: Ethiopia, hương hoa…','For example: Ethiopia, floral…')}"/></label><p id="fp-search-count" class="help" role="status"></p><div class="fp-history">${records.length?records.slice().reverse().map(r=>`<article data-memory-id="${escape(r.id)}"><strong>${beanName(r.recipe.bean)} · ${scoreText(r.result)} ${tx('(game)','(game)')}</strong><small>${escape(new Date(r.date).toLocaleString(lang==='vi'?'vi-VN':'en-GB'))}</small><p>${Object.keys(firstPourLimits).map(k=>`${label(k)}: ${r.recipe[k]}`).join(' · ')}</p><p>${tx('Ghi chú','Notes')}: ${escape(r.feedback.notes||'—')}</p><p>${tx('Lần sau','Next time')}: ${escape(r.feedback.nextChange||'—')}</p><p class="help">${r.feedback.context==='reflection'?tx('Suy ngẫm trong game','Game reflection'):tx('Tự báo nếm một ly thật riêng · chưa xác minh','Self-reported separate real tasting · unverified')} · ${tx('Yêu thích','Enjoyment')}: ${r.feedback.enjoyment??'—'}/5</p><p class="help">${firstPourAxes.map(k=>`${label(k)}: ${r.feedback.axes[k]??'—'}`).join(' · ')}</p><div class="actions memory-brew-actions"><button type="button" class="secondary" data-rebrew="${escape(r.id)}">${tx('Pha lại công thức','Brew this recipe')}</button><button type="button" data-experiment="${escape(r.id)}">${tx('Thử đổi một biến','Try one change')}</button></div>${r.baselineId?`<p class="help">${firstExperimentPair(records,r).status==='one-change'?tx('✓ Cặp A/B một biến đã lưu','✓ Saved one-change A/B pair'):firstExperimentPair(records,r).status==='missing-baseline'?tx('Ly A đã bị xóa; giữ ly B và ghi chú của bạn.','Cup A was deleted; cup B and your notes remain.'):tx('Liên kết so sánh: công thức không còn là một biến.','Comparison link: recipes are not a one-change pair.')}</p>`:''}${deleteId===r.id?`<p>${tx('Xóa ký ức này khỏi trình duyệt?','Delete this memory from the browser?')}</p><button type="button" data-confirm-delete="${escape(r.id)}">${tx('Xác nhận xóa','Confirm delete')}</button><button type="button" id="fp-cancel-delete" class="secondary">${tx('Giữ lại','Keep it')}</button>`:`<button type="button" class="secondary" data-delete="${escape(r.id)}" ${store.writable?'':'disabled'}>${tx('Xóa ký ức này','Delete this memory')}</button>`}</article>`).join(''):`<p>${tx('Chưa có ký ức. Hoàn thành ba nhịp rồi lưu ly đầu tiên.','No memories yet. Complete three stages and save your first cup.')}</p>`}</div></details>`;}
 function compare(){const target=root.querySelector('#fp-comparison');if(!target)return;compareA=root.querySelector('#fp-compare-a').value;compareB=root.querySelector('#fp-compare-b').value;const a=records.find(r=>r.id===compareA),b=records.find(r=>r.id===compareB);if(!a||!b||a.id===b.id){target.textContent=tx('Chọn hai ký ức khác nhau.','Choose two different memories.');return;}const changed=compareFirstMemories(a,b);target.innerHTML=`<p>${tx('Biến đã đổi','Changed variables')}: ${changed.length?changed.map(label).join(', '):tx('không có','none')}. ${changed.length>1?tx('Nhiều biến cùng đổi: không thể quy khác biệt cho một biến riêng.','Multiple variables changed: the difference cannot be attributed to one variable.'):tx('So sánh này để quan sát, không chứng minh quan hệ nhân quả ngoài đời.','This comparison supports observation, not proof of real-world causation.')}</p><div class="fp-table-scroll"><table><caption>${tx('Công thức và cảm nhận · A / B','Recipe and experience · A / B')}</caption><thead><tr><th>${tx('Thuộc tính','Attribute')}</th><th>A</th><th>B</th></tr></thead><tbody>${['bean',...Object.keys(firstPourLimits),'score',...firstPourAxes,'enjoyment','notes','nextChange','context'].map(k=>`<tr><th scope="row">${label(k)||({score:tx('Điểm game','Game score'),enjoyment:tx('Yêu thích · 1–5','Enjoyment · 1–5'),notes:tx('Ghi chú','Notes'),nextChange:tx('Lần sau','Next time'),context:tx('Ngữ cảnh','Context')}[k])}</th>${[a,b].map(r=>{let value=k==='bean'?beanName(r.recipe.bean):k==='score'?r.result.score:firstPourAxes.includes(k)?r.feedback.axes[k]:k==='context'?(r.feedback.context==='reflection'?tx('Suy ngẫm game','Game reflection'):tx('Tự báo nếm thật · chưa xác minh','Self-reported real tasting · unverified')):r.recipe[k]??r.feedback[k];return `<td>${escape(value??'—')}</td>`;}).join('')}</tr>`).join('')}</tbody></table></div>${firstSensoryRadar(lang,[{label:'A',feedback:a.feedback},{label:'B',feedback:b.feedback}])}`;}
 function experimentSetup(){
  if(!experiment)return `<aside class="fp-discovery-intro"><strong>${tx('Khám phá tiếp theo','Your next discovery')}</strong><p>${records.length?tx('Chọn “Thử đổi một biến” từ một ký ức để pha ly B và đối chiếu với ly A.','Choose “Try one change” on a memory to brew cup B against cup A.'):tx('Lưu ly đầu tiên làm mốc A. Sau đó đổi một biến, pha ly B và so sánh điều bạn nhận ra.','Save your first cup as baseline A. Then change one variable, brew B and compare what you notice.')}</p>${records.length?`<button type="button" id="fp-continue-last">${tx('Thử một biến từ ly đã lưu gần nhất','Try one change from your last saved cup')}</button>`:''}</aside>`;
  return `<aside class="fp-experiment"><h3>${tx('Ly B · chỉ đổi một biến','Cup B · change one variable')}</h3><p>${tx('Mốc A','Baseline A')}: ${beanName(experiment.recipe.bean)} · ${scoreText(experiment.result)} ${tx('(game)','(game)')}</p><label>${tx('Biến tôi muốn thử','Variable to explore')}<select id="fp-experiment-field" ${activeShiftRole==='b'?'disabled':''}>${firstExperimentFields.map(k=>`<option value="${k}" ${k===experimentField?'selected':''}>${label(k)}</option>`).join('')}</select></label><p>${tx('Các ô khác giữ nguyên để dễ đối chiếu. Giá trị mốc','Other fields stay fixed for comparison. Baseline value')}: <strong>${experiment.recipe[experimentField]}</strong>.</p><details class="fp-fixed-recipe"><summary>${tx('Xem thông số giữ nguyên','View fixed recipe settings')}</summary><dl>${['bean',...Object.keys(firstPourLimits)].filter(k=>k!==experimentField).map(k=>`<div><dt>${label(k)}</dt><dd>${k==='bean'?beanName(experiment.recipe.bean):experiment.recipe[k]}</dd></div>`).join('')}</dl></details><button type="button" id="fp-cancel-experiment" class="secondary">${tx('Về pha tự do','Return to free brewing')}</button></aside>`;
 }
 function experimentOutcome(){
  if(!draft?.baselineId)return '';
  const pair=firstExperimentPair(records,draft);
  if(pair.status==='missing-baseline')return `<aside class="fp-experiment"><p>${tx('Ly A đã bị xóa. Bạn vẫn có thể lưu ly B; không còn đủ hai ly để đối chiếu.','Cup A was deleted. You can still save B, but the pair is no longer available for comparison.')}</p></aside>`;
  const a=pair.baseline;
  return `<aside class="fp-experiment"><h4>${tx('Bạn vừa thử một thay đổi','You tried one change')}</h4><p>${pair.changed.map(k=>`${label(k)}: ${a.recipe[k]} → ${draft.recipe[k]}`).join(' · ')}</p><p>${tx('Điểm công thức trong game','Game recipe score')}: A ${a.result.score??'—'} → B ${draft.result.score??'—'}. ${tx('Đây là phản hồi quy tắc game; không kết luận ly nào ngon hơn ngoài đời.','This reflects the game rules, not which real cup tastes better.')}</p><p>${tx('Ghi điều bạn nhận ra và dự định thử tiếp. Lưu ly B để mở so sánh A/B ngay bên dưới.','Record what you noticed and what to try next. Save B to open its A/B comparison below.')}</p>${saved?`<button type="button" id="fp-view-pair" class="secondary">${tx('Xem cặp A/B đã lưu','View saved A/B pair')}</button>`:''}</aside>`;
 }
 function fromMemory(id,asExperiment,shiftRole=null){
  const source=records.find(r=>r.id===id);if(!source)return;
  stop();cancelAnimationFrame(frame);activeShiftRole=shiftRole;dailyPracticeTitle='';experiment=asExperiment?structuredClone(source):null;experimentField='grind';recipe={...source.recipe};if(shiftRole==='b')recipe.grind=source.recipe.grind<40?source.recipe.grind+1:source.recipe.grind-1;state=null;screen='setup';collected=0;draft=null;saved=false;notice='';
  root.querySelector('#fp-game')?.replaceChildren();render();focus(asExperiment?'#fp-experiment-field':'#fp-start');
 }
 function filterMemory(){let count=0;root.querySelectorAll('[data-memory-id]').forEach(el=>{const entry=records.find(r=>r.id===el.dataset.memoryId);el.hidden=!firstMemoryMatches(entry,search);if(!el.hidden)count++;});root.querySelector('#fp-search-count').textContent=`${count} / ${records.length} `+tx('ký ức phù hợp','matching memories');}
 function bindDiscovery(){
  root.querySelector('#fp-continue-last')?.addEventListener('click',()=>fromMemory(records.at(-1).id,true));

  root.querySelector('#fp-cancel-experiment')?.addEventListener('click',()=>{capture();experiment=null;activeShiftRole=null;root.querySelector('#fp-recipe')?.remove();render();});
  root.querySelector('#fp-view-pair')?.addEventListener('click',()=>{compareA=draft.baselineId;compareB=draft.id;compare();root.querySelector('.fp-memory').open=true;root.querySelector('.fp-compare').open=true;root.querySelector('.fp-compare').scrollIntoView({behavior:'smooth',block:'start'});});
 }

 function captureShiftFeedback(){const form=root.querySelector('#shift-feedback');if(form)shiftFeedback={fun:form.elements.fun.value?Number(form.elements.fun.value):null,returnIntent:form.elements.returnIntent.value||null,note:form.elements.note.value};}
 function shiftMarkup(){return firstShiftPanel({language:lang,session:shiftSession,records,writable:shiftLoaded.writable,raw:shiftLoaded.raw,notice:shiftNotice,pending:Boolean(pendingShift),feedback:shiftFeedback});}
 function writeShift(next){
  if(!shiftLoaded.writable){shiftNotice=tx('Không ghi đè tiến độ ca chưa đọc được.','Unreadable shift progress will not be overwritten.');return false;}
  try{localStorage.setItem(firstShiftKey,JSON.stringify(next));shiftSession=next;pendingShift=null;shiftNotice=tx('Đã lưu ca trên trình duyệt này.','Shift saved in this browser.');return true;}catch{pendingShift=next;shiftNotice=tx('Chưa lưu được tiến độ ca. Ký ức đã lưu vẫn giữ nguyên; thử lưu lại hoặc xuất ca.','Shift progress could not be saved. Saved memories remain intact; retry or export the shift.');return false;}
 }
 function startShiftA(){
  stop();cancelAnimationFrame(frame);activeShiftRole='a';dailyPracticeTitle='';experiment=null;draft=null;screen='setup';state=null;recipe={bean:'brazil',...firstPourBeans.find(b=>b.id==='brazil').target,dose:12,ratio:15};
  root.querySelector('#fp-game')?.replaceChildren();render();root.querySelector('#fp-recipe').requestSubmit();

 function bindShift(){
  const start=()=>{captureShiftFeedback();const next=createFirstShift(crypto.randomUUID());if(writeShift(next)){shiftFeedback=emptyShiftFeedback();root.querySelector('#shift-panel')?.replaceChildren();startShiftA();}else render();};
  root.querySelector('#shift-start')?.addEventListener('click',start);root.querySelector('#shift-restart')?.addEventListener('click',start);
  root.querySelector('#shift-brew-a')?.addEventListener('click',startShiftA);
  root.querySelector('#shift-brew-b')?.addEventListener('click',()=>{const goal=firstShiftProgress(shiftSession,records);if(goal.a)fromMemory(goal.a.id,true,'b');});
  root.querySelectorAll('[data-shift-answer]').forEach(button=>button.onclick=()=>{captureShiftFeedback();const committed=writeShift(answerFirstShift(shiftSession,records,button.dataset.shiftAnswer));render();if(committed&&firstShiftProgress(shiftSession,records).phase==='complete')focus('#shift-title');else root.querySelector('#shift-title')?.focus({preventScroll:true});});
  root.querySelector('#shift-view-pair')?.addEventListener('click',()=>{const goal=firstShiftProgress(shiftSession,records);if(!goal.a||!goal.b)return;compareA=goal.a.id;compareB=goal.b.id;compare();root.querySelector('.fp-memory').open=true;root.querySelector('.fp-compare').open=true;root.querySelector('.fp-compare').scrollIntoView({behavior:'smooth',block:'start'});});
  root.querySelector('#shift-real-brew')?.addEventListener('click',()=>document.querySelector('#open-real-brew').click());
  root.querySelector('#shift-feedback')?.addEventListener('submit',e=>{e.preventDefault();captureShiftFeedback();writeShift({...shiftSession,feedback:{...shiftFeedback}});render();const details=root.querySelector('.shift-feedback');if(details)details.open=true;});
  root.querySelector('#shift-save-retry')?.addEventListener('click',()=>{const next=pendingShift;if(next)writeShift(next);render();});
  root.querySelector('#shift-recovery')?.addEventListener('click',()=>download(shiftLoaded.raw,'c6s-shift-recovery.json',true));
  root.querySelector('#shift-export')?.addEventListener('click',()=>{captureShiftFeedback();const session=pendingShift||shiftSession,goal=firstShiftProgress(session,records);download({kind:'first-shift-game-progress',version:1,session,pendingProgress:Boolean(pendingShift),unsavedFeedback:shiftFeedback,proof:{aId:goal.a?.id??null,bId:goal.b?.id??null},cups:records.filter(r=>r.shift?.id===session.id)},'c6s-first-shift.json');});
 }

 function focus(selector){root.querySelector(selector)?.focus({preventScroll:true});root.querySelector(selector)?.scrollIntoView({behavior:'smooth',block:'start'});}
 function render(){capture();if(records.length>1){if(!records.some(r=>r.id===compareA))compareA=records.at(-2).id;if(!records.some(r=>r.id===compareB))compareB=records.at(-1).id;}
 root.innerHTML=`<div class="panel fp-panel"><div class="section-head"><span class="eyebrow">v0.7.0 · YOUR FIRST SHIFT</span><button type="button" id="fp-back" class="secondary">${tx('Về quầy','Back to counter')}</button></div><h2 id="fp-title" tabindex="-1">Discover Your Sixth Taste</h2><p>${tx('Pha một ly. Đổi một biến. Tìm điều bạn muốn thử tiếp.','Brew a cup. Change one variable. Find your next discovery.')}</p><details class="fp-about"><summary>${tx('Giới thiệu & giới hạn','About & limits')}</summary><p class="help">${tx('“Sixth Taste” là ẩn dụ cho khám phá cá nhân, không phải vị cơ bản thứ sáu được khoa học xác lập. Sáu thuộc tính cảm quan là các mô tả riêng.','“Sixth Taste” is a metaphor for personal discovery, not a scientifically established sixth basic taste. The six sensory attributes are separate descriptors.')}</p></details><div id="shift-panel">${shiftMarkup()}</div><div id="fp-game">${screen==='setup'?configure():screen==='pour'?pour():outcome()}</div><p role="status" id="fp-notice">${escape(notice)}</p>${memory()}<footer>From Coffee to Consciousness</footer></div>`;
 root.querySelector('#fp-back').onclick=()=>{stop();cancelAnimationFrame(frame);last=null;root.hidden=true;document.querySelector('#open-first-pour')?.focus();};
 root.querySelector('#fp-export').onclick=()=>download({kind:'first-pour-game-memory',version:1,records},'c6s-first-pour-memory.json');

function counterYieldAnswer(current,baseline){return current.beverage>baseline.beverage?'more':current.beverage<baseline.beverage?'less':'same';}
function counterPair(round,rounds){
 const index=rounds.findIndex(r=>r.id===round.id),base=rounds.slice(0,index<0?rounds.length:index).find(r=>r.id===round.baselineId);
 if(!base||round.bean!==base.bean||round.heat!==base.heat||!Number.isFinite(round.beverage)||!Number.isFinite(base.beverage)||!Number.isFinite(round.holds)||!Number.isFinite(base.holds))return null;
 if(round.holds===base.holds&&Math.abs(round.time-base.time)<6)return null;
 return base;
}
function counterProgress(rounds=[]){
 const proof={};
 for(const r of rounds){
  if(r.lesson==='control'&&r.overflow<=1&&Number.isFinite(r.overflow)&&!proof.control)proof.control=r.id;
  if(proof.control&&r.lesson==='compare'&&!proof.compare){const base=counterPair(r,rounds);if(base&&base.lesson==='compare'&&r.observationAnswer===counterYieldAnswer(r,base))proof.compare=r.id;}
  if(proof.compare&&r.lesson==='service'&&r.fit==='great'&&r.overflow<=1&&!proof.service)proof.service=r.id;
 }
 const completed=counterLessons.filter(l=>proof[l.id]).map(l=>l.id);
 return {completed,proof,next:counterLessons.find(l=>!proof[l.id])?.id||'free',xp:rounds.length*10+completed.length*15+rounds.filter(r=>typeof r.note==='string'&&r.note.trim()).length*5};
}
function validCounterRound(r){
 if(!r||typeof r.id!=='string'||!['brazil','colombia','ethiopia'].includes(r.bean)||!Number.isInteger(r.guest)||r.guest<0||r.guest>2||!Array.isArray(r.flavor)||r.flavor.length!==3||!r.flavor.every(v=>Number.isInteger(v)&&v>=1&&v<=5))return false;
 if(r.kind!==undefined&&r.kind!=='game_simulation')return false;
 if(r.lesson!==undefined&&!['control','compare','service','free'].includes(r.lesson))return false;
 if(r.note!==undefined&&(typeof r.note!=='string'||r.note.length>1000))return false;
 if(r.observationAnswer!==undefined&&!['more','less','same'].includes(r.observationAnswer))return false;
 if(r.baselineId!==undefined&&r.baselineId!==null&&typeof r.baselineId!=='string')return false;
 for(const key of ['time','pourTime','waitTime','overflow','beverage','holds','contact'])if(r[key]!==undefined&&(!Number.isFinite(r[key])||r[key]<0))return false;
 if(r.heat!==undefined&&![88,92,96].includes(r.heat))return false;
 if(r.date!==null&&r.date!==undefined&&!Number.isFinite(Date.parse(r.date)))return false;
 if(r.fit!==undefined&&!['great','close','different'].includes(r.fit))return false;
 if(r.events!==undefined&&(!Array.isArray(r.events)||!r.events.every(e=>e&&['start','pour','pause','finish'].includes(e.type)&&Number.isFinite(e.time)&&e.time>=0&&Number.isFinite(e.volume)&&e.volume>=0)))return false;

}

   if(!rounds.every(validCounterRound)||new Set(rounds.map(r=>r.id)).size!==rounds.length)throw Error();

const realBrewSchema = 1;

 if(input.actualBrewConfirmed!==true)throw Error('realconfirmation');
 const measurements={};
 for(const field of realMeasureFields){
  const item=input.measurements?.[field]||{};

  const source=item.source||'unknown';
  if(!['measured','estimated','unknown','missing'].includes(source)||value!==null&&source==='missing')throw Error('measurement');
  if(value!==null&&(!Number.isFinite(value)||value<realMeasureLimits[field][0]||value>realMeasureLimits[field][1]))throw Error('measurement');

 }
 const text=k=>String(input[k]||'').trim().slice(0,160);

  const seconds=Number(e.seconds),water=Number(e.water);
  if(!Number.isFinite(seconds)||!Number.isFinite(water)||seconds<0||seconds>3600||water<0||water>2000||!['pour','pause','finish'].includes(e.action))throw Error('timeline');

e.'):say('Có đầu vào chưa xác định cách thu; không coi đây là kết quả từ số đo đã xác minh.','Some inputs have unclassified origins; this is not a verified measurement result.')}</p>`}<p>${say('Không chấm ngon/dở, không dự đoán chua/đắng từ hiệu suất hoặc TDS. Không có xác suất hay khoảng tin cậy đã hiệu chuẩn.','No good/bad score or acidity/bitterness prediction is made from yield or TDS. No calibrated probability or confidence interval is available.')}</p><p>${say('Số liệu còn thiếu','Missing measurements')}: ${a.missing.length?a.missing.map(measureLabel).join(' · '):say('không','none')}.</p><button id="real-new">${say('Ghi lượt pha thật mới','Record another real brew')}</button>`;}

const cafeModelVersion = 'counter-assumptions-v3';
// A fictional learning model, not a calibrated extraction or sensory predictor.
const cafeSpeed = 6;
const cafeBeans = [
 {id:'brazil',name:['Lô A · Brazil · rang vừa đậm','Lot A · Brazil · medium-dark roast'],notes:['Chocolate & hạt','Chocolate & nuts'],base:[1,2,3],extractability:1.25},
 {id:'colombia',name:['Lô B · Colombia · rang vừa','Lot B · Colombia · medium roast'],notes:['Caramel & trái cây','Caramel & fruit'],base:[3,2,3],extractability:1},
 {id:'ethiopia',name:['Lô C · Ethiopia · rang sáng','Lot C · Ethiopia · light roast'],notes:['Hoa & cam chanh','Floral & citrus'],base:[4,1,3],extractability:.9}
];
const cafeGuests = [
 {name:'An',request:['“Một ly dịu, ít chua, đậm vừa thôi nhé.”','“Something mellow, low in acidity, with a medium strength.”'],target:[1,2,3]},
 {name:'Linh',request:['“Tôi thích vị trái cây sáng, nhẹ và ít đắng.”','“I like bright fruit, a light cup and little bitterness.”'],target:[4,1,2]},
 {name:'Minh',request:['“Cho tôi ly đậm, hơi đắng, ít chua để bắt đầu ngày mới.”','“A strong, slightly bitter, low-acidity cup to start my day.”'],target:[1,3,4]}
];
function cafeStart(bean='brazil',heat=92){
 if(!cafeBeans.some(b=>b.id===bean)||![88,92,96].includes(heat))throw Error('Invalid cafe recipe');
 return {bean,heat,time:0,pourTime:0,started:false,wasPouring:false,poured:0,water:0,absorbed:0,drained:0,overflow:0,contact:0,holds:0,extracted:0,solubles:0,cupSolubles:0,lostSolubles:0,events:[],done:false};
}
function cafeTick(state,holding,seconds){
 if(!Number.isFinite(seconds)||seconds<0)throw Error('Invalid timestep');
 if(state.done||(!state.started&&!holding))return {...state};
 const s={...state,events:[...state.events]},dt=Math.min(.1,seconds);
 let added=holding?Math.min(24*dt,180-s.poured):0;
 if(holding&&180-s.poured-added<1)added=180-s.poured;
 const pouring=added>0;
 if(!s.started&&pouring){s.started=true;s.events.push({type:'start',time:0,volume:0});}
 if(pouring!==s.wasPouring){s.events.push({type:pouring?'pour':'pause',time:s.time,volume:s.poured});if(pouring)s.holds++;}
 s.wasPouring=pouring;s.time+=dt*cafeSpeed;s.pourTime+=Math.min(dt,added/24)*cafeSpeed;s.poured+=added;s.water+=added;
 // Fixed 12 g dose, 24 ml water retention. Time advances only after first water.
 const retained=Math.min(s.water,24-s.absorbed);s.absorbed+=retained;s.water-=retained;
 if(s.water>.5){
  s.contact+=dt*cafeSpeed;
  const rate=.009*cafeBeans.find(b=>b.id===s.bean).extractability*Math.exp((s.heat-92)*.035)*Math.min(1,s.water/12);
  const dissolved=(12*.28-s.extracted)*(1-Math.exp(-rate*dt*cafeSpeed));
  s.extracted+=dissolved;s.solubles+=dissolved;
 }
 const spill=Math.max(0,s.water-64);
 const lost=s.water>0?s.solubles*spill/s.water:0;
 s.overflow+=spill;s.water-=spill;s.solubles-=lost;s.lostSolubles+=lost;
 const out=Math.min(s.water,(5+s.water*.12)*dt);
 const cup=s.water>0?s.solubles*out/s.water:0;
 s.water-=out;s.drained+=out;s.solubles-=cup;s.cupSolubles+=cup;
 s.done=s.poured>=179.9&&s.water<.5;
 if(s.done)s.events.push({type:'finish',time:s.time,volume:s.poured});
 return s;
}
function cafeResult(state,guest=0){
 const b=cafeBeans.find(b=>b.id===state.bean);if(!b||!state.done||!cafeGuests[guest])throw Error('Unfinished cup');
 const yieldRatio=state.extracted/12;
 const zone=yieldRatio<.16?'low':yieldRatio>.23?'high':'balanced';
 // No empirical sensory fit: acidity and bitterness stay fictional lot attributes.
 const clamp=n=>Math.max(1,Math.min(5,Math.round(n)));
 const concentration=state.drained>0?state.cupSolubles/state.drained:0;
 const strength=concentration<.009?1:concentration<.012?2:concentration<.016?3:concentration<.019?4:5;
 const flavor=[b.base[0],b.base[1],strength];
 const distance=flavor.reduce((sum,n,i)=>sum+Math.abs(n-cafeGuests[guest].target[i]),0);
 const fit=distance<=1?'great':distance<=3?'close':'different';
 return {version:3,kind:'game_simulation',modelVersion:cafeModelVersion,evidence:{flavor:'fictional_lot_profile',physics:'uncalibrated_game_assumption',sourceReview:'reviewed_documents_not_model_validation',sourceRegisterVersion:'supplied-source-review-v2',confidence:null},bean:state.bean,heat:state.heat,flavor,guest,fit,distance,zone,time:state.time,pourTime:state.pourTime,waitTime:state.time-state.pourTime,overflow:Math.round(state.overflow),beverage:Math.round(state.drained),holds:state.holds,contact:state.contact,events:state.events};
}
function cafeAdvice(r){
 if(r.fit==='great')return 'success';
 if(r.overflow>3)return 'overflow';
 if(r.zone==='low')return r.heat<96?'low':'pulse';
 if(r.zone==='high')return r.heat>88?'high':'pulse';
 return 'profile';
}
function cafeClock(seconds){if(!Number.isFinite(seconds))return '—';const n=Math.max(0,Math.floor(seconds));return `${String(Math.floor(n/60)).padStart(2,'0')}:${String(n%60).padStart(2,'0')}`;}

 function writeBook(next){

 function bindCounter(){

  root.querySelectorAll('.counter-view').forEach(button=>button.onclick=()=>{const r=rounds.find(x=>x.id===button.dataset.id);if(!r)return;result=r;guest=r.guest;lesson=r.lesson||'free';bean=r.bean;heat=r.heat||92;previous=rounds.find(x=>x.id===r.baselineId)||null;screen='result';render();root.querySelector('#cafe-play').focus();});

  root.querySelector('#counter-bookmark')?.addEventListener('click',()=>{if(!savedResult())return;writeBook({...book,favoriteId:book.favoriteId===result.id?null:result.id});render();});

   if(!savedResult())return;const updated={...result,observationAnswer:button.dataset.answer};let next={...book,rounds:rounds.map(r=>r.id===result.id?updated:r)};const nextLesson=counterProgress(next.rounds).next;

  });
 }
 function hint(r){

const weights = { dose: 3, water: 0.16, temp: 4, grind: 3 };

function progression(sessions, counterRounds = []) {

  const xp = sessions.length * 10 + discoveries * 5 + counterProgress(counterRounds).xp;
  const practices=[...sessions,...counterRounds];
  const allDiscoveries=discoveries+counterProgress(counterRounds).completed.length+counterRounds.filter(r=>r.note?.trim()).length;
  const level = Math.floor(xp / 50) + 1;
  const badges = [

const fields = ['dose', 'water', 'temp', 'grind'];
const starterBeans = ['ethiopia', 'colombia', 'brazil'];

// Only saved sessions count. Missions are derived so old journals keep their progress.
function missionProgress(sessions) {
  const visited = starterBeans.filter(bean => sessions.some(s => s.bean === bean));
  const discoveries = sessions.filter(s => typeof s.discovery === 'string' && s.discovery.trim()).length;
  const controlled = sessions.some((current, index) => {
    const previous = sessions[index - 1];
    if (!previous || current.bean !== previous.bean || !(typeof current.discovery === 'string' && current.discovery.trim())) return false;
    if (!fields.every(field => Number.isFinite(current.parameters?.[field]) && Number.isFinite(previous.parameters?.[field]))) return false;
    if(Boolean(current.pourRun)!==Boolean(previous.pourRun))return false;
    if(current.pourRun&&current.pourRun.scenario!==previous.pourRun.scenario)return false;
    if(current.pourRun&&(!validPourRun(current.pourRun,true)||!validPourRun(previous.pourRun,true)))return false;
    const before=previous.pourRun?pourSummary(previous.pourRun).decisions:[];
    const after=current.pourRun?pourSummary(current.pourRun).decisions:[];
    // A response to a newly changed cue is a consequence, not another independent variable.
    const actionChanges=after.filter((decision,i)=>decision.cue===before[i].cue&&decision.action!==before[i].action).length;
    return fields.filter(field => current.parameters[field] !== previous.parameters[field]).length + Number((current.technique || 'pulse') !== (previous.technique || 'pulse')) + actionChanges === 1;
  });
  const steadyBean = starterBeans.find(bean => sessions.filter(s => s.bean === bean && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 90).length >= 3);
  const bestRun = Math.max(0, ...starterBeans.map(bean => sessions.filter(s => s.bean === bean && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 90).length));
  const missions = [
    { id: 'explore', title: 'Meet the beans', description: 'Save one brew with each of the three starter beans.', count: visited.length, total: 3, bean: starterBeans.find(bean => !visited.includes(bean)) },
    { id: 'discover', title: 'Notice something new', description: 'Save three brews with a discovery: what did you notice or want to try next?', count: Math.min(discoveries, 3), total: 3 },
    { id: 'experiment', title: 'Change one thing', description: 'Save two consecutive brews of the same bean with exactly one recipe setting changed. Add a discovery to the second brew.', count: Number(controlled), total: 1 },
    { id: 'steady', title: 'Find your rhythm', description: 'Save three brews of the same bean with a simulated balance of 90 or more. This is a game recipe goal, not a taste assessment.', count: Math.min(bestRun, 3), total: 3, bean: steadyBean }
  ];
  let unlocked = true;
  return missions.map(mission => {
    const complete = mission.count >= mission.total;
    const result = { ...mission, complete, locked: !unlocked };
    unlocked = unlocked && complete;
    return result;
  });
}

const recipeFields = ['dose', 'water', 'temp', 'grind'];
const limits = { dose: [5, 50], water: [50, 800], temp: [75, 100], grind: [1, 40] };
const coffeeBeans = [
  { id: 'ethiopia', name: 'Ethiopia · Washed', target: { dose: 20, water: 300, temp: 94, grind: 18 }, notes: 'floral' },
  { id: 'colombia', name: 'Colombia · Honey', target: { dose: 20, water: 300, temp: 93, grind: 20 }, notes: 'caramel' },

  if (parameters[field] !== bean.target[field]) return { field, direction: parameters[field] > bean.target[field] ? 'lower' : 'raise' };

function gameplayScore(bean,parameters,run) {
 if(!validPourRun(run,true))throw new Error('Complete three decisions first');

 if(!bean.custom){

 }

}

    const feedback=lastPourFeedback?`<div class="decision-feedback ${lastPourFeedback.good?'decision-good':'decision-learn'}" role="status"><strong>${t('previousDecision')} · ${t(lastPourFeedback.stage)}</strong><p>${t(lastPourFeedback.effect+'Effect')}</p></div>`:'';
    const goalHere=retryGoal?.type==='action'&&retryGoal.stage===situation.stage;
    return `<div class="pour-scene"><h3 id="pour-title" tabindex="-1">${pourStep+1} / 3 · ${t(names[pourStep])}</h3>${feedback}<div class="dripper" data-cue="${situation.cue}" aria-hidden="true"><div class="grounds"></div><div class="waterline"></div></div><div class="observation"><span class="eyebrow">${t('observe')}</span><p id="pour-cue"><strong>${t(situation.cue+'Cue')}</strong></p><p>${t(situation.cue+'Detail')}</p></div>${isFirstDecisionRound()?`<p class="coach">${t(situation.cue+'Coach')}</p>`:''}${goalHere?`<p class="coach">${t(situation.recommended===retryGoal.action?'goalThisStep':'goalSituationChanged')}</p>`:''}<h4>${t('choosePour')}</h4><div class="pour-choices" role="group" aria-describedby="pour-cue">${situation.choices.map(action=>`<button class="pour-choice" data-action="${action}" type="button"><strong>${t(action+'Action')}</strong><span>${t(action+'Help')}</span></button>`).join('')}</div><div class="pour-volume"><div class="cup" aria-hidden="true"><div style="height:${poured/recipe.parameters.water*100}%"></div></div><div><progress max="${recipe.parameters.water}" value="${poured}" aria-label="${t('poured')}"></progress><p>${t('poured')}: ${poured} / ${recipe.parameters.water} ml</p><p class="help">${t('nextVolume')}: ${plan[pourStep]} ml (+${plan[pourStep]-poured} ml)</p></div></div><p class="help">${t('virtualTime')}</p><button id="cancel" class="secondary" type="button">${t('cancel')}</button></div>`;
  }
  const hint=beanFor(draft.bean).custom?{field:'custom'}:experimentHint(beanFor(draft.bean),draft.parameters,draft.technique);
  const hintText=hint.field==='custom'?t('customHint'):hint.field==='matched'?t('matched'):hint.field==='technique'?t('techniqueHint'):`${t(hint.direction)} ${t(hint.field).toLowerCase()} ${t('hintEnd')}`;
  const goal=draft.pourRun?nextPourGoal(beanFor(draft.bean),draft.parameters,draft.pourRun):null;
  const goalText=goal?pourGoalText(goal,draft):hintText;
  const decisionSummary=draft.pourRun?pourSummary(draft.pourRun):null;
  const result=`<div class="balance" id="brew-outcome" tabindex="-1" role="group"><span>${t('balance')}</span><strong>${draft.simulatedScore===null?`<small>${t('noCustomScore')}</small>`:`${draft.simulatedScore}<small> / 100</small>`}</strong></div>${decisionSummary?`<p class="${decisionSummary.decisions.at(-1).good?'decision-good':'decision-learn'}">${t(decisionSummary.decisions.at(-1).effect+'Effect')}</p><p class="score-ledger">${draft.simulatedScore===null?t('customDecisionOnly'):`${t('recipeBase')}: ${brewScore(beanFor(draft.bean),draft.parameters,'pulse')} · ${t('decisionImpact')}: −${decisionSummary.penalty}`} · ${decisionSummary.good}/3 ${t('observedWell')}</p>${renderPourReport(draft.pourRun)}`:''}<p class="help">${t('disclaimer')}</p><aside class="experiment"><h3>${t('feedback')}</h3><p>${goalText}</p></aside>`;
  if (stage === 'saved') return `<div class="success" role="status"><h3 id="saved-title" tabindex="-1">${t('saveSuccess')}</h3><p>+${draft.discovery.trim()?15:10} XP</p></div>${result}<div class="actions"><button type="button" id="try-next">${t('tryNextGoal')}</button><button type="button" id="again" class="secondary">${t('retry')}</button><button type="button" id="new" class="secondary">${t('newBrew')}</button></div>`;
  return `${result}<form id="taste"><h3 id="taste-title" tabindex="-1">${t('tasteTitle')}</h3><label>${t('mode')}<select name="ratingMode"><option value="hypothesis" ${draft.ratingMode==='hypothesis'?'selected':''}>${t('hypothesis')}</option><option value="real" ${draft.ratingMode==='real'?'selected':''}>${t('real')}</option></select></label><p class="help">${t('modeHelp')}</p><p class="help">${t('quickReflect')}</p><details id="sensory-details" ${showSensory?'open':''}><summary>${t('sensoryDetails')}</summary><p>${t('ratingsHelp')}</p><div class="fields">${ratingFields()}</div>${ratingSelect('mood',draft.mood)}<p class="help">${t('moodHelp')}</p></details><label>${t('notes')}<textarea name="notes" maxlength="1000" rows="3" placeholder="${t('notesPlaceholder')}">${esc(draft.notes)}</textarea></label><label>${t('discovery')}<textarea name="discovery" maxlength="1000" rows="2" placeholder="${t('discoveryPlaceholder')}">${esc(draft.discovery)}</textarea></label><p id="save-error" role="alert" tabindex="-1">${saveError?t('saveError'):''}</p><div class="actions"><button type="submit" ${journal.writable?'':'disabled'}>${t('save')}</button><button type="button" id="draft-export" class="secondary">${t('draftExport')}</button><button type="button" id="cancel" class="secondary">${t('cancel')}</button></div></form>`;
}
function renderHistory() {
  return `<section class="panel" id="memory"><div class="section-head"><h2>${t('memory')}</h2><button id="export" class="secondary" type="button">${t('export')}</button></div>${sessions.length>1?`<details class="compare"><summary>${t('compare')}</summary><div class="fields"><label>${t('sessionA')}<select id="compare-a">${sessions.map((s,i)=>`<option value="${i}" ${i===sessions.length-2?'selected':''}>#${i+1} · ${esc(beanFor(s.bean).name)}</option>`).join('')}</select></label><label>${t('sessionB')}<select id="compare-b">${sessions.map((s,i)=>`<option value="${i}" ${i===sessions.length-1?'selected':''}>#${i+1} · ${esc(beanFor(s.bean).name)}</option>`).join('')}</select></label></div><div id="comparison"></div><p class="help">${t('compareHelp')}</p></details>`:''}<div id="history">${sessions.length?sessions.slice().reverse().map((s,i)=>`<article class="session"><strong>${esc(s.beanProfile?.name||beanFor(s.bean).name)} · ${scoreLabel(s)}</strong><small>${esc(new Date(s.date).toLocaleString(language==='vi'?'vi-VN':'en-GB'))} · ${modeLabel(s)}</small><p>${t('personal')}: ${tasteMean(s)}/5</p>${s.pourRun?renderPourReport(s.pourRun):''}<p>${esc(s.discovery||t('noDiscovery'))}</p><p>${esc(s.notes||t('noNotes'))}</p><small>${recipeFields.map(k=>`${t(k)}: ${s.parameters[k]}`).join(' · ')} · ${s.technique?t(s.technique):t('noTechnique')}</small>${s.mood?`<p>${t('mood')}: ${esc(s.mood)}/5</p>`:''}<button class="secondary retry" data-session="${sessions.length-1-i}" type="button">${t('retry')}</button></article>`).join(''):`<p>${t('empty')}</p>`}</div></section>`;
}
function render() {
  document.documentElement.lang=language;
  let counterRounds=[];try{counterRounds=loadCounter(localStorage.getItem(counterKey),localStorage.getItem(oldCounterKey)).store.rounds;}catch{}
  const journey=progression(sessions,counterRounds), missions=missionProgress(sessions), active=missions.find(m=>!m.complete&&!m.locked);
  app.innerHTML=`<main><header><div class="section-head"><span class="eyebrow">THE COFFEE SIX SENSE · PHASE 1</span><label class="language">${t('language')}<select id="language"><option value="vi" ${language==='vi'?'selected':''}>Tiếng Việt</option><option value="en" ${language==='en'?'selected':''}>English</option></select></label></div><h1>${t('title')}</h1><p>${t('intro')}</p><details class="guide"><summary>${t('guide')}</summary><p>${t('guideText')}</p></details></header>${!journal.writable?`<div class="warning" role="alert"><p>${t('storageError')}</p>${journal.raw!==undefined?`<button id="recovery" type="button">${t('recovery')}</button>`:''}</div>`:''}<section class="panel" id="desk" aria-labelledby="desk-title"><h2 id="desk-title" tabindex="-1">${t('desk')}</h2><ol class="steps">${['configure','pouring','tasting','saved'].map(k=>`<li ${stage===k?'aria-current="step"':''}>${t(k)}</li>`).join('')}</ol><p id="recipe-message" role="status">${esc(retryGoal&&retrySource&&(stage==='configure'||stage==='pouring')?pourGoalText(retryGoal,retrySource):message)}</p><div id="result">${renderDesk()}</div></section><div id="bean-library"></div><section class="panel journey" aria-labelledby="journey-title"><h2 id="journey-title">${t('journey')}</h2><p><strong>${t('level')} ${journey.level}</strong> · ${journey.xp} XP · ${journey.remaining} ${t('nextLevel')}</p><progress max="50" value="${journey.progress}" aria-label="${t('nextLevel')}"></progress><p>${t('xpText')}</p><details><summary>${t('journey')} · ${journey.badges.filter(b=>b.earned).length}/4</summary><ul class="badges">${journey.badges.map(b=>`<li class="${b.earned?'earned':''}"><strong>${b.earned?'✓':'○'} ${t(b.name)}</strong><small>${t(b.hint)}</small></li>`).join('')}</ul></details></section><section class="panel missions"><div class="section-head"><h2>${t('quests')}</h2><span>${missions.filter(m=>m.complete&&!m.locked).length} / 4 ${t('complete')}</span></div><p>${t('questHelp')}</p><ol class="quest-list">${missions.map(m=>`<li class="quest ${m.locked?'locked':m.complete?'complete':'active'}"><div><strong>${t(m.locked?'locked':m.complete?'complete':'current')} · ${t(m.id+'Title')}</strong><p>${t(m.id+'Description')}</p><span>${m.count} / ${m.total}</span></div>${!m.complete&&!m.locked?`<button id="start-quest" type="button">${t(m.id==='experiment'&&sessions.length?'lastRecipe':'startQuest')}</button>`:''}</li>`).join('')}</ol>${!active?`<p id="quest-message">${t('allQuests')}</p>`:''}</section>${renderHistory()}<footer>${t('disclaimer')}</footer></main>`;
  bind(active);
  window.dispatchEvent(new Event('c6s-journal-changed'));
  renderBeanLibrary({language,onChange:()=>{capture();render();},onBrew:id=>changeRecipe({bean:id,parameters:{...coffeeBeans[0].target},technique:'pulse'},t('customHint'))});
}
function changeRecipe(session, prompt='') {
  if ((stage==='pouring'||stage==='tasting')&&!confirm(t('cancelConfirm'))) return;
  recipe=session?{bean:session.bean,parameters:{...session.parameters},technique:session.technique||'pulse',...(session.pourRun?{scenario:session.pourRun.scenario}:{})}:recipe;
  retryGoal=null;retrySource=null;pourRun=null;lastPourFeedback=null;
  stage='configure';draft=null;pourStep=0;showRecipeControls=true;message=prompt;saveError=false;render();focusOn('#desk-title');
}
function bind(activeMission) {
  document.querySelector('#language').onchange=e=>{capture();language=e.target.value;try{localStorage.setItem('c6s.language',language);}catch{}render();document.querySelector('#language').focus();};
  document.querySelector('#brew')?.addEventListener('input',()=>{capture();document.querySelector('#ratio').textContent=`${t('ratio')}: 1 : ${validRecipe(recipe.parameters)?(recipe.parameters.water/recipe.parameters.dose).toFixed(1):'—'}`;});
  document.querySelector('#brew')?.addEventListener('submit',e=>{e.preventDefault();beginPour();});
  document.querySelector('#quick-play')?.addEventListener('click',()=>beginPour(true));
  document.querySelector('#recipe-controls')?.addEventListener('toggle',e=>{showRecipeControls=e.currentTarget.open;});
  document.querySelector('#sensory-details')?.addEventListener('toggle',e=>{showSensory=e.currentTarget.open;});
  document.querySelector('#brew [name=bean]')?.addEventListener('change',()=>{capture();render();document.querySelector('#brew [name=bean]').focus();});
  document.querySelector('#reference')?.addEventListener('click',()=>{capture();recipe.parameters={...(beanFor(recipe.bean).target||coffeeBeans[0].target)};recipe.technique='pulse';render();focusOn('#desk-title');});
  document.querySelectorAll('.pour-choice').forEach(button=>button.addEventListener('click',event=>{
    if(busy||stage!=='pouring'||event.detail>1||!pourSituation(pourRun).choices.includes(button.dataset.action))return;busy=true;
    const decision=choosePourAction(pourRun,button.dataset.action);pourRun=decision.run;lastPourFeedback=decision.feedback;pourStep=pourRun.actions.length;
    if(pourStep===3){stage='tasting';draft={id:globalThis.crypto?.randomUUID?.()||`brew-${Date.now()}-${Math.random().toString(36).slice(2)}`,date:new Date().toISOString(),bean:recipe.bean,parameters:{...recipe.parameters},technique:recipe.technique,pourRun,...(beanFor(recipe.bean).custom?{beanProfile:{...beanFor(recipe.bean).profile,name:beanFor(recipe.bean).name}}:{}),simulatedScore:gameplayScore(beanFor(recipe.bean),recipe.parameters,pourRun),ratingMode:'hypothesis',taste:{},mood:null,notes:'',discovery:''};}
    render();focusOn(stage==='tasting'?'#brew-outcome':'#pour-title');busy=false;
  }));
  document.querySelector('#cancel')?.addEventListener('click',()=>changeRecipe(null));
  document.querySelector('#taste')?.addEventListener('submit',e=>{
    e.preventDefault();capture();if(!journal.writable||busy)return;busy=true;
    const next=[...sessions,draft];
    try{localStorage.setItem(key,JSON.stringify(next));sessions=next;stage='saved';saveError=false;message='';}
    catch{saveError=true;}
    busy=false;render();focusOn(saveError?'#save-error':'#saved-title');
  });
  document.querySelector('#draft-export')?.addEventListener('click',()=>{capture();download([draft],'coffee-memory-draft.json');});
  document.querySelector('#try-next')?.addEventListener('click',()=>{
    const previous=draft,goal=nextPourGoal(beanFor(previous.bean),previous.parameters,previous.pourRun);
    changeRecipe(previous,pourGoalText(goal,previous));retryGoal=goal;retrySource=previous;
    if(goal.type==='parameter')recipe.parameters[goal.field]=goal.value;
    if(goal.type==='technique')recipe.technique=goal.value;
    render();focusOn('#desk-title');
  });
  document.querySelector('#again')?.addEventListener('click',()=>changeRecipe(draft));
  document.querySelector('#new')?.addEventListener('click',()=>changeRecipe({bean:'ethiopia',parameters:{...coffeeBeans[0].target},technique:'pulse'}));
  document.querySelectorAll('.retry').forEach(button=>button.onclick=()=>changeRecipe(sessions[Number(button.dataset.session)]));
  document.querySelector('#start-quest')?.addEventListener('click',()=>{
    if((stage==='pouring'||stage==='tasting')&&!confirm(t('cancelConfirm')))return;
    capture();stage='configure';draft=null;saveError=false;retryGoal=null;retrySource=null;pourRun=null;lastPourFeedback=null;showRecipeControls=true;
    if(activeMission.id==='experiment'&&sessions.length){const last=sessions.at(-1);recipe={bean:last.bean,parameters:{...last.parameters},technique:last.technique||'pulse',...(last.pourRun?{scenario:last.pourRun.scenario}:{})};}
    if(activeMission.id==='explore'&&activeMission.bean){recipe.bean=activeMission.bean;delete recipe.scenario;recipe.parameters={...(beanFor(recipe.bean).target||coffeeBeans[0].target)};}
    message=t(activeMission.id+'Prompt');render();focusOn('#desk-title');
  });
  document.querySelector('#export').onclick=()=>download(sessions,'coffee-memory.json');
  document.querySelector('#recovery')?.addEventListener('click',()=>download(journal.raw,'coffee-memory-recovery.json',true));
  const ca=document.querySelector('#compare-a'),cb=document.querySelector('#compare-b');
  if(ca&&cb){
    const update=()=>{
      const a=sessions[Number(ca.value)],b=sessions[Number(cb.value)];
      const rows=[...recipeFields.map(k=>[t(k),a.parameters[k],b.parameters[k]]),[t('technique'),a.technique?t(a.technique):t('noTechnique'),b.technique?t(b.technique):t('noTechnique')],[t('balance'),scoreLabel(a),scoreLabel(b)],[t('mode'),modeLabel(a),modeLabel(b)],[t('personal'),tasteMean(a),tasteMean(b)],[t('scoreModel'),t(a.pourRun?'decisionModel':'legacyModel'),t(b.pourRun?'decisionModel':'legacyModel')]];
      document.querySelector('#comparison').innerHTML=ca.value===cb.value?`<p>${t('sameSession')}</p>`:`<div class="table-wrap"><table><thead><tr><th>${t('measure')}</th><th>${t('sessionA')}</th><th>${t('sessionB')}</th></tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,i)=>`<${i?'td':'th'}>${esc(cell)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    };ca.onchange=update;cb.onchange=update;update();
  }
}
render();

initializeBeanLibrary().then(()=>{capture();render();});

window.addEventListener('c6s-counter-changed',()=>{capture();render();});
mountCafe({getJournalSessions:()=>sessions});

</script></body></html>
