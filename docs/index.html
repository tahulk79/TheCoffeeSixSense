ệu nếm từng người hay ma trận đầy đủ để huấn luyện/kiểm chứng dự đoán.','S1 has 27 brewing-condition summaries with means/SD. S5 has 31 attributes as marginal means; individual ratings and a full joint response table are not available for predictor training/validation.')}</li><li>${say('WCR dùng thang tham chiếu 0–15; bài 2020 quy đổi thang đường sang 0–100. Thang tự báo cáo 1–5 của app không tương đương hai thang đó. Cảm giác dày miệng, nồng độ và mức yêu thích là riêng biệt.','WCR uses a 0–15 reference scale; the 2020 paper converts a line scale to 0–100. The app’s self-reported 1–5 scale is not equivalent. Mouthfeel, concentration and liking are distinct.')}</li><li>${say('Bản SCAE có vùng TDS 1,20–1,45%, PE 18–22%. SCA 310-2021 lại là thử máy pha: 55 g/kg, TDS 1,15–1,55% và nhiệt độ slurry 90–96°C theo quy trình. Không trộn thành một vùng “ngon” chung; nhiệt độ slurry không phải nhiệt độ đặt trên ấm.','The SCAE chart shows TDS 1.20–1.45%, PE 18–22%. SCA 310-2021 is a brewer test: 55 g/kg, TDS 1.15–1.55%, and protocol-specific 90–96°C slurry temperature. Do not combine these into a universal “good” zone; slurry temperature is not a kettle setpoint.')}</li><li>${say('Giả định game chưa kiểm chứng: dòng chảy, giữ lại 24 ml, hệ số hòa tan, mức nồng độ, hồ sơ chua/đắng và khẩu vị khách. Đồng hồ ×6 chỉ dùng khi chơi.','Unvalidated game assumptions: flow, 24 ml retention, dissolution coefficients, strength bands, acidity/bitterness profiles and guest preferences. The ×6 clock is for play only.')}</li></ul><h3>${say('Nguồn đã đọc từ tệp cung cấp','Sources reviewed from supplied files')}</h3><p class="help">${say('Đã đọc nội dung, chưa đối chiếu byte với bản tải từ nhà xuất bản. Không đăng lại PDF WCR/SCA.','Contents reviewed; bytes have not been independently checked against publisher downloads. WCR/SCA PDFs are not republished.')}</p><ul>${scienceSources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noopener noreferrer">${s.label[language==='vi'?0:1]}</a></li>`).join('')}</ul><p><a href="${studyReviewUrl}" target="_blank" rel="noopener noreferrer">${say('Bản đối chiếu, phạm vi áp dụng & kiểm tra CSV','Review, applicability & CSV audit')}</a></p></details>`;

const realBrewSchema = 1;
const realBrewProtocol = 'pourover-observation-v1';
const realMeasureFields = ['dose','water','beverage','temperature','brewSeconds','pourSeconds','servingTemperature','holdingSeconds','tds'];
const realSensoryFields = ['acidity','bitterness','sweetness','astringency','strength','body','liking'];
const realMeasureLimits = {dose:[.1,100],water:[1,2000],beverage:[1,2000],temperature:[1,100],brewSeconds:[1,3600],pourSeconds:[0,3600],servingTemperature:[1,100],holdingSeconds:[0,86400],tds:[.01,20]};
function realMeasurements(input){
 if(input.actualBrewConfirmed!==true)throw Error('realconfirmation');
 const measurements={};
 for(const field of realMeasureFields){
  const item=input.measurements?.[field]||{};
  const value=item.value===''||item.value===null||item.value===undefined?null:Number(item.value);
  const source=item.source||'unknown';
  if(!['measured','estimated','unknown','missing'].includes(source)||value!==null&&source==='missing')throw Error('measurement');
  if(value!==null&&(!Number.isFinite(value)||value<realMeasureLimits[field][0]||value>realMeasureLimits[field][1]))throw Error('measurement');
  measurements[field]={value,source:value===null?'missing':source,unit:field==='tds'?'%':field.toLowerCase().includes('temperature')?'C':field.endsWith('Seconds')?'s':'g'};
 }
 const text=k=>String(input[k]||'').trim().slice(0,160);
 const lot=text('lot'),brewer=text('brewer'),grinder=text('grinder'),grindSetting=text('grindSetting');
 if(!lot||!brewer)throw Error('identity');
 if(grindSetting&&!grinder)throw Error('grinder');
 const m=measurements;
 if(m.beverage.value!==null&&m.water.value!==null&&m.beverage.value>m.water.value)throw Error('mass');
 if(m.pourSeconds.value!==null&&m.brewSeconds.value!==null&&m.pourSeconds.value>m.brewSeconds.value)throw Error('time');
 const events=[];
 if(!Array.isArray(input.events||[])||(input.events||[]).length>200)throw Error('timeline');
 for(const e of input.events||[]){
  if((e.seconds===''||e.seconds===null)&&(e.water===''||e.water===null))continue;
  if(e.seconds===''||e.water===''||e.seconds===null||e.water===null)throw Error('timeline');
  const seconds=Number(e.seconds),water=Number(e.water);
  if(!Number.isFinite(seconds)||!Number.isFinite(water)||seconds<0||seconds>3600||water<0||water>2000||!['pour','pause','finish'].includes(e.action))throw Error('timeline');
  if(events.length&&(seconds<events.at(-1).seconds||water<events.at(-1).water))throw Error('timeline');
  if(m.brewSeconds.value!==null&&seconds>m.brewSeconds.value||m.water.value!==null&&water>m.water.value)throw Error('timeline');
  events.push({seconds,water,action:e.action,source:'user_reported'});
 }
 return {actualBrewConfirmed:true,verification:'self_reported_unverified',lot,brewer,grinder,grindSetting,measurementTools:{tdsInstrument:text('tdsInstrument')||String(input.measurementTools?.tdsInstrument||'').slice(0,160),scale:text('scaleDescription')||String(input.measurementTools?.scale||'').slice(0,160),timer:text('timerDescription')||String(input.measurementTools?.timer||'').slice(0,160)},roast:['light','medium','dark','unknown'].includes(input.roast)?input.roast:'unknown',waterDescription:text('waterDescription'),series:text('series'),repeat:text('repeat'),changedVariable:text('changedVariable'),tasterCode:text('tasterCode'),measurements,events};
}
function realObservation(input,metadata={}){
 const observation=realMeasurements(input),sensory={};
 for(const f of realSensoryFields){const raw=input.sensory?.[f];const value=raw===''||raw===undefined||raw===null?null:Number(raw);if(value!==null&&(!Number.isInteger(value)||value<1||value>5))throw Error('sensory');sensory[f]={value,source:value===null?'missing':'self_reported'};}
 const now=new Date().toISOString(),assessed=realSensoryFields.some(f=>sensory[f].value!==null);
 return {schemaVersion:realBrewSchema,kind:'real_brew_observation',sensoryScale:'app_ordinal_1_5_v1',method:'pour_over',predictionModelVersion:null,formulaVersion:'apparent-ey-v1',protocol:realBrewProtocol,id:metadata.id||globalThis.crypto?.randomUUID?.()||`real-${Date.now()}-${Math.random().toString(36).slice(2)}`,startedAt:metadata.startedAt||new Date().toISOString(),recordedAt:now,sensoryRecordedAt:assessed?now:null,sensoryStatus:assessed?'recorded':'not_assessed',sensoryRecordedBeforeAnalysis:assessed,analysisRequestedAt:now,...observation,sensory,notes:String(input.notes||'').slice(0,2000),priorPredictionExposure:['yes','no','unknown'].includes(input.priorPredictionExposure)?input.priorPredictionExposure:'unknown',simulationSeenThisVisit:metadata.simulationSeenThisVisit===true,analysisVersion:'real-analysis-v1',prediction:null,blindTastingVerified:false};
}
function realAnalysis(record){
 const m={...Object.fromEntries(realMeasureFields.map(f=>[f,{value:null,source:'missing'}])),...record.measurements};
 const fields=['dose','beverage','tds'];
 const available=fields.every(f=>m[f].value!==null&&m[f].value>0);
 const ey=available?m.beverage.value*m.tds.value/m.dose.value:null;
 return {apparentExtractionPercent:ey,implausible:ey!==null&&ey>100,basis:!available?'missing':fields.every(f=>m[f].source==='measured')?'from_reported_measurements':fields.some(f=>m[f].source==='estimated')?'includes_estimates':'unclassified_inputs',missing:realMeasureFields.filter(f=>m[f].value===null),canCheckFlow:m.water.value!==null&&m.beverage.value!==null&&m.brewSeconds.value!==null&&['water','beverage','brewSeconds'].every(f=>m[f].source==='measured'),sensoryPrediction:null};
}
function loadRealObservations(raw){
 if(raw===null)return {records:[],writable:true,raw:null};
 try{
  const records=JSON.parse(raw);
  if(!Array.isArray(records)||!records.every(r=>{
   if(!r||r.schemaVersion!==1||r.kind!=='real_brew_observation'||r.protocol!==realBrewProtocol||r.method!=='pour_over'||r.predictionModelVersion!==null||r.formulaVersion!=='apparent-ey-v1'||typeof r.id!=='string'||!Number.isFinite(Date.parse(r.recordedAt))||!(r.sensoryStatus==='recorded'&&Number.isFinite(Date.parse(r.sensoryRecordedAt))&&r.sensoryRecordedBeforeAnalysis===true||r.sensoryStatus==='not_assessed'&&r.sensoryRecordedAt===null&&r.sensoryRecordedBeforeAnalysis===false)||!Number.isFinite(Date.parse(r.startedAt))||r.prediction!==null||r.blindTastingVerified!==false)return false;
   if(r.sensoryScale!==undefined&&r.sensoryScale!=='app_ordinal_1_5_v1')return false;
   const normalized=realMeasurements(r);
   if(!realMeasureFields.every(f=>((f==='servingTemperature'||f==='holdingSeconds')&&!Object.hasOwn(r.measurements||{},f))||(r.measurements?.[f]?.value===normalized.measurements[f].value&&r.measurements[f].unit===normalized.measurements[f].unit&&r.measurements[f].source===normalized.measurements[f].source)))return false;
   return realSensoryFields.every(f=>r.sensory?.[f]&&(r.sensory[f].value===null?r.sensory[f].source==='missing':Number.isInteger(r.sensory[f].value)&&r.sensory[f].value>=1&&r.sensory[f].value<=5&&r.sensory[f].source==='self_reported'));
  }))throw Error();
  return {records,writable:true,raw};
 }catch{return {records:[],writable:false,raw};}
}
function realDataset(records){if(!loadRealObservations(JSON.stringify(records)).writable)throw Error('Only valid real observations may be exported');return {schemaVersion:1,datasetKind:'real_brew_observations',exportedAt:new Date().toISOString(),protocol:realBrewProtocol,units:{mass:'g',time:'real_seconds',temperature:'C',tds:'percent'},purpose:'user_export_no_automatic_training',records};}

 let step='measure',data={measurements:{},events:[],sensory:{}},startedAt=new Date().toISOString(),saved=null,error='',opened=false,simulationSeen=false;
 const say=(vi,en)=>language==='vi'?vi:en;
 const safe=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

 const errorText=code=>({realconfirmation:say('Chỉ ghi dữ liệu ở đây khi đã thực sự pha. Hãy xác nhận hoặc quay lại chế độ mô phỏng.','Only record an actual brew here. Confirm or return to simulation.'),identity:say('Điền tên lô/túi hạt và dụng cụ pha để nhận diện lượt này.','Enter the lot/bag name and brewer to identify this brew.'),grinder:say('Có cỡ xay thì cần tên/model máy xay; các máy không dùng chung thang số.','A grind setting needs a grinder model; settings are not interchangeable.'),measurement:say('Kiểm tra đơn vị và giới hạn các số đo. Trường chưa biết có thể để trống.','Check measurement units and limits. Unknown fields may be left blank.'),mass:say('Lượng đồ uống đang lớn hơn nước rót. Kiểm tra lại cân và đơn vị.','Beverage exceeds water poured. Check weights and units.'),time:say('Thời gian cấp nước không thể lớn hơn tổng thời gian pha.','Pouring time cannot exceed total brew time.'),timeline:say('Mỗi mốc cần cả giây và nước cộng dồn, tăng theo thứ tự và không vượt tổng đã nhập.','Each milestone needs seconds and cumulative water, in order and within entered totals.'),sensory:say('Cảm nhận dùng mức 1–5 hoặc để trống.','Sensory values must be 1–5 or unanswered.'),storage:say('Chưa lưu được. Dữ liệu vẫn còn ở đây: thử lại hoặc tải bản nháp.','Not saved. Your entries remain here: retry or download the draft.')})[code]||say('Dữ liệu chưa hợp lệ.','Invalid data.');
 function download(value,name){const url=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
 function capture(){
  const form=root.querySelector('#real-form');if(!form)return;const f=new FormData(form);
  if(step==='measure'){

   data.events=[...form.querySelectorAll('.real-event')].map(row=>({seconds:row.querySelector('[data-event=seconds]').value,water:row.querySelector('[data-event=water]').value,action:row.querySelector('[data-event=action]').value}));

 function textField(key,label,required=false){return `<label>${label}<input name="${key}" maxlength="160" value="${safe(data[key])}" ${required?'required':''}></label>`;}
 function measures(){return `<label class="check"><input type="checkbox" name="actualBrewConfirmed" ${data.actualBrewConfirmed?'checked':''} required>${say('Đây là lượt pha thật, không phải lượt chơi mô phỏng.','This is an actual brew, not a simulated game round.')}</label><p>${say('Ghi đúng lượt pha thật. Không sao chép thông số hoặc đồng hồ ×6 từ game. Chưa có số liệu thì để trống; không tự điền giá trị mẫu.','Record an actual brew. Do not copy game parameters or the ×6 clock. Leave unknown values empty; no sample values are filled in.')}</p><div class="fields">${textField('lot',say('Tên lô / túi hạt *','Lot / bag name *'),true)}${textField('brewer',say('Dụng cụ / loại phễu *','Brewer / dripper *'),true)}<label>${say('Độ rang','Roast')}<select name="roast">${['unknown','light','medium','dark'].map((v,i)=>`<option value="${v}" ${data.roast===v?'selected':''}>${[say('Chưa biết','Unknown'),say('Sáng','Light'),say('Vừa','Medium'),say('Đậm','Dark')][i]}</option>`).join('')}</select></label>${textField('grinder',say('Máy xay · tên/model','Grinder · make/model'))}${textField('grindSetting',say('Cỡ xay · theo máy trên','Grind setting · for that grinder'))}${textField('waterDescription',say('Nguồn nước / khoáng nếu biết','Water / minerals if known'))}</div><div class="fields">${realMeasureFields.map(k=>`<div class="real-measure"><label>${measureLabel(k)}<input type="number" name="${k}" min="${realMeasureLimits[k][0]}" max="${realMeasureLimits[k][1]}" step="any" value="${safe(data.measurements[k]?.value)}"></label><label class="provenance-label">${say('Cách có số liệu','Value source')}<select name="${k}Source">${['unknown','measured','estimated'].map((v,i)=>`<option value="${v}" ${data.measurements[k]?.source===v?'selected':''}>${[say('Chưa xác định','Unclassified'),say('Đo bằng dụng cụ','Measured with an instrument'),say('Ước lượng','Estimated')][i]}</option>`).join('')}</select></label></div>`).join('')}</div><p class="help">${say('TDS: nhập 1.3 cho 1,3%, không nhập 0.013 const cafeModelVersion = 'counter-assumptions-v3';
// A fictional learning model, not a calibrated extraction or sensory predictor.
const cafeSpeed = 6;
const cafeBeans = [
 {id:'brazil',name:['Lô A · Brazil · rang vừa đậm','Lot A · Brazil · medium-dark roast'],notes:['Chocolate & hạt','Chocolate & nuts'],base:[1,2,3],extractability:1.25},
 {id:'colombia',name:['Lô B · Colombia · rang vừa','Lot B · Colombia · medium roast'],notes:['Caramel & trái cây','Caramel & fruit'],base:[3,2,3],extractability:1},
 {id:'ethiopia',name:['Lô C · Ethiopia · rang sáng','Lot C · Ethiopia · light roast'],notes:['Hoa & cam chanh','Floral & citrus'],base:[4,1,3],extractability:.9}
];
const cafeGuests = [
 {name:'An',request:['“Một ly dịu, ít chua, đậm vừa thôi nhé.”','“Something mellow, low in acidity, with a medium strength.”'],target:[1,2,3]},
 {name:'Linh',request:['“Tôi thích vị trái cây sáng, nhẹ và ít đắng.”','“I like bright fruit, a light cup and little bitterness.”'],target:[4,1,2]},
 {name:'Minh',request:['“Cho tôi ly đậm, hơi đắng, ít chua để bắt đầu ngày mới.”','“A strong, slightly bitter, low-acidity cup to start my day.”'],target:[1,3,4]}
];
function cafeStart(bean='brazil',heat=92){
 if(!cafeBeans.some(b=>b.id===bean)||![88,92,96].includes(heat))throw Error('Invalid cafe recipe');
 return {bean,heat,time:0,pourTime:0,started:false,wasPouring:false,poured:0,water:0,absorbed:0,drained:0,overflow:0,contact:0,holds:0,extracted:0,solubles:0,cupSolubles:0,lostSolubles:0,events:[],done:false};
}
function cafeTick(state,holding,seconds){
 if(!Number.isFinite(seconds)||seconds<0)throw Error('Invalid timestep');
 if(state.done||(!state.started&&!holding))return {...state};
 const s={...state,events:[...state.events]},dt=Math.min(.1,seconds);
 let added=holding?Math.min(24*dt,180-s.poured):0;
 if(holding&&180-s.poured-added<1)added=180-s.poured;
 const pouring=added>0;
 if(!s.started&&pouring){s.started=true;s.events.push({type:'start',time:0,volume:0});}
 if(pouring!==s.wasPouring){s.events.push({type:pouring?'pour':'pause',time:s.time,volume:s.poured});if(pouring)s.holds++;}
 s.wasPouring=pouring;s.time+=dt*cafeSpeed;s.pourTime+=Math.min(dt,added/24)*cafeSpeed;s.poured+=added;s.water+=added;
 // Fixed 12 g dose, 24 ml water retention. Time advances only after first water.
 const retained=Math.min(s.water,24-s.absorbed);s.absorbed+=retained;s.water-=retained;
 if(s.water>.5){
  s.contact+=dt*cafeSpeed;
  const rate=.009*cafeBeans.find(b=>b.id===s.bean).extractability*Math.exp((s.heat-92)*.035)*Math.min(1,s.water/12);
  const dissolved=(12*.28-s.extracted)*(1-Math.exp(-rate*dt*cafeSpeed));
  s.extracted+=dissolved;s.solubles+=dissolved;
 }
 const spill=Math.max(0,s.water-64);
 const lost=s.water>0?s.solubles*spill/s.water:0;
 s.overflow+=spill;s.water-=spill;s.solubles-=lost;s.lostSolubles+=lost;
 const out=Math.min(s.water,(5+s.water*.12)*dt);
 const cup=s.water>0?s.solubles*out/s.water:0;
 s.water-=out;s.drained+=out;s.solubles-=cup;s.cupSolubles+=cup;
 s.done=s.poured>=179.9&&s.water<.5;
 if(s.done)s.events.push({type:'finish',time:s.time,volume:s.poured});
 return s;
}
function cafeResult(state,guest=0){
 const b=cafeBeans.find(b=>b.id===state.bean);if(!b||!state.done||!cafeGuests[guest])throw Error('Unfinished cup');
 const yieldRatio=state.extracted/12;
 const zone=yieldRatio<.16?'low':yieldRatio>.23?'high':'balanced';
 // No empirical sensory fit: acidity and bitterness stay fictional lot attributes.
 const clamp=n=>Math.max(1,Math.min(5,Math.round(n)));
 const concentration=state.drained>0?state.cupSolubles/state.drained:0;
 const strength=concentration<.009?1:concentration<.012?2:concentration<.016?3:concentration<.019?4:5;
 const flavor=[b.base[0],b.base[1],strength];
 const distance=flavor.reduce((sum,n,i)=>sum+Math.abs(n-cafeGuests[guest].target[i]),0);
 const fit=distance<=1?'great':distance<=3?'close':'different';
 return {version:3,kind:'game_simulation',modelVersion:cafeModelVersion,evidence:{flavor:'fictional_lot_profile',physics:'uncalibrated_game_assumption',sourceReview:'reviewed_documents_not_model_validation',sourceRegisterVersion:'supplied-source-review-v2',confidence:null},bean:state.bean,heat:state.heat,flavor,guest,fit,distance,zone,time:state.time,pourTime:state.pourTime,waitTime:state.time-state.pourTime,overflow:Math.round(state.overflow),beverage:Math.round(state.drained),holds:state.holds,contact:state.contact,events:state.events};
}
function cafeAdvice(r){
 if(r.fit==='great')return 'success';
 if(r.overflow>3)return 'overflow';
 if(r.zone==='low')return r.heat<96?'low':'pulse';
 if(r.zone==='high')return r.heat>88?'high':'pulse';

}

 function renderLearning(){

   if(base&&base.lesson==='compare')return `<aside class="discovery-card"><h3>${tx('Bạn nhận ra điều gì?','What did you observe?')}</h3><p>${tx('Ly trước','Previous cup')}: <strong>${base.beverage} ml</strong> · ${tx('Ly này','This cup')}: <strong>${result.beverage} ml</strong>. ${tx('Ly này thu được…','This cup collected…')}</p><div class="actions">${['more','same','less'].map((answer,i)=>`<button class="counter-observe secondary" data-answer="${answer}" ${!savedResult()?'disabled':''}>${[tx('Nhiều hơn','More'),tx('Bằng nhau','The same'),tx('Ít hơn','Less')][i]}</button>`).join('')}</div>${result.observationAnswer?`<p role="status">${tx('Đối chiếu lại hai số “Trong ly”. Thay đổi thao tác không bắt buộc làm mọi mức hương vị đổi theo.','Check the two “In cup” values. A change in handling does not have to change every flavor band.')}</p>`:''}</aside>`;
   return `<aside class="discovery-card"><h3>${at(l.title)}</h3><p>${previous?tx('Để so sánh: giữ cùng hạt và nhiệt độ, đổi số nhịp hoặc thời gian chờ ít nhất 6 giây mô phỏng.','To compare: keep bean and temperature, change pulse count or waiting by at least 6 simulated seconds.'):tx('Ly này là mốc đầu. Pha lại, giữ hạt/nhiệt độ và đổi nhịp; sau đó đọc kết quả hai ly.','This is your baseline. Brew again with the same bean/temperature and a different rhythm, then read the comparison.')}</p></aside>`;

 function bindCounter(){
  root.querySelector('#counter-continue')?.addEventListener('click',()=>{const r=pendingObservation();if(r){result=r;previous=rounds.find(x=>x.id===r.baselineId);lesson='compare';guest=r.guest;bean=r.bean;heat=r.heat;screen='result';render();root.querySelector('#cafe-play').focus();}else chooseLesson(learning().next);});
  root.querySelectorAll('.counter-lesson').forEach(button=>button.onclick=()=>chooseLesson(button.dataset.lesson));
  root.querySelector('#counter-favorite')?.addEventListener('click',()=>{const r=rounds.find(x=>x.id===book.favoriteId);if(!r)return;lesson='free';guest=r.guest;bean=r.bean;heat=r.heat;previous=r;screen='setup';rememberSetup();render();root.querySelector('#cafe-play').focus();});
  root.querySelectorAll('.counter-view').forEach(button=>button.onclick=()=>{const r=rounds.find(x=>x.id===button.dataset.id);if(!r)return;result=r;guest=r.guest;lesson=r.lesson||'free';bean=r.bean;heat=r.heat||92;previous=rounds.find(x=>x.id===r.baselineId)||null;screen='result';render();root.querySelector('#cafe-play').focus();});
  root.querySelector('#counter-save-again')?.addEventListener('click',()=>{writeBook(addCounterRound(book,result));render();});
  root.querySelector('#counter-export')?.addEventListener('click',()=>downloadCounter({kind:'game_counter_backup',store:book,unsaved:savedResult()?null:result},'coffee-counter.json'));
  root.querySelector('#counter-recovery')?.addEventListener('click',()=>downloadCounter({source:loaded.source,raw:loaded.raw},'coffee-counter-recovery.json'));
  root.querySelector('#counter-bookmark')?.addEventListener('click',()=>{if(!savedResult())return;writeBook({...book,favoriteId:book.favoriteId===result.id?null:result.id});render();});
  root.querySelectorAll('.counter-observe').forEach(button=>button.onclick=()=>{
   if(!savedResult())return;const updated={...result,observationAnswer:button.dataset.answer};let next={...book,rounds:rounds.map(r=>r.id===result.id?updated:r)};const nextLesson=counterProgress(next.rounds).next;
   next.resume={lesson:nextLesson,guest:counterLessons.find(l=>l.id===nextLesson)?.guest??guest,bean,heat};
   if(writeBook(next))result=updated;render();
  });
 }
 function hint(r){

   overflow:['Bạn mất đồ uống do tràn. Thử nhịp rót ngắn hơn, giữ nguyên hạt và nhiệt độ. Tràn không tự động có nghĩa là vị nhạt hơn.','Overflow reduced the beverage collected. Try shorter pulses with the same beans and temperature. Overflow does not automatically mean weaker coffee.'],
   low:['Chỉ số hòa tan giả lập ở mức thấp theo ngưỡng thiết kế. Trong game, thử tăng nhiệt độ một nấc và giữ nhịp rót. Không suy ra vị thật từ chỉ số này.','The fictional dissolution index is low by design thresholds. In the game, try one warmer setting with the same rhythm. This index does not predict real taste.'],

   pulse:['Đừng chỉ chờ lâu khi phễu đã cạn. Thử đổi nhịp rót để thay đổi thời gian nước thực sự tiếp xúc bột; giữ nguyên hạt và nhiệt độ.','Waiting with an empty filter does not keep extracting. Change the pouring rhythm to change wet contact, keeping beans and temperature fixed.'],
   profile:['Ly chưa hợp yêu cầu trong game. Thử lô hạt khác, giữ nhiệt độ và nhịp rót; xuất xứ không quyết định sẵn hương vị.','The fictional cup differs from the game order. Try a different lot at the same temperature and rhythm; origin alone does not determine taste.']
  };return at(messages[cafeAdvice(r)])+(r.fit==='great'&&r.overflow>3?tx(' Tuy vậy, bạn đã mất đồ uống do tràn; có thể luyện rót để giảm lãng phí.',' Some beverage was lost to overflow; practice pouring to reduce waste.'):'');

 const zoneLabel=r=>r.zone==='low'?tx('thấp','low'):r.zone==='high'?tx('cao','high'):tx('vùng giữa','middle range');
 function timers(r,live=false){return `<div class="brew-timers ${live?'live-timers':''}"><div><small>${tx('Tổng thời gian pha','Total brew time')}</small><strong ${live?'id="live-clock"':''}>${cafeClock(r.time)}</strong></div><div><small>${tx('Đang cấp nước','Pouring time')}</small><strong ${live?'id="live-pour-clock"':''}>${cafeClock(r.pourTime)}</strong></div><div><small>${tx('Chờ / nước rút','Waiting / draining')}</small><strong ${live?'id="live-wait-clock"':''}>${cafeClock(Math.floor(r.time)-Math.floor(r.pourTime))}</strong></div></div><p class="help time-scale">${tx('Đồng hồ mô phỏng ×6: 1 giây chơi = 6 giây trên đồng hồ. Không phải thời gian chuẩn cho cà phê thật.','Simulation clock ×6: 1 play second = 6 clock seconds. This is not a real brewing-time recommendation.')}</p>`;}
 function timeline(r){return `<details class="brew-timeline"><summary>${tx('Các mốc pha','Brew timeline')}</summary><ol>${(r.events||[]).map(e=>`<li><time>${cafeClock(e.time)}</time> · ${e.type==='start'?tx('Giọt nước đầu tiên','First water'):e.type==='pour'?tx('Bắt đầu rót','Pour started'):e.type==='pause'?tx('Ngừng rót / chờ nước rút','Pour stopped / draining'):tx('Nước chảy xong','Drawdown finished')} · ${Math.round(e.volume)} ml</li>`).join('')}</ol></details>`;}
 function render(){

'pour'?pour():outcome()}</section><p class="help model-note">${tx('Hương vị được tạo bởi mô hình trò chơi, không dự đoán chất lượng hay vị của cà phê thật.','Flavors come from a game model, not a prediction of real coffee taste or quality.')}</p>${sciencePanel(lang)}<button id="studio-toggle" class="secondary">${tx('Hồ sơ hạt & nhật ký · tùy chọn','Bean library & journal · optional')}</button><p class="help">${tx('Tiến độ quầy được lưu trên trình duyệt này khi có thể.','Counter progress is saved in this browser when available.')} ${rounds.length} ${tx('ly đã pha','cups brewed')}.</p></main>`;

 function setup(){return `<h2>${currentLesson()?at(currentLesson().title):tx('Luyện theo nhịp của bạn','Practice your own rhythm')}</h2><p class="challenge-goal">${currentLesson()?at(currentLesson().goal):tx('Luyện rót ít tràn, thử nhịp khác hoặc pha lại công thức đã đánh dấu.','Practice reducing overflow, explore a new rhythm, or repeat your bookmarked recipe.')}</p>${lesson==='free'?`<label>${tx('Khách trong lượt tự do','Free-play guest')}<select id="free-guest">${cafeGuests.map((g,i)=>`<option value="${i}" ${guest===i?'selected':''}>${g.name}</option>`).join('')}</select></label>`:''}<button class="cafe-start cafe-quick">${tx('Pha ngay với lựa chọn bên dưới','Brew with the choices below')}</button><div class="bean-options">${cafeBeans.map(b=>`<label><input type="radio" name="cafe-bean" value="${b.id}" ${bean===b.id?'checked':''}><strong>${at(b.name)}</strong><small>${at(b.notes)} · ${tx('Lô giả lập, không đại diện mọi hạt cùng xuất xứ.','Fictional lot, not representative of all beans from this origin.')}</small></label>`).join('')}</div><label>${tx('Nhiệt độ · một yếu tố ảnh hưởng chiết xuất','Temperature · one factor affecting extraction')}<select id="cafe-heat">${[88,92,96].map(n=>`<option ${heat===n?'selected':''}>${n}</option>`).join('')}</select></label>${previous?`<aside class="experiment">${hint(previous)}</aside>`:''}<button id="cafe-start" class="cafe-start">${tx('Vào bàn rót','Start pouring')}</button><p class="help">${tx('Khoảng 30 giây. Nhấn giữ để rót, thả để nước rút. Không cần dụng cụ thật.','About 30 seconds. Hold to pour; release to let water drain. No equipment needed.')}</p>`;}
 function pour(){return `<h2>${currentLesson()?at(currentLesson().title):tx('Tự tay rót ly của bạn','Pour your own cup')}</h2>${currentLesson()?`<p class="challenge-goal">${at(currentLesson().goal)}</p>`:''}<p>${tx('12 g cà phê · 180 ml nước · cỡ xay cố định. Nhấn giữ để rót, thả để chờ nước rút. Đồng hồ chạy từ giọt đầu.','12 g coffee · 180 ml water · fixed grind. Hold to pour, release to drain. The clock starts with the first water.')}</p>${timers(state,true)}<div class="pour-setting"><span class="brew-steam" aria-hidden="true">∿ ∿ ∿</span><div class="live-brew" aria-hidden="true"><div class="kettle"><span class="kettle-spout"></span><span class="kettle-handle"></span></div><div class="pour-stream"></div><div class="live-filter"><span class="spill-line"></span><div class="live-water"></div><div class="live-grounds"></div></div><div class="drawdown-stream"></div><div class="overflow-stream"></div><div class="live-cup"><div></div></div></div></div><div class="live-stats"><span>${tx('Trong ly','In cup')}: <b id="live-beverage">0</b> ml</span><span>${tx('Đã rót','Poured')}: <b id="live-volume">0</b>/180 ml</span><span>${tx('Tràn','Spilled')}: <b id="live-spill">0</b> ml</span></div><progress id="live-progress" max="180" value="0" aria-label="${tx('Lượng nước đã rót','Water poured')}"></progress><p id="live-status" role="status">${tx('Sẵn sàng. Nhấn giữ để bắt đầu.','Ready. Hold to begin.')}</p><button id="hold-pour" class="hold-pour">${tx('Nhấn giữ để rót','Hold to pour')}</button><button id="toggle-pour" class="secondary">${tx('Bật / tắt rót bằng một lần chạm','Toggle pouring with one tap')}</button><p class="help">${tx('Bàn phím: giữ Space trên nút rót. Nút bật/tắt hỗ trợ thao tác không cần giữ. Chuyển ứng dụng sẽ tạm dừng.','Keyboard: hold Space on the pour button. Use the toggle for hold-free control. Switching apps pauses the game.')}</p><button id="cafe-abort" class="secondary">${tx('Pha lại từ đầu','Restart this cup')}</button>`;}

const weights = { dose: 3, water: 0.16, temp: 4, grind: 3 };
function nextExperiment(bean, parameters) {
  const field = Object.keys(weights).sort((a, b) => Math.abs(parameters[b] - bean.target[b]) * weights[b] - Math.abs(parameters[a] - bean.target[a]) * weights[a])[0];
  if (Number(parameters[field]) === bean.target[field]) return 'You matched this game recipe. Try another bean, or change one setting and compare the results.';
  const names = { dose: 'dose', water: 'water volume', temp: 'temperature', grind: 'grind setting' };
  return `Try ${parameters[field] > bean.target[field] ? 'lowering' : 'raising'} your ${names[field]} next. Keep the other settings unchanged to compare the effect. This hint follows the game model, not a measured extraction.`;
}
function progression(sessions, counterRounds = []) {
  const discoveries = sessions.filter(s => typeof s.discovery === 'string' && s.discovery.trim()).length;
  const xp = sessions.length * 10 + discoveries * 5 + counterProgress(counterRounds).xp;
  const practices=[...sessions,...counterRounds];
  const allDiscoveries=discoveries+counterProgress(counterRounds).completed.length+counterRounds.filter(r=>r.note?.trim()).length;
  const level = Math.floor(xp / 50) + 1;
  const badges = [
    { name: 'First cup', hint: 'Save your first brew', earned: practices.length >= 1 },
    { name: 'Curious taster', hint: 'Record three discoveries', earned: allDiscoveries >= 3 },
    { name: 'Bean explorer', hint: 'Save brews with all three starter beans', earned: ['ethiopia', 'colombia', 'brazil'].every(id => practices.some(s => s.bean === id)) },
    { name: 'Practice makes progress', hint: 'Save five brews', earned: practices.length >= 5 }
  ];
  return { xp, level, remaining: 50 - xp % 50, progress: xp % 50, badges };
}

const fields = ['dose', 'water', 'temp', 'grind'];
const starterBeans = ['ethiopia', 'colombia', 'brazil'];

// Only saved sessions count. Missions are derived so old journals keep their progress.
function missionProgress(sessions) {
  const visited = starterBeans.filter(bean => sessions.some(s => s.bean === bean));
  const discoveries = sessions.filter(s => typeof s.discovery === 'string' && s.discovery.trim()).length;
  const controlled = sessions.some((current, index) => {
    const previous = sessions[index - 1];
    if (!previous || current.bean !== previous.bean || !(typeof current.discovery === 'string' && current.discovery.trim())) return false;
    if (!fields.every(field => Number.isFinite(current.parameters?.[field]) && Number.isFinite(previous.parameters?.[field]))) return false;
    if(Boolean(current.pourRun)!==Boolean(previous.pourRun))return false;
    if(current.pourRun&&current.pourRun.scenario!==previous.pourRun.scenario)return false;
    if(current.pourRun&&(!validPourRun(current.pourRun,true)||!validPourRun(previous.pourRun,true)))return false;
    const before=previous.pourRun?pourSummary(previous.pourRun).decisions:[];
    const after=current.pourRun?pourSummary(current.pourRun).decisions:[];
    // A response to a newly changed cue is a consequence, not another independent variable.
    const actionChanges=after.filter((decision,i)=>decision.cue===before[i].cue&&decision.action!==before[i].action).length;
    return fields.filter(field => current.parameters[field] !== previous.parameters[field]).length + Number((current.technique || 'pulse') !== (previous.technique || 'pulse')) + actionChanges === 1;
  });
  const steadyBean = starterBeans.find(bean => sessions.filter(s => s.bean === bean && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 90).length >= 3);
  const bestRun = Math.max(0, ...starterBeans.map(bean => sessions.filter(s => s.bean === bean && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 90).length));
  const missions = [
    { id: 'explore', title: 'Meet the beans', description: 'Save one brew with each of the three starter beans.', count: visited.length, total: 3, bean: starterBeans.find(bean => !visited.includes(bean)) },
    { id: 'discover', title: 'Notice something new', description: 'Save three brews with a discovery: what did you notice or want to try next?', count: Math.min(discoveries, 3), total: 3 },
    { id: 'experiment', title: 'Change one thing', description: 'Save two consecutive brews of the same bean with exactly one recipe setting changed. Add a discovery to the second brew.', count: Number(controlled), total: 1 },
    { id: 'steady', title: 'Find your rhythm', description: 'Save three brews of the same bean with a simulated balance of 90 or more. This is a game recipe goal, not a taste assessment.', count: Math.min(bestRun, 3), total: 3, bean: steadyBean }
  ];
  let unlocked = true;
  return missions.map(mission => {
    const complete = mission.count >= mission.total;
    const result = { ...mission, complete, locked: !unlocked };
    unlocked = unlocked && complete;
    return result;
  });
}

const recipeFields = ['dose', 'water', 'temp', 'grind'];
const limits = { dose: [5, 50], water: [50, 800], temp: [75, 100], grind: [1, 40] };
const coffeeBeans = [
  { id: 'ethiopia', name: 'Ethiopia · Washed', target: { dose: 20, water: 300, temp: 94, grind: 18 }, notes: 'floral' },
  { id: 'colombia', name: 'Colombia · Honey', target: { dose: 20, water: 300, temp: 93, grind: 20 }, notes: 'caramel' },
  { id: 'brazil', name: 'Brazil · Natural', target: { dose: 20, water: 300, temp: 92, grind: 22 }, notes: 'chocolate' }
];
function validRecipe(parameters) {
  return recipeFields.every(k => Number.isFinite(parameters?.[k]) && parameters[k] >= limits[k][0] && parameters[k] <= limits[k][1]);
}
function brewScore(bean, parameters, technique = 'pulse') {
  if (!bean || !validRecipe(parameters) || !['pulse', 'steady', 'fast'].includes(technique)) throw new Error('Invalid recipe');
  const weights = { dose: 3, water: 0.16, temp: 4, grind: 3 };
  return Math.max(0, Math.round(100 - recipeFields.reduce((sum, k) => sum + Math.abs(parameters[k] - bean.target[k]) * weights[k], 0) - ({pulse:0,steady:4,fast:12}[technique])));
}
function pourPlan(parameters) {
  if (!validRecipe(parameters)) throw new Error('Invalid recipe');
  const bloom = Math.min(Math.round(parameters.dose * 2), Math.floor(parameters.water / 3));
  return [bloom, Math.round((parameters.water + bloom) / 2), parameters.water];
}
function experimentHint(bean, parameters, technique) {
  const weights = { dose: 3, water: 0.16, temp: 4, grind: 3 };
  const field = recipeFields.slice().sort((a,b) => Math.abs(parameters[b]-bean.target[b])*weights[b]-Math.abs(parameters[a]-bean.target[a])*weights[a])[0];
  if (parameters[field] !== bean.target[field]) return { field, direction: parameters[field] > bean.target[field] ? 'lower' : 'raise' };
  return { field: technique === 'pulse' ? 'matched' : 'technique' };
}
function loadJournal(raw) {
  if (raw === null) return { sessions: [], writable: true };
  try {
    const sessions = JSON.parse(raw);
    const optionalText = (s, key) => s[key] === undefined || typeof s[key] === 'string';
    const validTaste = taste => taste === undefined || taste === null || (typeof taste === 'object' && !Array.isArray(taste) && ['aroma','acidity','sweetness','bitterness','body','aftertaste'].every(k => taste[k] === undefined || taste[k] === null || (Number.isInteger(taste[k]) && taste[k] >= 1 && taste[k] <= 5)));
    const validSavedRun = run => run === undefined || (run && run.version === 1 && Number.isInteger(run.scenario) && run.scenario >= 0 && run.scenario <= 2 && ['pulse','steady','fast'].includes(run.technique) && Array.isArray(run.actions) && run.actions.length === 3 && run.actions.every((action,index) => [['swirl','settle'],['pause','feed','redistribute'],['recenter','finishEven']][index].includes(action)));
    const validOptional = s => validSavedRun(s.pourRun) && (s.pourRun === undefined || s.pourRun.technique === s.technique) && optionalText(s,'notes') && optionalText(s,'discovery') && validTaste(s.taste) && (s.technique === undefined || ['pulse','steady','fast'].includes(s.technique)) && (s.ratingMode === undefined || ['real','hypothesis'].includes(s.ratingMode)) && (s.mood === undefined || s.mood === null || (Number.isInteger(s.mood) && s.mood >= 1 && s.mood <= 5));
    if (!Array.isArray(sessions) || !sessions.every(s => s && validOptional(s) && (coffeeBeans.some(b => b.id === s.bean) || (typeof s.bean === 'string' && /^custom-[a-zA-Z0-9-]+$/.test(s.bean) && typeof s.beanProfile?.name === 'string' && s.beanProfile.name.trim().length > 0 && s.beanProfile.name.length <= 160)) && validRecipe(s.parameters) && typeof s.date === 'string' && Number.isFinite(Date.parse(s.date)) && ((s.bean.startsWith('custom-') && s.simulatedScore === null) || (!s.bean.startsWith('custom-') && Number.isFinite(s.simulatedScore) && s.simulatedScore >= 0 && s.simulatedScore <= 100)))) throw new Error('Invalid journal');
    return { sessions, writable: true };
  } catch { return { sessions: [], writable: false, raw }; }
}
function tasteMean(session) {
  const values = ['aroma','acidity','sweetness','bitterness','body','aftertaste'].map(k => session.taste?.[k]).filter(n => Number.isFinite(n) && n >= 1 && n <= 5);
  return values.length ? (values.reduce((a,b) => a+b,0) / values.length).toFixed(1) : '—';
}

const pourStageNames = ['bloom','middle','finish'];
const pourChoices = [['swirl','settle'],['pause','feed','redistribute'],['recenter','finishEven']];
function validPourRun(run, complete=false) {
 return Boolean(run && run.version===1 && Number.isInteger(run.scenario) && run.scenario>=0 && run.scenario<=2 && ['pulse','steady','fast'].includes(run.technique) && Array.isArray(run.actions) && run.actions.length<=3 && (!complete||run.actions.length===3) && run.actions.every((action,index)=>pourChoices[index].includes(action)));
}
function createPourRun(scenario=0,technique='pulse') {
 const run={version:1,scenario,technique,actions:[]};if(!validPourRun(run))throw new Error('Invalid pour run');return run;
}
function evaluatePourChoice(run,index,action) {
 const before={...run,actions:run.actions.slice(0,index)};const cue=pourSituation(before);
 const good=action===cue.recommended;
 return {stage:pourStageNames[index],cue:cue.cue,action,good,penalty:good?0:cue.penalty,effect:good?cue.success:cue.miss};
}
function pourSituation(run) {
 if(!validPourRun(run)||run.actions.length>=3)throw new Error('No active pour stage');
 const index=run.actions.length;let cue,recommended,success,miss,penalty;
 if(index===0){
  const dry=run.technique==='fast'||run.scenario===2||(run.technique==='pulse'&&run.scenario===0);
  cue=dry?'dryBloom':'evenBloom';recommended=dry?'swirl':'settle';success=dry?'wetGrounds':'keptBed';miss=dry?'leftDry':'extraAgitation';penalty=6;
 }else if(index===1){
  const first=evaluatePourChoice(run,0,run.actions[0]);
  cue=first.effect==='leftDry'?'unevenFlow':run.technique==='fast'||run.scenario===0?'highWater':'lowWater';
  recommended=cue==='unevenFlow'?'redistribute':cue==='highWater'?'pause':'feed';
  success=cue==='unevenFlow'?'recoveredFlow':cue==='highWater'?'drainedWater':'maintainedWater';
  miss=cue==='unevenFlow'?'keptUneven':cue==='highWater'?'crowdedWater':'lostWater';penalty=8;
 }else{
  const middle=evaluatePourChoice(run,1,run.actions[1]);
  const tilted=!middle.good||run.scenario===2;
  cue=tilted?'tiltedBed':'levelBed';recommended=tilted?'recenter':'finishEven';success=tilted?'centeredFinish':'calmFinish';miss=tilted?'leftTilted':'disturbedFinish';penalty=6;
 }
 return {stage:pourStageNames[index],cue,recommended,success,miss,penalty,choices:pourChoices[index]};
}
function choosePourAction(run,action) {
 const situation=pourSituation(run);if(!situation.choices.includes(action))throw new Error('Invalid choice for this stage');
 const feedback=evaluatePourChoice(run,run.actions.length,action);
 return {run:{...run,actions:[...run.actions,action]},feedback};
}
function pourSummary(run) {
 if(!validPourRun(run))throw new Error('Invalid pour run');
 const decisions=run.actions.map((action,index)=>evaluatePourChoice(run,index,action));
 return {decisions,penalty:decisions.reduce((sum,d)=>sum+d.penalty,0),good:decisions.filter(d=>d.good).length};
}
function gameplayScore(bean,parameters,run) {
 if(!validPourRun(run,true))throw new Error('Complete three decisions first');
 if(!bean||!validRecipe(parameters))throw new Error('Invalid recipe');
 if(bean.custom)return null;
 return Math.max(0,brewScore(bean,parameters,'pulse')-pourSummary(run).penalty);
}
function nextPourGoal(bean,parameters,run) {
 if(!validPourRun(run,true))throw new Error('Complete three decisions first');
 const summary=pourSummary(run);const mistake=summary.decisions.find(d=>!d.good);
 if(mistake){const before={...run,actions:run.actions.slice(0,pourStageNames.indexOf(mistake.stage))};return {type:'action',stage:mistake.stage,action:pourSituation(before).recommended};}
 if(!bean.custom){
  const hint=experimentHint(bean,parameters,'pulse');
  if(hint.field!=='matched'){
   const steps={dose:1,water:10,temp:1,grind:1};const direction=hint.direction==='raise'?1:-1;
   const target=bean.target[hint.field];const next=direction>0?Math.min(target,parameters[hint.field]+steps[hint.field]):Math.max(target,parameters[hint.field]-steps[hint.field]);
   return {type:'parameter',field:hint.field,value:Math.max(limits[hint.field][0],Math.min(limits[hint.field][1],next))};
  }
 }
 return {type:'technique',value:run.technique==='fast'?'steady':run.technique==='steady'?'fast':run.scenario===0?'steady':'fast'};
}

  app.innerHTML=`<main><header><div class="section-head"><span class="eyebrow">THE COFFEE SIX SENSE · PHASE 1</span><label class="language">${t('language')}<select id="language"><option value="vi" ${language==='vi'?'selected':''}>Tiếng Việt</option><option value="en" ${language==='en'?'selected':''}>English</option></select></label></div><h1>${t('title')}</h1><p>${t('intro')}</p><details class="guide"><summary>${t('guide')}</summary><p>${t('guideText')}</p></details></header>${!journal.writable?`<div class="warning" role="alert"><p>${t('storageError')}</p>${journal.raw!==undefined?`<button id="recovery" type="button">${t('recovery')}</button>`:''}</div>`:''}<section class="panel" id="desk" aria-labelledby="desk-title"><h2 id="desk-title" tabindex="-1">${t('desk')}</h2><ol class="steps">${['configure','pouring','tasting','saved'].map(k=>`<li ${stage===k?'aria-current="step"':''}>${t(k)}</li>`).join('')}</ol><p id="recipe-message" role="status">${esc(retryGoal&&retrySource&&(stage==='configure'||stage==='pouring')?pourGoalText(retryGoal,retrySource):message)}</p><div id="result">${renderDesk()}</div></section><div id="bean-library"></div><section class="panel journey" aria-labelledby="journey-title"><h2 id="journey-title">${t('journey')}</h2><p><strong>${t('level')} ${journey.level}</strong> · ${journey.xp} XP · ${journey.remaining} ${t('nextLevel')}</p><progress max="50" value="${journey.progress}" aria-label="${t('nextLevel')}"></progress><p>${t('xpText')}</p><details><summary>${t('journey')} · ${journey.badges.filter(b=>b.earned).length}/4</summary><ul class="badges">${journey.badges.map(b=>`<li class="${b.earned?'earned':''}"><strong>${b.earned?'✓':'○'} ${t(b.name)}</strong><small>${t(b.hint)}</small></li>`).join('')}</ul></details></section><section class="panel missions"><div class="section-head"><h2>${t('quests')}</h2><span>${missions.filter(m=>m.complete&&!m.locked).length} / 4 ${t('complete')}</span></div><p>${t('questHelp')}</p><ol class="quest-list">${missions.map(m=>`<li class="quest ${m.locked?'locked':m.complete?'complete':'active'}"><div><strong>${t(m.locked?'locked':m.complete?'complete':'current')} · ${t(m.id+'Title')}</strong><p>${t(m.id+'Description')}</p><span>${m.count} / ${m.total}</span></div>${!m.complete&&!m.locked?`<button id="start-quest" type="button">${t(m.id==='experiment'&&sessions.length?'lastRecipe':'startQuest')}</button>`:''}</li>`).join('')}</ol>${!active?`<p id="quest-message">${t('allQuests')}</p>`:''}</section>${renderHistory()}<footer>${t('disclaimer')}</footer></main>`;
  bind(active);
  window.dispatchEvent(new Event('c6s-journal-changed'));
  renderBeanLibrary({language,onChange:()=>{capture();render();},onBrew:id=>changeRecipe({bean:id,parameters:{...coffeeBeans[0].target},technique:'pulse'},t('customHint'))});
}
function changeRecipe(session, prompt='') {
  if ((stage==='pouring'||stage==='tasting')&&!confirm(t('cancelConfirm'))) return;
  recipe=session?{bean:session.bean,parameters:{...session.parameters},technique:session.technique||'pulse',...(session.pourRun?{scenario:session.pourRun.scenario}:{})}:recipe;
  retryGoal=null;retrySource=null;pourRun=null;lastPourFeedback=null;
  stage='configure';draft=null;pourStep=0;showRecipeControls=true;message=prompt;saveError=false;render();focusOn('#desk-title');
}
function bind(activeMission) {
  document.querySelector('#language').onchange=e=>{capture();language=e.target.value;try{localStorage.setItem('c6s.language',language);}catch{}render();document.querySelector('#language').focus();};
  document.querySelector('#brew')?.addEventListener('input',()=>{capture();document.querySelector('#ratio').textContent=`${t('ratio')}: 1 : ${validRecipe(recipe.parameters)?(recipe.parameters.water/recipe.parameters.dose).toFixed(1):'—'}`;});
  document.querySelector('#brew')?.addEventListener('submit',e=>{e.preventDefault();beginPour();});
  document.querySelector('#quick-play')?.addEventListener('click',()=>beginPour(true));
  document.querySelector('#recipe-controls')?.addEventListener('toggle',e=>{showRecipeControls=e.currentTarget.open;});
  document.querySelector('#sensory-details')?.addEventListener('toggle',e=>{showSensory=e.currentTarget.open;});
  document.querySelector('#brew [name=bean]')?.addEventListener('change',()=>{capture();render();document.querySelector('#brew [name=bean]').focus();});
  document.querySelector('#reference')?.addEventListener('click',()=>{capture();recipe.parameters={...(beanFor(recipe.bean).target||coffeeBeans[0].target)};recipe.technique='pulse';render();focusOn('#desk-title');});
  document.querySelectorAll('.pour-choice').forEach(button=>button.addEventListener('click',event=>{
    if(busy||stage!=='pouring'||event.detail>1||!pourSituation(pourRun).choices.includes(button.dataset.action))return;busy=true;
    const decision=choosePourAction(pourRun,button.dataset.action);pourRun=decision.run;lastPourFeedback=decision.feedback;pourStep=pourRun.actions.length;
    if(pourStep===3){stage='tasting';draft={id:globalThis.crypto?.randomUUID?.()||`brew-${Date.now()}-${Math.random().toString(36).slice(2)}`,date:new Date().toISOString(),bean:recipe.bean,parameters:{...recipe.parameters},technique:recipe.technique,pourRun,...(beanFor(recipe.bean).custom?{beanProfile:{...beanFor(recipe.bean).profile,name:beanFor(recipe.bean).name}}:{}),simulatedScore:gameplayScore(beanFor(recipe.bean),recipe.parameters,pourRun),ratingMode:'hypothesis',taste:{},mood:null,notes:'',discovery:''};}
    render();focusOn(stage==='tasting'?'#brew-outcome':'#pour-title');busy=false;
  }));
  document.querySelector('#cancel')?.addEventListener('click',()=>changeRecipe(null));
  document.querySelector('#taste')?.addEventListener('submit',e=>{
    e.preventDefault();capture();if(!journal.writable||busy)return;busy=true;
    const next=[...sessions,draft];
    try{localStorage.setItem(key,JSON.stringify(next));sessions=next;stage='saved';saveError=false;message='';}
    catch{saveError=true;}
    busy=false;render();focusOn(saveError?'#save-error':'#saved-title');
  });
  document.querySelector('#draft-export')?.addEventListener('click',()=>{capture();download([draft],'coffee-memory-draft.json');});
  document.querySelector('#try-next')?.addEventListener('click',()=>{
    const previous=draft,goal=nextPourGoal(beanFor(previous.bean),previous.parameters,previous.pourRun);
    changeRecipe(previous,pourGoalText(goal,previous));retryGoal=goal;retrySource=previous;
    if(goal.type==='parameter')recipe.parameters[goal.field]=goal.value;
    if(goal.type==='technique')recipe.technique=goal.value;
    render();focusOn('#desk-title');
  });
  document.querySelector('#again')?.addEventListener('click',()=>changeRecipe(draft));
  document.querySelector('#new')?.addEventListener('click',()=>changeRecipe({bean:'ethiopia',parameters:{...coffeeBeans[0].target},technique:'pulse'}));
  document.querySelectorAll('.retry').forEach(button=>button.onclick=()=>changeRecipe(sessions[Number(button.dataset.session)]));
  document.querySelector('#start-quest')?.addEventListener('click',()=>{
    if((stage==='pouring'||stage==='tasting')&&!confirm(t('cancelConfirm')))return;
    capture();stage='configure';draft=null;saveError=false;retryGoal=null;retrySource=null;pourRun=null;lastPourFeedback=null;showRecipeControls=true;
    if(activeMission.id==='experiment'&&sessions.length){const last=sessions.at(-1);recipe={bean:last.bean,parameters:{...last.parameters},technique:last.technique||'pulse',...(last.pourRun?{scenario:last.pourRun.scenario}:{})};}
    if(activeMission.id==='explore'&&activeMission.bean){recipe.bean=activeMission.bean;delete recipe.scenario;recipe.parameters={...(beanFor(recipe.bean).target||coffeeBeans[0].target)};}
    message=t(activeMission.id+'Prompt');render();focusOn('#desk-title');
  });
  document.querySelector('#export').onclick=()=>download(sessions,'coffee-memory.json');
  document.querySelector('#recovery')?.addEventListener('click',()=>download(journal.raw,'coffee-memory-recovery.json',true));
  const ca=document.querySelector('#compare-a'),cb=document.querySelector('#compare-b');
  if(ca&&cb){
    const update=()=>{
      const a=sessions[Number(ca.value)],b=sessions[Number(cb.value)];
      const rows=[...recipeFields.map(k=>[t(k),a.parameters[k],b.parameters[k]]),[t('technique'),a.technique?t(a.technique):t('noTechnique'),b.technique?t(b.technique):t('noTechnique')],[t('balance'),scoreLabel(a),scoreLabel(b)],[t('mode'),modeLabel(a),modeLabel(b)],[t('personal'),tasteMean(a),tasteMean(b)],[t('scoreModel'),t(a.pourRun?'decisionModel':'legacyModel'),t(b.pourRun?'decisionModel':'legacyModel')]];
      document.querySelector('#comparison').innerHTML=ca.value===cb.value?`<p>${t('sameSession')}</p>`:`<div class="table-wrap"><table><thead><tr><th>${t('measure')}</th><th>${t('sessionA')}</th><th>${t('sessionB')}</th></tr></thead><tbody>${rows.map(row=>`<tr>${row.map((cell,i)=>`<${i?'td':'th'}>${esc(cell)}</${i?'td':'th'}>`).join('')}</tr>`).join('')}</tbody></table></div>`;
    };ca.onchange=update;cb.onchange=update;update();
  }
}
render();

initializeBeanLibrary().then(()=>{capture();render();});

window.addEventListener('c6s-counter-changed',()=>{capture();render();});
mountCafe({getJournalSessions:()=>sessions});

</script></body></html>
